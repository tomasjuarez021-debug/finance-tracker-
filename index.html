<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pulso">
  <title>Pulso</title>
  <meta name="application-name" content="Pulso">
  <meta name="theme-color" content="#0b0e11">
  <link rel="apple-touch-icon" href="pulso-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="pulso-icon.png">
  <link rel="icon" type="image/png" href="pulso-icon.png">
  <link rel="shortcut icon" type="image/png" href="pulso-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e11;
      --surface: #161a1f;
      --surface2: #1e2329;
      --border: #2b3139;
      --border2: #363c45;
      --text: #eaecef;
      --text2: #848e9c;
      --text3: #5a6270;
      --accent: #f0b90b;
      --gold2: #ffd54a;
      --green: #0ecb81;
      --red: #f6465d;
      --blue: #4a9eff;
      --hero-bg: linear-gradient(135deg,#3a2c05 0%,#1d1806 45%,#161a1f 100%);
      --hero-border: rgba(240,185,11,.35);
      --chip-bg: rgba(0,0,0,.25);
      --shadow: none;
      --overlay: rgba(0,0,0,.7);
      --nav-bg: rgba(22,26,31,.85);
      --mono: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --sans: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    :root[data-theme="light"]{
      --bg:#f4f5f7; --surface:#ffffff; --surface2:#f1f3f6; --border:#e6e8ec; --border2:#d5d9df;
      --text:#0f172a; --text2:#64748b; --text3:#94a3b8;
      --gold2:#a87900; --green:#059669; --red:#e11d48; --blue:#2563eb;
      --hero-bg: linear-gradient(135deg,#fff1bd 0%,#fff9e8 55%,#ffffff 100%);
      --hero-border: rgba(240,185,11,.5);
      --chip-bg: rgba(255,255,255,.75);
      --shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 20px rgba(15,23,42,.06);
      --overlay: rgba(15,23,42,.45);
      --nav-bg: rgba(255,255,255,.88);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-family:var(--sans);background:var(--bg);color:var(--text);font-weight:400;font-size:14px}
    button,input,select{font-family:inherit}
    button{cursor:pointer}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
    select option{background:var(--surface2);color:var(--text)}

    /* ─── LAYOUT ─── */
    .app{display:flex;min-height:100vh}
    .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:24px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:hidden;transition:width .2s ease,padding .2s ease,opacity .15s ease}
    .sidebar.collapsed{width:0;padding:24px 0;border-right:none;opacity:0;pointer-events:none}
    .sidebar-collapse{position:fixed;left:208px;top:50%;transform:translateY(-50%);width:16px;height:48px;border:1px solid var(--border);border-left:none;border-radius:0 6px 6px 0;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:10px;z-index:20;transition:left .2s ease}
    .sidebar-collapse:hover{background:var(--surface2);color:var(--text)}
    .sidebar-collapsed .sidebar-collapse{left:0;border-left:1px solid var(--border)}
    .sidebar-collapsed .main{padding-left:32px}

    .brand{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:-0.5px;padding:8px 12px 16px;color:var(--text)}
    .brand span{color:var(--accent)}

    .tab-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border:none;border-radius:6px;background:transparent;color:var(--text2);font-size:13px;font-weight:400;text-align:left;width:100%;transition:.12s;letter-spacing:.2px}
    .tab-btn:hover{background:var(--surface2);color:var(--text)}
    .tab-btn.active{background:var(--surface2);color:var(--accent);font-weight:500}
    .tab-btn .icon{font-family:var(--mono);font-size:11px;width:18px;text-align:center;color:var(--text3)}
    .tab-btn.active .icon{color:var(--accent)}

    .side-card{margin-top:auto;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px}
    .side-card .k{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--mono)}
    .side-card .v{font-size:20px;font-weight:500;font-family:var(--mono);color:var(--text)}
    .side-card .sub{font-size:11px;font-weight:400;margin-top:4px;font-family:var(--mono)}
    .sub.ok{color:var(--green)}.sub.bad{color:var(--red)}

    .main{flex:1;padding:28px 24px;overflow:auto}

    /* ─── TYPOGRAPHY ─── */
    .page-title{font-family:var(--mono);font-size:18px;font-weight:500;margin-bottom:20px;letter-spacing:-0.3px;color:var(--text);border-bottom:1px solid var(--border);padding-bottom:14px}
    .section-title{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}

    /* ─── CARDS ─── */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px}
    .cards-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
    .cards-2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:16px}
    .content-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
    .assets-grid{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
    .invest-grid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}

    .stat-label{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .stat-val{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-0.5px;color:var(--text)}
    .stat-val.green{color:var(--green)}.stat-val.red{color:var(--red)}.stat-val.yellow{color:var(--accent)}

    /* ─── FORMS ─── */
    .field{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:13px;font-family:var(--mono);color:var(--text);outline:none;transition:.12s}
    .field:focus{border-color:var(--accent);background:var(--surface2)}
    .field::placeholder{color:var(--text3)}
    .label{display:block;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
    .form-stack{display:flex;flex-direction:column;gap:10px}

    /* ─── BUTTONS ─── */
    .btn{border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:500;font-family:var(--mono);letter-spacing:.3px;transition:.12s}
    .btn-accent{background:var(--accent);color:#0b0e11}
    .btn-accent:hover{background:#f8c914}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
    .btn-ghost:hover{border-color:var(--border2);color:var(--text)}
    .btn-danger{background:transparent;border:1px solid var(--border);color:var(--red);font-size:11px;padding:5px 9px;border-radius:4px}
    .btn-danger:hover{background:rgba(246,70,93,.1)}

    /* ─── SEGMENT ─── */
    .seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px;gap:3px;margin-bottom:14px}
    .seg-btn{flex:1;border:none;border-radius:4px;padding:7px 0;background:transparent;color:var(--text2);font-size:12px;font-weight:400;font-family:var(--mono);letter-spacing:.3px;transition:.12s}
    .seg-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}

    /* ─── TABLE ROWS ─── */
    .row-hover{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;border-bottom:1px solid var(--border)}
    .row-hover:last-child{border-bottom:none}
    .row-hover:hover{background:var(--surface2)}
    .amount-positive{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--green)}
    .amount-negative{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--red)}
    .amount-neutral{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--text)}

    /* ─── BADGES ─── */
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:500;font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase}
    .badge-green{background:rgba(14,203,129,.12);color:var(--green)}
    .badge-red{background:rgba(246,70,93,.12);color:var(--red)}
    .badge-yellow{background:rgba(240,185,11,.12);color:var(--accent)}
    .badge-blue{background:rgba(74,158,255,.12);color:var(--blue)}
    .badge-gray{background:var(--surface2);color:var(--text2)}

    /* ─── CALENDAR ─── */
    .calendar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
    .cal-head{font-family:var(--mono);font-size:9px;font-weight:400;color:var(--text3);padding-bottom:5px;letter-spacing:.5px}
    .cal-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;height:32px;font-family:var(--mono);font-size:12px;font-weight:400;color:var(--text2);transition:.1s}
    .cal-cell:hover{background:var(--surface2);color:var(--text)}
    .dot{width:4px;height:4px;border-radius:50%;margin-top:2px}

    /* ─── WALLET CARD ─── */
    .wallet{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)}
    .wallet:hover{border-color:var(--border2)}
    .wallet-left{display:flex;align-items:center;gap:12px}
    .wallet-tag{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
    .wallet-amount{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--text)}
    .wallet-actions{display:flex;align-items:center;gap:8px}

    /* ─── BARS ─── */
    .bar{height:3px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:6px}
    .bar > div{height:100%;border-radius:3px}

    /* ─── PIE CHART ─── */
    .pie-wrap{display:flex;align-items:center;gap:14px}
    .legend{display:flex;flex-direction:column;gap:5px;flex:1}
    .legend-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}
    .legend-left{display:flex;align-items:center;gap:8px;min-width:0}
    .sw{width:8px;height:8px;border-radius:2px;flex-shrink:0}
    .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:11px;color:var(--text2)}
    .legend-pct{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--text)}

    /* ─── INVEST ─── */
    .invest-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px}
    .invest-name{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text)}
    .invest-rate{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--accent)}
    .invest-meta{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
    .projected-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12px}
    .projected-row:last-child{border-bottom:none}

    /* ─── NOTIFICATION TOAST ─── */
    .toast{position:fixed;bottom:80px;right:20px;background:var(--surface2);border:1px solid var(--accent);border-radius:6px;padding:10px 16px;font-family:var(--mono);font-size:12px;color:var(--text);z-index:100;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
    .toast.show{opacity:1;transform:translateY(0)}

    /* ─── MISC ─── */
    .empty{padding:24px;text-align:center;color:var(--text3);font-family:var(--mono);font-size:12px;letter-spacing:.5px}
    .muted{color:var(--text2)}
    .hide{display:none}
    .head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .divider{height:1px;background:var(--border);margin:14px 0}
    .ticker{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.5px}

    /* ─── WALLET SELECTOR IN FORM ─── */
    .wallet-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
    .wallet-pill{border:1px solid var(--border);border-radius:16px;padding:7px 12px;font-size:13px !important;background:transparent;color:var(--text2);font-family:var(--mono);font-size:11px;cursor:pointer;transition:.1s}
    .wallet-pill:hover{border-color:var(--border2);color:var(--text)}
    .wallet-pill.selected{border-color:var(--accent);color:var(--accent);background:rgba(240,185,11,.06)}

    /* ─── RESUMEN: HERO ─── */
    .hero{background:var(--hero-bg);border:1px solid var(--hero-border);border-radius:20px;padding:18px 16px;box-shadow:var(--shadow);margin-bottom:16px;text-align:center}
    .hero-acc{background:none;border:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:2px;margin:0 auto}
    .hero-acc-label{font-size:12px;color:var(--gold2)}
    .hero-acc-val{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--text)}
    .acc-chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;justify-content:center;flex-wrap:wrap}
    .acc-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(240,185,11,.3);background:var(--chip-bg);color:var(--text2);border-radius:20px;padding:5px 12px;font-size:12px;white-space:nowrap}
    .acc-chip.sel{background:var(--accent);color:#0b0e11;border-color:var(--accent);font-weight:600}
    .month-nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.5px}
    .month-nav button{background:none;border:none;color:var(--gold2);font-size:22px;padding:0 12px}
    .resumen-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .seg-btn.seg-red{background:var(--red);color:#fff}
    .seg-btn.seg-green{background:var(--green);color:#0b0e11}
    .btn-red{background:var(--red);color:#fff}.btn-red:hover{filter:brightness(1.1)}
    .btn-green{background:var(--green);color:#0b0e11}.btn-green:hover{filter:brightness(1.1)}

    /* ─── ANILLO DE CATEGORÍAS ─── */
    .cat-ico{color:#fff;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.18)}
    .cat-ico-add{background:var(--surface2);color:var(--text2);border:1px dashed var(--border2)}
    .ring-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 4px;align-items:center}
    .ring-slot{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--text);padding:4px 0;border-radius:10px;transition:.12s;min-width:0}
    .ring-slot:hover{background:var(--surface2)}
    .ring-slot:active{transform:scale(.95)}
    .ring-name{font-size:11px;color:var(--text2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ring-amt{font-family:var(--mono);font-size:11px;font-weight:600}
    .ring-center{grid-row:2/4;grid-column:2/4;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .ring-center-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

    /* ─── BALANCE / BARRAS ─── */
    .bal-row{display:flex;align-items:center;padding:14px 16px}
    .bal-count{width:38px;height:38px;border-radius:50%;border:2px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px}
    .split{display:grid;grid-template-columns:1fr 1fr}
    .split button{border:none;padding:10px;font-size:12px;text-align:center;opacity:.75}
    .split button b{font-family:var(--mono);font-size:17px;display:block;margin-top:2px}
    .split button.sel{opacity:1}
    .split-red{background:var(--red);color:#fff}
    .split-green{background:rgba(14,203,129,.15);color:var(--green)}
    .split-green.sel{background:var(--green);color:#0b0e11}
    .split-red:not(.sel){background:rgba(246,70,93,.15);color:var(--red)}
    .bars-wrap{position:relative;padding:18px 12px 22px;border-bottom:1px solid var(--border)}
    .bars-max{position:absolute;right:12px;top:2px;font-family:var(--mono);font-size:10px;color:var(--text3)}
    .bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--border2)}
    .bar-col{flex:1;height:100%;display:flex;flex-direction:column-reverse;cursor:pointer;border-radius:2px 2px 0 0;overflow:hidden}
    .bar-col:hover{background:var(--surface2)}
    .bar-col.sel{background:rgba(240,185,11,.12);outline:1px solid rgba(240,185,11,.4)}
    .bars-ticks{position:relative;height:14px;font-family:var(--mono);font-size:10px;color:var(--text3)}
    .bars-ticks span{position:absolute;top:3px;transform:translateX(-50%)}
    .mini-stats{display:grid;grid-template-columns:repeat(3,1fr)}
    .mini-stats>div{padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--border)}
    .mini-stats>div:last-child{border-right:none}
    .mini-stats span{font-size:11px;color:var(--text2)}
    .mini-stats b{font-family:var(--mono);font-size:13px;font-weight:600}
    .cat-row{display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer;border-radius:8px}
    .cat-row:hover{background:var(--surface2)}
    .cat-row-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* ─── MODALES / SELECTOR DE CATEGORÍAS ─── */
    .modal-bg{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:14px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
    .cat-pick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px}
    .cat-pick{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:2px solid transparent;border-radius:12px;padding:6px 2px;color:var(--text2);font-size:11px;min-width:0}
    .cat-pick span:last-child{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cat-pick:hover{background:var(--surface2)}
    .cat-pick.sel{border-color:var(--accent);background:rgba(240,185,11,.08);color:var(--text)}
    .cat-pick-grid.small{padding:2px}
    .cat-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto}
    .cat-list-row{display:flex;align-items:center;gap:10px;font-size:13px}
    .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
    .emoji-btn{background:var(--surface2);border:2px solid transparent;border-radius:8px;padding:6px 0;color:var(--text);display:flex;align-items:center;justify-content:center}
    .emoji-btn.sel{border-color:var(--accent)}
    .color-grid{display:flex;flex-wrap:wrap;gap:8px}
    .color-btn{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
    .color-btn.sel{border-color:var(--text)}


    /* ─── TIPOGRAFÍA ESTILO APP ─── */
    .page-title{font-size:20px;font-weight:500;letter-spacing:0}
    .section-title{font-size:15px;font-weight:500;color:var(--text);text-transform:none;letter-spacing:0}
    .stat-label,.label,.wallet-tag,.invest-meta,.side-card .k{text-transform:none;letter-spacing:0;font-size:12px;color:var(--text2)}
    .badge{letter-spacing:0;font-size:11px;text-transform:none;border-radius:10px}
    .btn,.seg-btn,.tab-btn,.bottom-nav-btn,.wallet-pill,.empty,.ticker{letter-spacing:0}
    .seg-btn{font-size:13px;font-weight:500}
    .btn{font-weight:500;font-size:14px;border-radius:8px}
    .empty{font-size:13px}

function walletValueARS(w){
  const saldo=Number(w.saldo||0);
  const usd=state.quotes.usd||null;
  const btc=state.quotes.btc||null;
  const usdt=state.quotes.usdt||null;
  if(w.moneda==='ARS') return saldo;
  if(w.moneda==='USD' && usd) return saldo*usd;
  if(w.moneda==='USDT' && usdt && usd) return saldo*usdt*usd;
  if(w.moneda==='BTC' && btc && usd) return saldo*btc*usd;
  return null;
}

// Inversiones convertidas a ARS
function investValueARS(i){
  const v=walletValueARS({saldo:i.capital,moneda:i.moneda});
  return v!==null?v:Number(i.capital||0);
}
function totalInvestARS(){ return state.invest.reduce((a,i)=>a+investValueARS(i),0); }
// Patrimonio = billeteras + inversiones
function patrimonioARS(){
  return state.wallets.reduce((a,w)=>{const v=walletValueARS(w);return a+(v!==null?v:Number(w.saldo||0));},0) + totalInvestARS();
}

// ─── PERSISTENCIA — SAFARI COMPATIBLE ───
// Estrategia: los datos viven dentro del propio archivo HTML en <script id="SAVED_DATA">.
// Al guardar: (1) localStorage para sesión inmediata.
//             (2) genera y descarga automáticamente el HTML actualizado con los datos embebidos.
// El usuario reemplaza el archivo descargado con el anterior → datos siempre adentro del HTML.

let _saveTimer = null;
let _pendingDownload = false;

function load(k, fb){
  // Primero leer desde el bloque embebido en este mismo HTML
  try {
    const el = document.getElementById('SAVED_DATA');
    if(el && el.textContent.trim()){
      const all = JSON.parse(el.textContent);
      if(all[k] !== undefined) return all[k];
    }
  } catch(e){}
  // Fallback: localStorage (misma sesión)
  try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch { return fb; }
}

function save(k, v){
  localStorage.setItem(k, JSON.stringify(v));
}

function buildUpdatedHTML(){
  const allData = {
    ct_txns:    state.txns,
    ct_wallets: state.wallets,
    ct_invest:  state.invest,
    ct_quotes:  state.quotes,
    ct_cats:    state.cats,
  };
  const dataJSON = JSON.stringify(allData);
  const html = document.documentElement.outerHTML;
  // Reemplazar el bloque SAVED_DATA con los datos actuales
  const updated = html.replace(
    /<script id="SAVED_DATA"[^>]*>[\s\S]*?<\/script>/,
    `<script id="SAVED_DATA" type="application/json">${dataJSON}<\/script>`
  );
  return '<!DOCTYPE html>\n' + updated;
}

function autoSaveHTML(){

  if(!state.txns.length && !state.wallets.length) return;

function downloadHTML(){
  const html = buildUpdatedHTML();
  const blob = new Blob([html], {type:'text/html'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'pulso.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup guardado (pulso.html)');
}

// Monto: solo números, acepta coma o punto decimal
function bindMontoInput(el){
  const f=()=>{
    let v=el.value;
    if(v.endsWith('.')) v=v.slice(0,-1)+',';      // el punto tipeado al final es decimal
    const neg=v.trim().startsWith('-');
    v=v.replace(/[^0-9,]/g,'');
    const k=v.indexOf(',');
    let ent=k>=0?v.slice(0,k):v, dec=k>=0?v.slice(k+1).replace(/,/g,'').slice(0,2):null;
    ent=ent.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    el.value=(neg?'-':'')+ent+(dec!==null?','+dec:'');
  };
  el.addEventListener('input',f);
  if(el.value) f();
}

// ─── PROJECTED YIELD ───
// Compuesto mensual: ciclo iterativo explícito mes a mes
// Simple: capital × (TNA/100) × (meses/12)
function proyectar(capital, tna_pct, meses, compuesto){
  const cap = Number(capital) || 0;
  const tna = Number(tna_pct) || 0;
  const m   = Number(meses)   || 0;
  if(cap <= 0 || tna <= 0 || m <= 0) return cap;

  if(compuesto === true){
    // Ciclo explícito: cada mes suma los intereses al saldo
    let saldo = cap;
    const tasaMensual = tna / 100 / 12;
    for(let i = 0; i < m; i++){
      saldo = saldo + saldo * tasaMensual;
    }
    return saldo;
  } else {
    // Interés simple: lineal
    return cap + cap * (tna / 100) * (m / 12);
  }
}

// ─── PIE CARD ───
function pieCard(title, data, colors){
  if(!data.length) return '';  // No mostrar nada si no hay datos
  const total = data.reduce((a,[,v])=>a+v,0);
  const cx=56,cy=56,r=46;
  let slices;
  if(data.length===1){
    // Un solo elemento: círculo completo
    slices=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${colors[0]}"></circle>`;
  } else {
    let cum=-90;
    slices = data.map(([cat,val],i)=>{
      const pct=val/total, angle=pct*360;
      // Cap angle slightly below 360 to avoid degenerate arc
      const safeAngle=Math.min(angle,359.99);
      const s=(cum*Math.PI)/180; cum+=angle; const e=(cum*Math.PI)/180;
      const x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s),x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
      return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r},0,${safeAngle>180?1:0},1,${x2},${y2} Z" fill="${colors[i%colors.length]}"></path>`;
    }).join('');
  }
  const legend = data.slice(0,6).map(([cat,val],i)=>`
    <div class="legend-row">
      <div class="legend-left"><span class="sw" style="background:${colors[i%colors.length]}"></span><span class="truncate">${esc(cat)}</span></div>
      <span class="legend-pct">${Math.round(val/total*100)}%</span>
    </div>`).join('');
  return `
    <div class="card">
      <div class="section-title">${title}</div>
      <div class="pie-wrap">
        <svg width="112" height="112" viewBox="0 0 112 112">${slices}<circle cx="${cx}" cy="${cy}" r="20" fill="#161a1f"></circle></svg>
        <div class="legend">${legend}</div>
      </div>
    </div>`;
}

  return state.walletFilter==='all' ? state.txns : state.txns.filter(t=>t.walletId===state.walletFilter);
}

// ─── MODAL GENÉRICO ───
function openModal(html){
  const modal=document.createElement('div');
  modal.className='modal-bg';
  modal.innerHTML=`<div class="modal">${html}</div>`;
  document.body.appendChild(modal);
  modal.onclick=e=>{ if(e.target===modal) modal.remove(); };
  return modal;
}

// ─── ALTA RÁPIDA DE MOVIMIENTO ───
function addTxn(txn){
  state.txns.unshift(txn);
  save('ct_txns',state.txns);
  applyTxnToWallet(txn, txn.walletId);
  const w=state.wallets.find(x=>x.id===txn.walletId);
  if(w) showToast(`${w.nombre}: ${fmt(w.saldo)}`);
  render();
}
function openTxnModal(catNombre, tipo){
  const cat=getCat(catNombre, tipo);
  let walletId = state.walletFilter!=='all' ? state.walletFilter : (state.formWallet || state.wallets[0]?.id);
  if(!state.wallets.length){ showToast('Primero agregá una billetera en Activos'); return; }
  const modal=openModal(`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      ${catIcon(cat,44)}
      <div>
        <div style="font-weight:600;font-size:15px">${esc(cat.nombre)}</div>
        <div class="badge ${tipo==='ingreso'?'badge-green':'badge-red'}" style="margin-top:4px">${tipo==='ingreso'?'Ingreso':'Gasto'}</div>
      </div>
    </div>
    <div class="form-stack">
      <div><label class="label">Monto</label><div class="amount-box ${tipo}"><span class="amount-cur">$</span><input id="qMonto" class="amount-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0"></div></div>
      <div><label class="label">Billetera</label><div class="wallet-pills" id="qWallets"></div></div>
      <div><label class="label">Fecha</label><input id="qFecha" class="field" type="date" value="${todayStr()}"></div>
      <div><label class="label">Descripción</label><input id="qDesc" class="field" type="text" placeholder="Opcional"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button id="qSave" class="btn ${tipo==='ingreso'?'btn-green':'btn-red'}" style="flex:1">REGISTRAR</button>
      <button id="qCancel" class="btn btn-ghost">CANCELAR</button>
    </div>`);
  const drawWallets=()=>{
    const el=modal.querySelector('#qWallets');
    el.innerHTML=state.wallets.map(w=>`<button class="wallet-pill ${walletId===w.id?'selected':''}" data-w="${w.id}">${esc(w.nombre)}</button>`).join('');
    el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{walletId=Number(b.dataset.w);drawWallets();});
  };
  drawWallets();

    if(!monto||monto<=0||!walletId) return;
    modal.remove();
    addTxn({id:Date.now(),tipo,categoria:cat.nombre,monto,descripcion:modal.querySelector('#qDesc').value.trim(),fecha:modal.querySelector('#qFecha').value||todayStr(),walletId});
  };
}

// ─── GESTIÓN DE CATEGORÍAS ───
function openCatModal(tipo, onDone){
  let icon=CAT_ICON_KEYS[0], color=CAT_COLORS[0], editing=null; // editing = nombre de la categoría en edición
  const modal=openModal(`
    <div class="modal-title">Categorías de ${tipo==='ingreso'?'ingresos':'gastos'}</div>
    <div class="cat-list" id="cmList"></div>
    <div class="divider"></div>
    <div class="section-title" id="cmFormTitle" style="margin-bottom:8px">Nueva categoría</div>
    <div class="form-stack">
      <div style="display:flex;gap:10px;align-items:center">
        <span id="cmPreview"></span>
        <input id="cmNombre" class="field" type="text" placeholder="Ej: Gato, Gimnasio, Nafta…" style="flex:1">
      </div>
      <div><label class="label">Color</label><div class="color-grid" id="cmColors"></div></div>
      <div><label class="label">Ícono</label><div class="emoji-grid" id="cmEmojis"></div></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button id="cmSave" class="btn btn-accent" style="flex:1">Agregar</button>
      <button id="cmClose" class="btn btn-ghost">Cerrar</button>
    </div>`);
  const nombreEl=modal.querySelector('#cmNombre');
  const setMode=c=>{
    editing=c?c.nombre:null;
    if(c){ icon=c.icon; color=c.color; nombreEl.value=c.nombre; }
    else { icon=CAT_ICON_KEYS[0]; color=CAT_COLORS[0]; nombreEl.value=''; }
    modal.querySelector('#cmFormTitle').textContent=c?`Editar "${c.nombre}"`:'Nueva categoría';
    modal.querySelector('#cmSave').textContent=c?'Guardar cambios':'Agregar';
    modal.querySelector('#cmClose').textContent=c?'Cancelar':'Cerrar';
    draw();
    if(c) modal.querySelector('#cmFormTitle').scrollIntoView({behavior:'smooth',block:'start'});
  };
  const draw=()=>{
    modal.querySelector('#cmPreview').innerHTML=catIcon({icon,color},40);
    modal.querySelector('#cmEmojis').innerHTML=CAT_ICON_KEYS.map(e=>`<button class="emoji-btn ${e===icon?'sel':''}" data-e="${e}">${svgIcon(e,20)}</button>`).join('');
    modal.querySelector('#cmColors').innerHTML=CAT_COLORS.map(c=>`<button class="color-btn ${c===color?'sel':''}" data-c="${c}" style="background:${c}"></button>`).join('')
      + `<label class="color-btn color-custom" title="Otro color" style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)"><input type="color" id="cmCustom" value="${/^#[0-9a-f]{6}$/i.test(color)?color:'#f0b90b'}"></label>`;
    modal.querySelector('#cmList').innerHTML=catsOf(tipo).map(c=>`
      <div class="cat-list-row ${editing===c.nombre?'editing':''}" data-editcat="${esc(c.nombre)}">${catIcon(c,30)}<span style="flex:1">${esc(c.nombre)}</span><span class="cat-edit-hint">${svgIcon('pencil',16)}</span><button class="btn-danger" data-delcat="${esc(c.nombre)}">✕</button></div>`).join('') || `<div class="empty">Sin categorías</div>`;
    modal.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{icon=b.dataset.e;draw();});
    modal.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;draw();});
    modal.querySelector('#cmCustom').oninput=e=>{color=e.target.value;modal.querySelector('#cmPreview').innerHTML=catIcon({icon,color},40);};
    modal.querySelector('#cmCustom').onchange=()=>draw();
    modal.querySelectorAll('[data-editcat]').forEach(r=>r.onclick=()=>setMode(state.cats.find(c=>c.tipo===tipo&&c.nombre===r.dataset.editcat)));
    modal.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      if(!confirm(`¿Eliminar la categoría "${b.dataset.delcat}"? Los movimientos existentes se conservan.`)) return;
      state.cats=state.cats.filter(c=>!(c.tipo===tipo && c.nombre===b.dataset.delcat));
      save('ct_cats',state.cats);
      if(editing===b.dataset.delcat) setMode(null); else draw();
    });
  };
  draw();
  const close=()=>{ modal.remove(); (onDone||render)(); };
  modal.querySelector('#cmClose').onclick=()=>{ if(editing) setMode(null); else close(); };
  modal.onclick=e=>{ if(e.target===modal) close(); };
  modal.querySelector('#cmSave').onclick=()=>{
    const nombre=nombreEl.value.trim();
    if(!nombre) return;
    const dup=state.cats.some(c=>c.tipo===tipo && c.nombre.toLowerCase()===nombre.toLowerCase() && c.nombre!==editing);
    if(dup){ showToast('Esa categoría ya existe'); return; }
    if(editing){
      const c=state.cats.find(x=>x.tipo===tipo&&x.nombre===editing);
      if(nombre!==editing){ // renombrar también los movimientos
        state.txns.forEach(t=>{ if(t.tipo===tipo&&t.categoria===editing) t.categoria=nombre; });
        save('ct_txns',state.txns);
        if(state.formCat===editing) state.formCat=nombre;
      }
      Object.assign(c,{nombre,icon,color});
      save('ct_cats',state.cats);
      showToast(`"${nombre}" actualizada`);
      setMode(null);
    } else {
      state.cats.push({nombre,tipo,icon,color});
      save('ct_cats',state.cats);
      nombreEl.value='';
      showToast(`Categoría "${nombre}" agregada`);
      draw();
    }
  };
}

// ─── DONUT ───
function donutSVG(data, total, size=168){
  const r=size/2-12, c=2*Math.PI*r, cx=size/2;
  let off=0;
  const segs = total>0 ? data.map(d=>{
    const len=d.val/total*c;
    const gap=data.length>1?Math.min(3,len*.3):0;
    const s=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${d.color}" stroke-width="16" stroke-dasharray="${Math.max(len-gap,0.01)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cx})"></circle>`;
    off+=len; return s;
  }).join('') : '';
  return `<svg width="100%" viewBox="0 0 ${size} ${size}" style="max-width:${size}px"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="16"></circle>${segs}</svg>`;
}

// ─── RENDER RESUMEN ───
function renderResumen(){
  const root=document.getElementById('tab-resumen');
  if(state.walletFilter!=='all' && !state.wallets.some(w=>w.id===state.walletFilter)) state.walletFilter='all';
  const [yy,mm]=state.calDate.split('-').map(Number);
  const monthKey=`${yy}-${String(mm).padStart(2,'0')}`;
  const monthLabel=new Date(yy,mm-1).toLocaleString('es-AR',{month:'long',year:'numeric'});
  const daysInMonth=new Date(yy,mm,0).getDate();
  const tipo=state.viewTipo;

  // Movimientos del mes (filtrados por billetera)
  const monthTxns=filteredTxns().filter(t=>t.fecha.startsWith(monthKey)).map(t=>({...t,ars:txnARS(t)})).filter(t=>t.ars!==null);
  const mIng=monthTxns.filter(t=>t.tipo==='ingreso').reduce((a,t)=>a+t.ars,0);
  const mGas=monthTxns.filter(t=>t.tipo==='gasto').reduce((a,t)=>a+t.ars,0);
  const mBalance=mIng-mGas;
  const viewTxns=monthTxns.filter(t=>t.tipo===tipo);
  const viewTotal=tipo==='gasto'?mGas:mIng;

  const byCat={};

  const catData=Object.entries(byCat).map(([n,v])=>({...getCat(n,tipo),val:v})).sort((a,b)=>b.val-a.val);

  // Encabezado: saldo según filtro
  const fw=state.walletFilter!=='all'?state.wallets.find(w=>w.id===state.walletFilter):null;
  const headLabel=fw?fw.nombre:'Todas las cuentas';

  // Slots alrededor del anillo: 11 categorías + "Más"
  const cats=catsOf(tipo);
  const slotCats=cats.slice(0,11);
  const pos=[[1,1],[1,2],[1,3],[1,4],[2,1],[2,4],[3,1],[3,4],[4,1],[4,2],[4,3]];

      ${catIcon(c, 46)}

      <span class="ring-amt" style="color:var(--text3)">${cats.length>11?`+${cats.length-11}`:'+ nueva'}</span>
    </button>`;

  // Gráfico de barras diario (apilado por categoría)
  const days={};
  viewTxns.forEach(t=>{const d=Number(t.fecha.slice(8,10));(days[d]=days[d]||{});days[d][t.categoria]=(days[d][t.categoria]||0)+t.ars;});
  const maxDay=Math.max(1,...Object.values(days).map(o=>Object.values(o).reduce((a,b)=>a+b,0)));
  const selDay=state.calDate.startsWith(monthKey)?Number(state.calDate.slice(8,10)):null;
  let bars='';
  for(let d=1;d<=daysInMonth;d++){
    const o=days[d]||{};
    const stack=Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div style="height:${v/maxDay*100}%;background:${getCat(n,tipo).color}"></div>`).join('');
    bars+=`<div class="bar-col ${selDay===d?'sel':''}" data-day="${d}" title="${d}">${stack}</div>`;
  }
  const ticks=[1,10,17,24,daysInMonth].map(d=>`<span style="left:${(d-.5)/daysInMonth*100}%">${d}</span>`).join('');

  // Día promedio / hoy / semana
  const now=new Date(); const isCurMonth=now.getFullYear()===yy&&now.getMonth()+1===mm;
  const daysElapsed=isCurMonth?now.getDate():daysInMonth;
  const todayVal=viewTxns.filter(t=>t.fecha===todayStr()).reduce((a,t)=>a+t.ars,0);
  const weekAgo=new Date(now.getTime()-6*86400000).toISOString().split('T')[0];
  const weekVal=filteredTxns().filter(t=>t.tipo===tipo&&t.fecha>=weekAgo&&t.fecha<=todayStr()).reduce((a,t)=>a+(txnARS(t)||0),0);
  const tipoColor=tipo==='gasto'?'var(--red)':'var(--green)';

  // Movimientos del día seleccionado
  const dayTxns=filteredTxns().filter(t=>t.fecha===state.calDate);

  root.innerHTML=`
    <div class="hero">
      <div class="hero-top">
        <button class="hero-acc" id="accBtn">
          <span class="hero-acc-label">${esc(headLabel)} ▾</span>
          <span class="hero-acc-val" style="color:${mBalance<0?'var(--red)':'var(--green)'}">${headVal}</span>
          <span class="hero-sub">Saldo del mes</span>
        </button>
      </div>
      <div class="acc-chips">
        <button class="acc-chip ${state.walletFilter==='all'?'sel':''}" data-acc="all">Todas</button>
        ${state.wallets.map(w=>`<button class="acc-chip ${state.walletFilter===w.id?'sel':''}" data-acc="${w.id}"><span class="sw" style="background:${w.color||'var(--accent)'}"></span>${esc(w.nombre)}</button>`).join('')}
      </div>
      <div class="month-nav">
        <button id="prevMonth">‹</button>
        <span style="display:inline-flex;align-items:center;gap:8px">${svgIcon('calendar',18)} ${monthLabel.toUpperCase()}</span>
        <button id="nextMonth">›</button>
      </div>
    </div>

    <div class="cards-2 resumen-grid">
      <div class="card ring-card">
        <div class="seg" style="margin-bottom:12px">
          <button class="seg-btn ${tipo==='gasto'?'active seg-red':''}" data-vt="gasto">Gastos</button>
          <button class="seg-btn ${tipo==='ingreso'?'active seg-green':''}" data-vt="ingreso">Ingresos</button>
        </div>
        <div class="ring-grid">
          ${slotHTML}
          <div class="ring-center" id="ringCenter">
            ${donutSVG(catData,viewTotal)}
            <div class="ring-center-txt">
              <div style="font-size:12px;color:var(--text2)">${tipo==='gasto'?'Gastos':'Ingresos'}</div>
              <div style="font-size:22px;font-weight:500;color:${tipoColor}">${fmtShort(viewTotal)}</div>
              <div style="font-family:var(--mono);font-size:11px;color:${tipo==='gasto'?'var(--green)':'var(--red)'}">${fmtShort(tipo==='gasto'?mIng:mGas)}</div>
            </div>
          </div>
        </div>
        <div style="text-align:center;font-size:11px;color:var(--text3);margin-top:10px">Tocá una categoría para registrar un ${tipo}</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="card" style="padding:0;overflow:hidden">
          <div class="bal-row">
            <div style="flex:1;text-align:center">
              <div style="font-size:12px;color:var(--text2)">Balance</div>
              <div style="font-family:var(--mono);font-size:22px;font-weight:600;color:${mBalance>=0?'var(--green)':'var(--red)'}">${mBalance>=0?'':'-'}${fmt(Math.abs(mBalance))}</div>
            </div>
            <div class="bal-count" title="Movimientos del mes">${monthTxns.length}</div>
          </div>
          <div class="split">

            <div class="bars">${bars}</div>
            <div class="bars-ticks">${ticks}</div>

          <div class="mini-stats">
            <div><span>Día (prom.)</span><b style="color:${tipoColor}">${fmt(viewTotal/Math.max(daysElapsed,1))}</b></div>
            <div><span>Hoy</span><b style="color:${todayVal?tipoColor:'var(--text3)'}">${fmt(todayVal)}</b></div>
            <div><span>Semana</span><b style="color:${tipoColor}">${fmt(weekVal)}</b></div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">${tipo==='gasto'?'Gastos':'Ingresos'} por categoría</div>
          ${catData.length?catData.map(c=>{
            const pct=viewTotal>0?c.val/viewTotal*100:0;
            return `<div class="cat-row" data-quick="${esc(c.nombre)}">
              ${catIcon(c,36)}
              <div style="flex:1;min-width:0">
                <div style="display:flex;justify-content:space-between;gap:8px"><span class="cat-row-name">${esc(c.nombre)}</span><span style="font-family:var(--mono);font-weight:500">${fmt(c.val)}</span></div>
                <div class="bar" style="height:4px;margin-top:6px"><div style="width:${pct}%;background:${c.color}"></div></div>
                <div style="text-align:right;font-family:var(--mono);font-size:10px;color:${c.color};margin-top:3px">${Math.round(pct)}%</div>

    <div class="card" style="margin-bottom:16px">
      <div class="section-title">Movimientos del ${state.calDate.split('-').reverse().join('/')}</div>

  root.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{state.walletFilter=b.dataset.acc==='all'?'all':Number(b.dataset.acc);renderResumen();});

}

function fmtShort(n){
  const v=Math.abs(Number(n||0));
  const s=v>=1e6?(v/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+'M':v>=1e4?(v/1e3).toLocaleString('es-AR',{maximumFractionDigits:1})+'k':v.toLocaleString('es-AR',{maximumFractionDigits:0});
  return (n<0?'-$':'$')+s;
}

// Fila de movimiento con ícono de categoría
function txnRow(t, withDelete=false){
  const w=state.wallets.find(x=>x.id===t.walletId);
  const cat=getCat(t.categoria,t.tipo);
  const isCrypto=w&&['BTC','USDT'].includes(w.moneda);
  const arsVal=isCrypto?walletValueARS({...w,saldo:t.monto}):null;
  const signo=t.tipo==='ingreso'?'+':'-';
  const montoDisplay=isCrypto

function renderMovimientos(){
  const root=document.getElementById('tab-movimientos');
  if(!state.wallets.some(w=>w.id===state.formWallet)) state.formWallet=state.wallets[0]?.id||null;
  const formCats=catsOf(state.formTipo);
  if(!formCats.some(c=>c.nombre===state.formCat)) state.formCat=formCats[0]?.nombre||'Otros';
  // Se muestran 3 filas; si no entran, la última posición es una flecha para desplegar todas
  const LIMIT=12;
  const catBtn=c=>`<button class="cat-pick ${state.formCat===c.nombre?'sel':''}" data-fcat="${esc(c.nombre)}">${catIcon(c,38)}<span>${esc(c.nombre)}</span></button>`;
  const newBtn=`<button class="cat-pick" id="fcatNew"><span class="cat-ico cat-ico-add" style="width:38px;height:38px">${svgIcon('plus',18)}</span><span>Nueva</span></button>`;
  const toggleBtn=open=>`<button class="cat-pick" id="fcatToggle"><span class="cat-ico cat-ico-add" style="width:38px;height:38px"><span style="display:inline-flex;transform:rotate(${open?180:0}deg)">${svgIcon('chevron',18)}</span></span><span>${open?'Menos':'Más'}</span></button>`;
  const overflow=formCats.length+1>LIMIT;
  const selHidden=formCats.findIndex(c=>c.nombre===state.formCat)>=LIMIT-1;
  const catsOpen=state.formCatsOpen||selHidden;
  const catPicker=!overflow ? formCats.map(catBtn).join('')+newBtn
    : catsOpen ? formCats.map(catBtn).join('')+newBtn+toggleBtn(true)
    : formCats.slice(0,LIMIT-1).map(catBtn).join('')+toggleBtn(false);
  const walletPills = state.wallets.map(w=>`
    <button class="wallet-pill ${state.formWallet===w.id?'selected':''}" data-wpill="${w.id}">${esc(w.nombre)} <span style="color:var(--text3)">(${fmt(w.saldo)})</span></button>

    <div class="page-head"><div class="page-title">Movimientos</div></div>
    <div class="content-grid">
      <div class="card">
        <div class="seg">
          <button id="tipo-gasto" class="seg-btn ${state.formTipo==='gasto'?'active seg-red':''}">Gasto</button>
          <button id="tipo-ingreso" class="seg-btn ${state.formTipo==='ingreso'?'active seg-green':''}">Ingreso</button>
        </div>
        <div class="form-stack">
          <div class="amount-box ${state.formTipo}">
            <span class="amount-cur">$</span>
            <input id="txnMonto" class="amount-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
          </div>
          <div class="cat-pick-grid small">${catPicker}</div>
          <div class="wallet-pills" id="walletPillsContainer">${walletPills}</div>
          <div class="form-row">
            <input id="txnFecha" class="field" type="date" value="${todayStr()}">
            <input id="txnDesc" class="field" type="text" placeholder="Descripción">
          </div>
          <button id="addTxn" class="btn btn-big ${state.formTipo==='ingreso'?'btn-green':'btn-red'}">Registrar</button>
        </div>
      </div>
      <div class="card">
        <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
          <span>Historial</span>
          <span class="list-sub">${state.txns.length} movimientos</span>
        </div>
        <div style="max-height:520px;overflow:auto">
          ${state.txns.length ? state.txns.map(t=>txnRow(t,true)).join('') : `<div class="empty">SIN MOVIMIENTOS</div>`}
        </div>
      </div>
    </div>
  `;

  bindMontoInput(document.getElementById('txnMonto'));
  document.getElementById('tipo-gasto').onclick=()=>{state.formTipo='gasto';renderMovimientos();};
  document.getElementById('tipo-ingreso').onclick=()=>{state.formTipo='ingreso';renderMovimientos();};

  root.querySelectorAll('[data-fcat]').forEach(btn=>btn.onclick=()=>{state.formCat=btn.dataset.fcat;renderMovimientos();});
  const fcatNew=document.getElementById('fcatNew'); if(fcatNew) fcatNew.onclick=()=>openCatModal(state.formTipo);
  const fcatToggle=document.getElementById('fcatToggle'); if(fcatToggle) fcatToggle.onclick=()=>{state.formCatsOpen=!catsOpen;renderMovimientos();};

  root.querySelectorAll('[data-wpill]').forEach(btn=>btn.onclick=()=>{
    const id=Number(btn.dataset.wpill);
    state.formWallet = id; // siempre selecciona, nunca deselecciona
    renderMovimientos();
  });

  document.getElementById('addTxn').onclick=()=>{
    const categoria=state.formCat;
    const monto=parseMonto(document.getElementById('txnMonto').value);
    const fecha=document.getElementById('txnFecha').value||todayStr();
    const descripcion=document.getElementById('txnDesc').value.trim();
    if(!monto||monto<=0) return;
    if(!state.formWallet){ renderMovimientos(); return; } // billetera obligatoria
    addTxn({id:Date.now(),tipo:state.formTipo,categoria,monto,descripcion,fecha,walletId:state.formWallet});
  };

  root.querySelectorAll('[data-del-txn]').forEach(btn=>btn.onclick=()=>{
    const txn=state.txns.find(t=>String(t.id)===btn.dataset.delTxn);
    if(txn&&txn.walletId) applyTxnToWallet(txn, txn.walletId, -1); // revert
    state.txns=state.txns.filter(t=>String(t.id)!==btn.dataset.delTxn);
    save('ct_txns',state.txns);
    render();
  });
}

// Mantener apretado para arrastrar y reordenar filas [data-sort]
function enableSort(container, onDone){
  if(!container) return;
  let timer=null, drag=null, downY=0, suppressClick=false;
  const cancelTimer=()=>{ clearTimeout(timer); timer=null; };
  container.querySelectorAll('[data-sort]').forEach(row=>{
    row.addEventListener('pointerdown',e=>{
      if(e.button>0) return;
      downY=e.clientY;
      const pid=e.pointerId;
      timer=setTimeout(()=>{
        timer=null;
        drag={row,startY:downY};
        try{ row.setPointerCapture(pid); }catch(_){}
        row.classList.add('dragging');
        container.classList.add('sorting');
        if(navigator.vibrate) navigator.vibrate(15);
      },380);
    });
  });
  container.addEventListener('pointermove',e=>{
    if(timer && Math.abs(e.clientY-downY)>8) cancelTimer();
    if(!drag) return;
    e.preventDefault();
    const row=drag.row;
    row.style.transform=`translateY(${e.clientY-drag.startY}px)`;
    const rows=[...container.querySelectorAll('[data-sort]')];
    const i=rows.indexOf(row);
    const r=row.getBoundingClientRect(), mid=r.top+r.height/2;
    const next=rows[i+1], prev=rows[i-1];
    if(next){ const n=next.getBoundingClientRect(); if(mid>n.top+n.height/2){ container.insertBefore(next,row); drag.startY+=n.height; row.style.transform=`translateY(${e.clientY-drag.startY}px)`; return; } }
    if(prev){ const p=prev.getBoundingClientRect(); if(mid<p.top+p.height/2){ container.insertBefore(row,prev); drag.startY-=p.height; row.style.transform=`translateY(${e.clientY-drag.startY}px)`; } }
  });
  const end=()=>{
    cancelTimer();
    if(!drag) return;
    drag.row.style.transform='';
    drag.row.classList.remove('dragging');
    container.classList.remove('sorting');
    drag=null; suppressClick=true;
    setTimeout(()=>suppressClick=false,350);
    onDone([...container.querySelectorAll('[data-sort]')].map(r=>Number(r.dataset.sort)));
  };
  container.addEventListener('pointerup',end);
  container.addEventListener('pointercancel',end);
  container.addEventListener('touchmove',e=>{ if(drag) e.preventDefault(); },{passive:false});
  container.addEventListener('contextmenu',e=>e.preventDefault());
  container.addEventListener('click',e=>{ if(suppressClick){ e.stopPropagation(); e.preventDefault(); } },true);
}

function openWalletModal(w){

    </div>
    <button id="wSave" class="btn btn-accent btn-big" style="margin-top:16px">${isNew?'Agregar':'Guardar'}</button>
    ${isNew?'':`<button id="wDel" class="btn btn-link-danger">Eliminar billetera</button>`}`);
  bindMontoInput(modal.querySelector('#wSaldo'));
  bindChips(modal,'wtipo',v=>tipo=v);
  bindChips(modal,'wmon',v=>moneda=v);
  const drawColors=()=>{
    const el=modal.querySelector('#wColors');
    el.innerHTML=CAT_COLORS.map(c=>`<button class="color-btn ${c===color?'sel':''}" data-c="${c}" style="background:${c}"></button>`).join('');
    el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;drawColors();});
  };
  drawColors();
  modal.querySelector('#wSave').onclick=()=>{
    const nombre=modal.querySelector('#wNombre').value.trim();
    if(!nombre){ modal.querySelector('#wNombre').focus(); return; }
    const saldo=parseMonto(modal.querySelector('#wSaldo').value);
    const rend=Number(modal.querySelector('#wRend').value)||null;
    if(isNew) state.wallets.push({id:Date.now(),nombre,tipo,saldo,moneda,color,rendAnual:rend});
    else Object.assign(w,{nombre,tipo,saldo,moneda,color,rendAnual:rend});
    save('ct_wallets',state.wallets);
    modal.remove(); render();
    showToast(isNew?`${nombre} agregada`:`${nombre} actualizada`);
  };
  if(!isNew) modal.querySelector('#wDel').onclick=()=>{
    if(!confirm(`¿Eliminar "${w.nombre}"?`)) return;
    state.wallets=state.wallets.filter(x=>x.id!==w.id);
    save('ct_wallets',state.wallets);
    modal.remove(); render();
  };
}

              <div class="list-sub"><span style="color:var(--gold2)">${fmtPct(inv.tna)}</span> · <span style="color:var(--green)">+${fmtShort(g)}/año</span></div>
            </div>
          </button>`;}).join(''):`<div class="empty">Todavía no tenés inversiones</div>`}
      </div>

      <div class="card">
        <div class="section-title">Simulador</div>
        <div class="form-stack">
          <div class="amount-box ingreso"><span class="amount-cur">$</span><input id="simCap" class="amount-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0"></div>
          <div class="sim-row">
            <input id="simTna" class="field" type="number" inputmode="decimal" placeholder="TNA %">
            ${chipsHTML('simt',[{k:'c',label:'Compuesto'},{k:'s',label:'Simple'}],'c')}
          </div>
        </div>
        <div id="simResult"></div>
      </div>
    </div>
  `;

  document.getElementById('newInv').onclick=openInvModal;
  root.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>openInvDetail(state.invest.find(i=>i.id===Number(b.dataset.inv))));

  let simComp=true;
  const sim=()=>{
    const cap=parseMonto(document.getElementById('simCap').value);
    const tna=Number(document.getElementById('simTna').value);
    document.getElementById('simResult').innerHTML=cap&&tna?projRows(cap,tna,simComp,[3,6,12,24]):'';
  };
  bindMontoInput(document.getElementById('simCap'));
  document.getElementById('simCap').addEventListener('input',sim);
  document.getElementById('simTna').addEventListener('input',sim);
  bindChips(root,'simt',v=>{simComp=v==='c';sim();});
}

function projRows(cap,tna,comp,meses){
  return `<div class="proj">${meses.map(m=>{
    const g=proyectar(cap,tna,m,comp)-cap;
    return `<div class="proj-row"><span>${m} meses</span><div><b>+${fmt(g)}</b><small>total ${fmt(cap+g)}</small></div></div>`;
  }).join('')}</div>`;
}

function openInvDetail(inv){
  const t=invTipo(inv.tipo);
  const cmp=inv.compuesto===true;
  const modal=openModal(`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      ${catIcon({icon:t.icon,color:'var(--accent)'},44)}
      <div><div class="modal-title" style="margin:0">${esc(inv.nombre)}</div>
      <div class="list-sub">${t.label} · ${esc(inv.moneda)} · ${fmtPct(inv.tna)} TNA · ${cmp?'Compuesto':'Simple'}</div></div>
    </div>
    <label class="label">Capital</label>
    <div class="amount-box ingreso"><span class="amount-cur">$</span><input id="idCap" class="amount-input" type="text" inputmode="decimal" autocomplete="off" value="${String(inv.capital||0).replace('.',',')}"></div>
    <div id="idProj"></div>
    <button id="idSave" class="btn btn-accent btn-big" style="margin-top:16px">Guardar</button>
    <button id="idDel" class="btn btn-link-danger">Eliminar inversión</button>`);
  const capEl=modal.querySelector('#idCap');
  bindMontoInput(capEl);
  const draw=()=>{modal.querySelector('#idProj').innerHTML=projRows(parseMonto(capEl.value),inv.tna,cmp,[3,6,12]);};
  capEl.addEventListener('input',draw); draw();
  modal.querySelector('#idSave').onclick=()=>{inv.capital=parseMonto(capEl.value);save('ct_invest',state.invest);modal.remove();render();};
  modal.querySelector('#idDel').onclick=()=>{
    if(!confirm(`¿Eliminar "${inv.nombre}"?`)) return;
    state.invest=state.invest.filter(i=>i.id!==inv.id);save('ct_invest',state.invest);modal.remove();render();
  };
}

function openInvModal(){
  let tipo='plazo_fijo', moneda='ARS', comp='c';
  const modal=openModal(`
    <div class="modal-title">Nueva inversión</div>
    <div class="form-stack">
      <div class="amount-box ingreso"><span class="amount-cur">$</span><input id="niCap" class="amount-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0"></div>
      <input id="niNombre" class="field" type="text" placeholder="Nombre (ej: Plazo fijo Nación)">
      <input id="niTna" class="field" type="number" inputmode="decimal" placeholder="TNA %">
      <div><label class="label">Tipo</label>${chipsHTML('nit',INV_TIPOS,tipo)}</div>
      <div><label class="label">Moneda</label>${chipsHTML('nim',['ARS','USD','USDT','EUR'],moneda)}</div>
      <div><label class="label">Interés</label>${chipsHTML('nic',[{k:'c',label:'Compuesto'},{k:'s',label:'Simple'}],comp)}</div>
    </div>
    <button id="niSave" class="btn btn-accent btn-big" style="margin-top:16px">Agregar</button>`);
  bindMontoInput(modal.querySelector('#niCap'));
  bindChips(modal,'nit',v=>tipo=v);
  bindChips(modal,'nim',v=>moneda=v);
  bindChips(modal,'nic',v=>comp=v);
  modal.querySelector('#niSave').onclick=()=>{
    const nombre=modal.querySelector('#niNombre').value.trim();
    const tna=Number(modal.querySelector('#niTna').value);
    if(!nombre){modal.querySelector('#niNombre').focus();return;}
    if(!tna){modal.querySelector('#niTna').focus();return;}
    state.invest.push({id:Date.now(),nombre,tipo,tna,capital:parseMonto(modal.querySelector('#niCap').value),moneda,compuesto:comp==='c'});
    save('ct_invest',state.invest);
    modal.remove(); render();
    showToast(`${nombre} agregada`);
  };
}

// ─── APPLY DAILY YIELDS ───
function applyDailyYields(){
  const today = todayStr();
  let changed = false;
  state.wallets.forEach(w => {
    if(!w.rendAnual || Number(w.rendAnual) <= 0) return;
    if(w.lastYieldDate === today) return; // already done today
    // Count days since last applied
    const from = w.lastYieldDate ? new Date(w.lastYieldDate) : null;
    const toDate = new Date(today);
    if(!from || from >= toDate) { w.lastYieldDate = today; changed = true; return; }
    // Calculate days elapsed
    const msPerDay = 86400000;
    const days = Math.floor((toDate - from) / msPerDay);
    if(days <= 0) return;
    const dailyRate = Number(w.rendAnual) / 100 / 365;
    for(let d=0; d<days; d++){
      const dayDate = new Date(from.getTime() + (d+1)*msPerDay);
      const dateStr = dayDate.toISOString().split('T')[0];
      const rendMonto = Number(w.saldo||0) * dailyRate;
      if(rendMonto <= 0) continue;
      const txn = {
        id: Date.now() + d,
        tipo: 'ingreso',
        categoria: 'Rendimiento',
        monto: rendMonto,
        descripcion: `Rend. diario ${esc(w.nombre)} (${fmtPct(w.rendAnual)} TNA)`,
        fecha: dateStr,
        walletId: w.id,
        esRendimiento: true,
        walletNombre: w.nombre
      };
      state.txns.unshift(txn);
      w.saldo = Number(w.saldo||0) + rendMonto;
    }
    w.lastYieldDate = today;
    changed = true;
  });
  if(changed){
    save('ct_txns', state.txns);
    save('ct_wallets', state.wallets);
  }
}

// ─── TEMA CLARO / OSCURO ───
function currentTheme(){ return document.documentElement.getAttribute('data-theme')||'dark'; }
function applyThemeUI(){
  const t=currentTheme();
  document.querySelectorAll('[data-theme-toggle]').forEach(b=>b.innerHTML=svgIcon(t==='dark'?'sun':'moon',18));
  document.querySelectorAll('[data-theme-toggle-side]').forEach(b=>b.innerHTML=`${svgIcon(t==='dark'?'sun':'moon',16)} Modo ${t==='dark'?'claro':'oscuro'}`);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t==='dark'?'#161a1f':'#ffffff');
}
function toggleTheme(){
  const t=currentTheme()==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  try{ localStorage.setItem('ct_theme',t); }catch(e){}
  applyThemeUI();
  render();
}
document.querySelectorAll('[data-theme-toggle],[data-theme-toggle-side]').forEach(b=>b.onclick=toggleTheme);
document.getElementById('menuBtn').innerHTML=svgIcon('menu',18);
document.getElementById('menuBtn').onclick=()=>{
  const modal=openModal(`
    <div class="modal-title">Pulso</div>
    <button class="menu-item" id="mTheme">${svgIcon(currentTheme()==='dark'?'sun':'moon',20)} Modo ${currentTheme()==='dark'?'claro':'oscuro'}</button>
    <button class="menu-item" id="mSave">${svgIcon('download',20)} Guardar backup</button>
    <label class="menu-item">${svgIcon('upload',20)} Restaurar backup<input type="file" id="mImport" accept=".json,.html,application/json,text/html" style="display:none"></label>`);
  modal.querySelector('#mTheme').onclick=()=>{modal.remove();toggleTheme();};
  modal.querySelector('#mSave').onclick=()=>{modal.remove();downloadHTML();};
  modal.querySelector('#mImport').onchange=e=>{
    const inp=document.getElementById('importFile');
    inp.files=e.target.files; inp.dispatchEvent(new Event('change')); modal.remove();
  };
};
applyThemeUI();

// ─── MAIN RENDER ───
let _lastTab=null;
function render(){
  if(_lastTab!==state.tab){ const a=document.querySelector('.app'); if(a) a.scrollTop=0; window.scrollTo(0,0); _lastTab=state.tab; }
  renderSidebarShell();
  renderMenu();
  updateSidebar();
  document.querySelectorAll('.tab-panel').forEach(el=>el.classList.add('hide'));
  document.getElementById('tab-'+state.tab).classList.remove('hide');
  renderResumen();
  renderMovimientos();
  renderActivos();
  renderInversiones();
}

document.getElementById('sidebarCollapse').onclick=()=>{state.sidebarOpen=!state.sidebarOpen;renderSidebarShell()};

// ─── EXPORT / IMPORT ───
document.getElementById('exportBtn').onclick = ()=>downloadHTML();

document.getElementById('importFile').onchange=(e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try {
      // Acepta backup .json o el .html descargado (datos en SAVED_DATA)
      const txt = ev.target.result;
      const m = txt.match(/<script id="SAVED_DATA"[^>]*>([\s\S]*?)<\/script>/);
      const data = JSON.parse(m ? m[1] : txt);
      if(data.ct_txns)    { state.txns    = data.ct_txns;    localStorage.setItem('ct_txns',    JSON.stringify(state.txns)); }
      if(data.ct_wallets) { state.wallets = data.ct_wallets; localStorage.setItem('ct_wallets', JSON.stringify(state.wallets)); }
      if(data.ct_invest)  { state.invest  = data.ct_invest;  localStorage.setItem('ct_invest',  JSON.stringify(state.invest)); }
      if(data.ct_quotes)  { state.quotes  = data.ct_quotes;  localStorage.setItem('ct_quotes',  JSON.stringify(state.quotes)); }
      if(data.ct_cats)    { state.cats    = data.ct_cats;    localStorage.setItem('ct_cats',    JSON.stringify(state.cats)); }
      render();
      showToast('✓ Datos restaurados');
    } catch(err) {
      alert('Archivo inválido.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

const exportBtnMobile = document.getElementById('exportBtnMobile');
if(exportBtnMobile) exportBtnMobile.onclick = ()=>downloadHTML();
const importFileMobile = document.getElementById('importFileMobile');
if(importFileMobile) importFileMobile.onchange = (e)=>{
  document.getElementById('importFile').files = e.target.files;
  document.getElementById('importFile').dispatchEvent(new Event('change'));
};
applyDailyYields();
render();
</script>
