<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pulso">
  <title>Pulso</title>
  <meta name="application-name" content="Pulso">
  <meta name="theme-color" content="#0b0e11">
  <link rel="apple-touch-icon" href="pulso-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="pulso-icon.png">
  <link rel="icon" type="image/png" href="pulso-icon.png">
  <link rel="shortcut icon" type="image/png" href="pulso-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e11;
      --surface: #161a1f;
      --surface2: #1e2329;
      --border: #2b3139;
      --border2: #363c45;
      --text: #eaecef;
      --text2: #848e9c;
      --text3: #5a6270;
      --accent: #f0b90b;
      --gold2: #ffd54a;
      --green: #0ecb81;
      --red: #f6465d;
      --blue: #4a9eff;
      --hero-bg: linear-gradient(135deg,#3a2c05 0%,#1d1806 45%,#161a1f 100%);
      --hero-border: rgba(240,185,11,.35);
      --chip-bg: rgba(0,0,0,.25);
      --shadow: none;
      --overlay: rgba(0,0,0,.7);
      --nav-bg: rgba(16,19,24,.78);
      --track: rgba(255,255,255,.06);
      --display: 'Sora', 'Roboto', system-ui, sans-serif;
      --aurora-1: rgba(240,185,11,.16);
      --aurora-2: rgba(14,203,129,.10);
      --aurora-3: rgba(59,130,246,.08);
      --card-sheen: linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%);
      --mono: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --sans: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    :root[data-theme="light"]{
      --bg:#f4f5f7; --surface:#ffffff; --surface2:#f1f3f6; --border:#e6e8ec; --border2:#d5d9df;
      --text:#0f172a; --text2:#64748b; --text3:#94a3b8;
      --gold2:#a87900; --green:#059669; --red:#e11d48; --blue:#2563eb;
      --hero-bg: linear-gradient(135deg,#fff1bd 0%,#fff9e8 55%,#ffffff 100%);
      --hero-border: rgba(240,185,11,.5);
      --chip-bg: rgba(255,255,255,.75);
      --shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 20px rgba(15,23,42,.06);
      --overlay: rgba(15,23,42,.45);
      --nav-bg: rgba(255,255,255,.82);
      --track: rgba(15,23,42,.06);
      --aurora-1: rgba(240,185,11,.22);
      --aurora-2: rgba(14,203,129,.12);
      --aurora-3: rgba(59,130,246,.10);
      --card-sheen: linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 40%);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-family:var(--sans);background:var(--bg);color:var(--text);font-weight:400;font-size:14px}
    button,input,select{font-family:inherit}
    button{cursor:pointer}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
    select option{background:var(--surface2);color:var(--text)}

    /* ─── LAYOUT ─── */
    .app{display:flex;min-height:100vh}
    .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:24px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:hidden;transition:width .2s ease,padding .2s ease,opacity .15s ease}
    .sidebar.collapsed{width:0;padding:24px 0;border-right:none;opacity:0;pointer-events:none}
    .sidebar-collapse{position:fixed;left:208px;top:50%;transform:translateY(-50%);width:16px;height:48px;border:1px solid var(--border);border-left:none;border-radius:0 6px 6px 0;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:10px;z-index:20;transition:left .2s ease}
    .sidebar-collapse:hover{background:var(--surface2);color:var(--text)}
    .sidebar-collapsed .sidebar-collapse{left:0;border-left:1px solid var(--border)}
    .sidebar-collapsed .main{padding-left:32px}

    .brand{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:-0.5px;padding:8px 12px 16px;color:var(--text)}
    .brand span{color:var(--accent)}

    .tab-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border:none;border-radius:6px;background:transparent;color:var(--text2);font-size:13px;font-weight:400;text-align:left;width:100%;transition:.12s;letter-spacing:.2px}
    .tab-btn:hover{background:var(--surface2);color:var(--text)}
    .tab-btn.active{background:var(--surface2);color:var(--accent);font-weight:500}
    .tab-btn .icon{font-family:var(--mono);font-size:11px;width:18px;text-align:center;color:var(--text3)}
    .tab-btn.active .icon{color:var(--accent)}

    .side-card{margin-top:auto;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px}
    .side-card .k{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--mono)}
    .side-card .v{font-size:20px;font-weight:500;font-family:var(--mono);color:var(--text)}
    .side-card .sub{font-size:11px;font-weight:400;margin-top:4px;font-family:var(--mono)}
    .sub.ok{color:var(--green)}.sub.bad{color:var(--red)}

    .main{flex:1;padding:28px 24px;overflow:auto}

    /* ─── TYPOGRAPHY ─── */
    .page-title{font-family:var(--mono);font-size:18px;font-weight:500;margin-bottom:20px;letter-spacing:-0.3px;color:var(--text);border-bottom:1px solid var(--border);padding-bottom:14px}
    .section-title{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}

    /* ─── CARDS ─── */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px}
    .cards-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
    .cards-2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:16px}
    .content-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
    .assets-grid{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
    .invest-grid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}

    .stat-label{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .stat-val{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-0.5px;color:var(--text)}
    .stat-val.green{color:var(--green)}.stat-val.red{color:var(--red)}.stat-val.yellow{color:var(--accent)}

    /* ─── FORMS ─── */
    .field{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:13px;font-family:var(--mono);color:var(--text);outline:none;transition:.12s}
    .field:focus{border-color:var(--accent);background:var(--surface2)}
    .field::placeholder{color:var(--text3)}
    .label{display:block;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
    .form-stack{display:flex;flex-direction:column;gap:10px}

    /* ─── BUTTONS ─── */
    .btn{border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:500;font-family:var(--mono);letter-spacing:.3px;transition:.12s}
    .btn-accent{background:var(--accent);color:#0b0e11}
    .btn-accent:hover{background:#f8c914}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
    .btn-ghost:hover{border-color:var(--border2);color:var(--text)}
    .btn-danger{background:transparent;border:1px solid var(--border);color:var(--red);font-size:11px;padding:5px 9px;border-radius:4px}
    .btn-danger:hover{background:rgba(246,70,93,.1)}

    /* ─── SEGMENT ─── */
    .seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px;gap:3px;margin-bottom:14px}
    .seg-btn{flex:1;border:none;border-radius:4px;padding:7px 0;background:transparent;color:var(--text2);font-size:12px;font-weight:400;font-family:var(--mono);letter-spacing:.3px;transition:.12s}
    .seg-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}

    /* ─── TABLE ROWS ─── */
    .row-hover{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;border-bottom:1px solid var(--border)}
    .row-hover:last-child{border-bottom:none}
    .row-hover:hover{background:var(--surface2)}
    .amount-positive{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--green)}
    .amount-negative{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--red)}
    .amount-neutral{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--text)}

    /* ─── BADGES ─── */
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:500;font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase}
    .badge-green{background:rgba(14,203,129,.12);color:var(--green)}
    .badge-red{background:rgba(246,70,93,.12);color:var(--red)}
    .badge-yellow{background:rgba(240,185,11,.12);color:var(--accent)}
    .badge-blue{background:rgba(74,158,255,.12);color:var(--blue)}
    .badge-gray{background:var(--surface2);color:var(--text2)}

    /* ─── CALENDAR ─── */
    .calendar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
    .cal-head{font-family:var(--mono);font-size:9px;font-weight:400;color:var(--text3);padding-bottom:5px;letter-spacing:.5px}
    .cal-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;height:32px;font-family:var(--mono);font-size:12px;font-weight:400;color:var(--text2);transition:.1s}
    .cal-cell:hover{background:var(--surface2);color:var(--text)}
    .dot{width:4px;height:4px;border-radius:50%;margin-top:2px}

    /* ─── WALLET CARD ─── */
    .wallet{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)}
    .wallet:hover{border-color:var(--border2)}
    .wallet-left{display:flex;align-items:center;gap:12px}
    .wallet-tag{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
    .wallet-amount{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--text)}
    .wallet-actions{display:flex;align-items:center;gap:8px}

    /* ─── BARS ─── */
    .bar{height:3px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:6px}
    .bar > div{height:100%;border-radius:3px}

    /* ─── PIE CHART ─── */
    .pie-wrap{display:flex;align-items:center;gap:14px}
    .legend{display:flex;flex-direction:column;gap:5px;flex:1}
    .legend-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}
    .legend-left{display:flex;align-items:center;gap:8px;min-width:0}
    .sw{width:8px;height:8px;border-radius:2px;flex-shrink:0}
    .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:11px;color:var(--text2)}
    .legend-pct{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--text)}

    /* ─── INVEST ─── */
    .invest-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px}
    .invest-name{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text)}
    .invest-rate{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--accent)}
    .invest-meta{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
    .projected-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12px}
    .projected-row:last-child{border-bottom:none}

    /* ─── NOTIFICATION TOAST ─── */
    .toast{position:fixed;bottom:80px;right:20px;background:var(--surface2);border:1px solid var(--accent);border-radius:6px;padding:10px 16px;font-family:var(--mono);font-size:12px;color:var(--text);z-index:100;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
    .toast.show{opacity:1;transform:translateY(0)}

    /* ─── MISC ─── */
    .empty{padding:24px;text-align:center;color:var(--text3);font-family:var(--mono);font-size:12px;letter-spacing:.5px}
    .muted{color:var(--text2)}
    .hide{display:none}
    .head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .divider{height:1px;background:var(--border);margin:14px 0}
    .ticker{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.5px}

    /* ─── WALLET SELECTOR IN FORM ─── */
    .wallet-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
    .wallet-pill{border:1px solid var(--border);border-radius:16px;padding:7px 12px;font-size:13px !important;background:transparent;color:var(--text2);font-family:var(--mono);font-size:11px;cursor:pointer;transition:.1s}
    .wallet-pill:hover{border-color:var(--border2);color:var(--text)}
    .wallet-pill.selected{border-color:var(--accent);color:var(--accent);background:rgba(240,185,11,.06)}

    /* ─── RESUMEN: HERO ─── */
    .hero{background:var(--hero-bg);border:1px solid var(--hero-border);border-radius:20px;padding:18px 16px;box-shadow:var(--shadow);margin-bottom:16px;text-align:center}
    .hero-acc{background:none;border:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:2px;margin:0 auto}
    .hero-acc-label{font-size:12px;color:var(--gold2)}
    .hero-acc-val{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--text)}
    .acc-chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;justify-content:center;flex-wrap:wrap}
    .acc-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(240,185,11,.3);background:var(--chip-bg);color:var(--text2);border-radius:20px;padding:5px 12px;font-size:12px;white-space:nowrap}
    .acc-chip.sel{background:var(--accent);color:#0b0e11;border-color:var(--accent);font-weight:600}
    .month-nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.5px}
    .month-nav button{background:none;border:none;color:var(--gold2);font-size:22px;padding:0 12px}
    .resumen-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .seg-btn.seg-red{background:var(--red);color:#fff}
    .seg-btn.seg-green{background:var(--green);color:#0b0e11}
    .btn-red{background:var(--red);color:#fff}.btn-red:hover{filter:brightness(1.1)}
    .btn-green{background:var(--green);color:#0b0e11}.btn-green:hover{filter:brightness(1.1)}

    /* ─── ANILLO DE CATEGORÍAS ─── */
    .cat-ico{color:#fff;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.18)}
    .cat-ico-add{background:var(--surface2);color:var(--text2);border:1px dashed var(--border2)}
    .ring-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 4px;align-items:center}
    .ring-slot{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--text);padding:4px 0;border-radius:10px;transition:.12s;min-width:0}
    .ring-slot:hover{background:var(--surface2)}
    .ring-slot:active{transform:scale(.95)}
    .ring-name{font-size:11px;color:var(--text2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ring-amt{font-family:var(--mono);font-size:11px;font-weight:600}
    .ring-center{grid-row:2/4;grid-column:2/4;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .ring-center-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

    /* ─── BALANCE / BARRAS ─── */
    .bal-row{display:flex;align-items:center;padding:14px 16px}
    .bal-count{width:38px;height:38px;border-radius:50%;border:2px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px}
    .split{display:grid;grid-template-columns:1fr 1fr}
    .split button{border:none;padding:10px;font-size:12px;text-align:center;opacity:.75}
    .split button b{font-family:var(--mono);font-size:17px;display:block;margin-top:2px}
    .split button.sel{opacity:1}
    .split-red{background:var(--red);color:#fff}
    .split-green{background:rgba(14,203,129,.15);color:var(--green)}
    .split-green.sel{background:var(--green);color:#0b0e11}
    .split-red:not(.sel){background:rgba(246,70,93,.15);color:var(--red)}
    .bars-wrap{position:relative;padding:18px 12px 22px;border-bottom:1px solid var(--border)}
    .bars-max{position:absolute;right:12px;top:2px;font-family:var(--mono);font-size:10px;color:var(--text3)}
    .bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--border2)}
    .bar-col{flex:1;height:100%;display:flex;flex-direction:column-reverse;cursor:pointer;border-radius:2px 2px 0 0;overflow:hidden}
    .bar-col:hover{background:var(--surface2)}
    .bar-col.sel{background:rgba(240,185,11,.12);outline:1px solid rgba(240,185,11,.4)}
    .bars-ticks{position:relative;height:14px;font-family:var(--mono);font-size:10px;color:var(--text3)}
    .bars-ticks span{position:absolute;top:3px;transform:translateX(-50%)}
    .mini-stats{display:grid;grid-template-columns:repeat(3,1fr)}
    .mini-stats>div{padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--border)}
    .mini-stats>div:last-child{border-right:none}
    .mini-stats span{font-size:11px;color:var(--text2)}
    .mini-stats b{font-family:var(--mono);font-size:13px;font-weight:600}
    .cat-row{display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer;border-radius:8px}
    .cat-row:hover{background:var(--surface2)}
    .cat-row-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* ─── MODALES / SELECTOR DE CATEGORÍAS ─── */
    .modal-bg{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:14px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
    .cat-pick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px}
    .cat-pick{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:2px solid transparent;border-radius:12px;padding:6px 2px;color:var(--text2);font-size:11px;min-width:0}
    .cat-pick span:last-child{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cat-pick:hover{background:var(--surface2)}
    .cat-pick.sel{border-color:var(--accent);background:rgba(240,185,11,.08);color:var(--text)}
    .cat-pick-grid.small{padding:2px}
    .cat-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto}
    .cat-list-row{display:flex;align-items:center;gap:10px;font-size:13px}
    .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
    .emoji-btn{background:var(--surface2);border:2px solid transparent;border-radius:8px;padding:6px 0;color:var(--text);display:flex;align-items:center;justify-content:center}
    .emoji-btn.sel{border-color:var(--accent)}
    .color-grid{display:flex;flex-wrap:wrap;gap:8px}
    .color-btn{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
    .color-btn.sel{border-color:var(--text)}


    /* ─── TIPOGRAFÍA ESTILO APP ─── */
    .page-title{font-size:20px;font-weight:500;letter-spacing:0}
    .section-title{font-size:15px;font-weight:500;color:var(--text);text-transform:none;letter-spacing:0}
    .stat-label,.label,.wallet-tag,.invest-meta,.side-card .k{text-transform:none;letter-spacing:0;font-size:12px;color:var(--text2)}
    .badge{letter-spacing:0;font-size:11px;text-transform:none;border-radius:10px}
    .btn,.seg-btn,.tab-btn,.bottom-nav-btn,.wallet-pill,.empty,.ticker{letter-spacing:0}
    .seg-btn{font-size:13px;font-weight:500}
    .btn{font-weight:500;font-size:14px;border-radius:8px}
    .empty{font-size:13px}
    .brand,.mobile-brand{letter-spacing:0;font-weight:700}
    .month-nav{font-weight:500;letter-spacing:.3px}
    .hero-acc-val{font-weight:500;font-size:28px}
    /* ─── FORM DE MOVIMIENTO ─── */
    .amount-box{display:flex;align-items:center;gap:6px;background:var(--surface2);border:2px solid var(--red);border-radius:14px;padding:10px 16px}
    .amount-box.ingreso{border-color:var(--green)}
    .amount-cur{font-size:30px;font-weight:500;color:var(--red)}
    .amount-box.ingreso .amount-cur,.amount-box.ingreso .amount-input{color:var(--green)}
    .amount-input{flex:1;min-width:0;width:100%;background:none;border:none;outline:none;font-family:var(--sans);font-size:38px;font-weight:500;color:var(--red);padding:2px 0}
    .amount-input::placeholder{color:var(--text3)}
    .form-row{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
    input[type="date"].field{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:42px;text-align:left}
    input[type="date"]::-webkit-date-and-time-value{text-align:left}
    .btn-big{width:100%;padding:14px;font-size:16px;border-radius:12px}

    /* ─── ESTILO UNIFICADO ─── */
    .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .page-head .page-title{margin:0;border:none;padding:0;font-size:24px;font-weight:700;letter-spacing:-.3px}
    .btn-sm{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;font-size:13px;border-radius:20px}
    .btn-big{display:block}
    .btn-link-danger{display:block;width:100%;background:none;border:none;color:var(--red);font-size:14px;padding:14px 0 2px}
    .card{border-radius:14px}
    .hero-sub{font-size:13px;color:var(--text2);margin-top:2px}
    .hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));margin-top:14px;border-top:1px solid rgba(240,185,11,.2);padding-top:12px}
    .hero-stats>div{display:flex;flex-direction:column;gap:3px;border-right:1px solid rgba(240,185,11,.2)}
    .hero-stats>div:last-child{border-right:none}
    .hero-stats span{font-size:12px;color:var(--text2)}
    .hero-stats b{font-size:16px;font-weight:500}
    .alloc-bar{display:flex;height:8px;border-radius:8px;overflow:hidden;margin:14px auto 0;max-width:420px;gap:2px}
    .list-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--border);color:var(--text);padding:12px 4px;text-align:left;font-family:inherit}
    .list-row:last-child{border-bottom:none}
    .list-row:active{background:var(--surface2)}
    .list-main{flex:1;min-width:0}
    .list-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .list-sub{font-size:12px;color:var(--text2);margin-top:2px}
    .list-right{text-align:right;flex-shrink:0}
    .list-amount{font-size:15px;font-weight:500}
    .quote-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .quote-tile{background:var(--surface2);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
    .quote-tile span{font-size:12px;color:var(--text2)}
    .quote-tile b{font-size:15px;font-weight:500;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .quote-tile small{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{border:1px solid var(--border2);background:var(--surface2);color:var(--text2);border-radius:20px;padding:7px 12px;font-size:13px}
    .chip.sel{background:var(--accent);border-color:var(--accent);color:#0b0e11;font-weight:500}
    .modal-title{font-size:17px;font-weight:600;margin-bottom:14px}
    .proj{margin-top:12px;background:var(--surface2);border-radius:12px;padding:4px 12px}
    .proj-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
    .proj-row:last-child{border-bottom:none}
    .proj-row>span{color:var(--text2);font-size:13px}
    .proj-row>div{text-align:right;display:flex;flex-direction:column}
    .proj-row b{color:var(--green);font-weight:500}
    .proj-row small{font-size:11px;color:var(--text3)}
    .tab-btn .icon{display:inline-flex}
    .sim-row{display:flex;gap:8px;align-items:center}
    .sim-row .field{width:110px;flex:none}
    input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    input[type=number]{-moz-appearance:textfield}
    .bottom-nav-btn{font-family:var(--sans);font-size:11px}

    /* ─── LOOK MODERNO ─── */
    body{transition:background .2s,color .2s}
    .card{border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:18px}
    :root[data-theme="light"] .card{border-color:transparent}
    :root[data-theme="light"] .bottom-nav-btn.active,:root[data-theme="light"] .tab-btn.active,:root[data-theme="light"] .tab-btn.active .icon{color:var(--gold2)}
    :root[data-theme="light"] .wallet-pill.selected{color:var(--gold2)}
    .modal{border-radius:22px;border-top-width:0;box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .field{border-radius:12px;padding:11px 14px}
    .seg{border-radius:12px;padding:4px}
    .seg-btn{border-radius:9px;padding:9px 0}
    .seg-btn.active:not(.seg-red):not(.seg-green){background:var(--surface)}
    .amount-box{border-radius:16px}
    .section-title{font-size:16px;font-weight:600}
    .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text);display:inline-flex;align-items:center;justify-content:center}
    .menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;background:none;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:15px;text-align:left;cursor:pointer}
    .menu-item:last-child{border-bottom:none}
    .menu-item svg{color:var(--text2);flex-shrink:0}
    .side-theme{display:flex;align-items:center;gap:8px;justify-content:center;width:100%;margin-top:8px}

    /* ─── SELECTOR DE MES ─── */
    .hero-top{position:relative}
    .month-pick{background:none;border:none;color:var(--gold2);font-size:12px;display:inline-flex;align-items:center;gap:4px;padding:2px 6px;margin-bottom:2px;font-family:inherit}
    .month-caret{display:inline-flex;opacity:.8}
    .month-menu{position:absolute;top:24px;left:50%;transform:translateX(-50%);z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:6px;min-width:180px;max-height:240px;overflow-y:auto;display:flex;flex-direction:column}
    .month-menu.hide{display:none}
    .month-menu button{white-space:nowrap;background:none;border:none;color:var(--text);font-size:14px;padding:9px 14px;border-radius:9px;text-align:left;font-family:inherit}
    .month-menu button:hover{background:var(--surface2)}
    .month-menu button.sel{background:var(--accent);color:#0b0e11;font-weight:500}

    /* ─── EDITAR CATEGORÍAS ─── */
    .cat-list-row{cursor:pointer;padding:6px;border-radius:10px}
    .cat-list-row:hover,.cat-list-row.editing{background:var(--surface2)}
    .cat-edit-hint{color:var(--text3);display:inline-flex}
    .color-custom{position:relative;overflow:hidden;display:inline-block;cursor:pointer}
    .color-custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
    .cat-list{max-height:240px}

    /* ─── REORDENAR ─── */
    [data-sort]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
    .list-row.dragging{position:relative;z-index:5;background:var(--surface);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transform-origin:center;transition:box-shadow .15s}
    .sorting .list-row:not(.dragging){transition:transform .15s}

    /* ─── SIN DESPLAZAMIENTO LATERAL ─── */
    html,body{overflow-x:hidden;max-width:100%;overscroll-behavior:none}
    .app,.main,.tab-panel{overflow-x:hidden;max-width:100%}
    .app{touch-action:pan-y}


    /* ═══════════ PULSO · CAPA VISUAL ═══════════ */
    body{background:
      radial-gradient(60vmax 50vmax at 0% -10%, var(--aurora-1), transparent 60%),
      radial-gradient(50vmax 40vmax at 110% 20%, var(--aurora-2), transparent 60%),
      radial-gradient(60vmax 50vmax at 50% 120%, var(--aurora-3), transparent 60%),
      var(--bg);background-attachment:fixed}
    .mobile-header{background:var(--nav-bg)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .mobile-brand,.brand{font-family:var(--display)!important;letter-spacing:-.5px!important}
    .page-head .page-title{font-family:var(--display);font-weight:700;letter-spacing:-.8px;font-size:26px}
    .card{background:var(--card-sheen),var(--surface)}
    .section-title{font-family:var(--display);letter-spacing:-.3px}

    /* entrada de pestaña */
    .tab-panel.enter>*{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both}
    .tab-panel.enter>*:nth-child(2){animation-delay:.05s}
    .tab-panel.enter>*:nth-child(3){animation-delay:.1s}
    .tab-panel.enter>*:nth-child(4){animation-delay:.15s}
    .tab-panel.enter>*:nth-child(5){animation-delay:.2s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){ .tab-panel.enter>*,.donut,.pring-arc,.hero-glow{animation:none!important} }

    /* héroe */
    .hero{position:relative;overflow:visible;isolation:isolate}
    .hero-glow{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:-1;pointer-events:none}
    .hero-glow::before{content:"";position:absolute;width:220px;height:220px;right:-60px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,213,74,.45),transparent 65%);filter:blur(6px);animation:floatGlow 8s ease-in-out infinite alternate}
    .hero-glow::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.08) 45%,transparent 60%);transform:translateX(-100%);animation:sheen 6s ease-in-out 1s infinite}
    @keyframes floatGlow{to{transform:translate(-40px,30px) scale(1.15)}}
    @keyframes sheen{0%{transform:translateX(-100%)}40%,100%{transform:translateX(100%)}}
    .hero-row{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
    .dd{position:relative}
    .pill-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hero-border);background:var(--chip-bg);color:var(--text);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:500;font-family:inherit;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(6px)}
    .pill-btn svg{flex-shrink:0;color:var(--gold2)}
    .dd-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.3);padding:6px;min-width:200px;max-height:260px;overflow-y:auto;display:flex;flex-direction:column;animation:pop .18s ease-out}
    .dd-menu.dd-right{left:auto;right:0}
    .dd-menu.hide{display:none}
    .dd-menu button{display:flex;align-items:center;gap:8px;white-space:nowrap;background:none;border:none;color:var(--text);font-size:14px;padding:10px 12px;border-radius:10px;text-align:left;font-family:inherit}
    .dd-menu button:hover{background:var(--surface2)}
    .dd-menu button.sel{background:linear-gradient(135deg,#ffd54a,#f0b90b);color:#0b0e11;font-weight:600}
    @keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
    .hero-main-val{font-family:var(--display);font-size:38px;font-weight:700;letter-spacing:-1.5px;line-height:1.1;margin-top:10px;font-variant-numeric:tabular-nums}
    .hero-sub{font-size:13px;color:var(--text2);margin-top:4px}
    .hero-flow{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
    .hero-flow>div{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);background:var(--chip-bg);border-radius:999px;padding:6px 12px}
    .hero-flow b{font-family:var(--display);font-weight:600;color:var(--text);font-size:13px}
    .dot-in,.dot-out{width:8px;height:8px;border-radius:50%}
    .dot-in{background:var(--green);box-shadow:0 0 8px var(--green)}.dot-out{background:var(--red);box-shadow:0 0 8px var(--red)}
    .filter-chip{display:inline-flex;align-items:center;gap:8px;margin-top:14px;border:none;border-radius:999px;padding:5px 12px 5px 5px;background:var(--surface);color:var(--text);font-size:13px;font-weight:500;box-shadow:var(--shadow);font-family:inherit}
    .filter-chip span:last-child{color:var(--text3);margin-left:2px}
    .xp-bar{display:block;height:6px;border-radius:6px;background:var(--track);overflow:hidden}
    .xp-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#f0b90b,#ffe27a);box-shadow:0 0 10px rgba(240,185,11,.6);transition:width .8s cubic-bezier(.2,.8,.2,1)}
    .xp-bar.big{height:9px;margin-top:8px}
    .streak{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:700;font-size:14px;color:#ff8a3d}
    .streak svg{filter:drop-shadow(0 0 6px rgba(255,138,61,.6))}

    /* anillo */
    .donut{animation:donutIn .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 6px 16px rgba(0,0,0,.18))}
    .donut circle{transition:opacity .3s,stroke-width .3s}
    @keyframes donutIn{from{opacity:0;transform:rotate(-40deg) scale(.85)}to{opacity:1;transform:none}}
    .rc-label{font-size:12px;color:var(--text2);max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rc-val{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.8px}
    .rc-sub{font-size:11px;color:var(--text3)}
    .ring-slot{transition:transform .2s,opacity .25s,filter .25s}
    .ring-slot .cat-ico{transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
    .ring-slot:hover .cat-ico{transform:translateY(-2px) scale(1.06)}
    .ring-slot.off{opacity:.32;filter:grayscale(.6)}
    .ring-slot.on .cat-ico{transform:scale(1.14);outline:3px solid var(--surface);box-shadow:0 0 0 5px currentColor}
    .ring-slot.on{color:var(--gold2)}
    .ring-slot.on .ring-name{color:var(--text);font-weight:600}
    .hint{text-align:center;font-size:11.5px;color:var(--text3);margin-top:12px}

    /* barras */
    .split button b{font-family:var(--display)}
    .split-red.sel{background:linear-gradient(135deg,#ff6b81,var(--red))!important}
    .split-green.sel{background:linear-gradient(135deg,#34e5a5,var(--green))!important}
    .bars{gap:3px;height:130px;border-bottom:1px dashed var(--border2)}
    .bar-col{border:none;background:none;padding:0;height:100%;display:flex;align-items:flex-end;border-radius:6px;cursor:pointer;transition:background .2s}
    .bar-col .bar-stack{width:100%;height:100%;display:flex;flex-direction:column-reverse;border-radius:5px 5px 2px 2px;overflow:hidden}
    .bar-col .bar-stack>div{transition:height .5s cubic-bezier(.2,.8,.2,1)}
    .bar-col.empty-day .bar-stack::after{content:"";display:block;height:3px;border-radius:3px;background:var(--track);margin-top:auto}
    .bar-col:hover{background:var(--track)}
    .bar-col.sel{background:rgba(240,185,11,.16);box-shadow:inset 0 0 0 1.5px rgba(240,185,11,.6)}
    .bars-max{font-family:var(--display)}
    .day-detail{margin:0 12px 12px;padding:4px 12px;border-radius:14px;background:var(--surface2);animation:pop .2s ease-out}
    .day-detail-head{display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px;font-size:13px;font-weight:500}
    .day-detail-head b{font-family:var(--display)}
    .day-detail .row-hover{border-bottom-color:var(--border)}
    .mini-stats b{font-family:var(--display)}

    /* filas de categorías */
    .cat-row{width:100%;border:none;background:none;color:var(--text);font-family:inherit;text-align:left;transition:opacity .25s,background .2s}
    .cat-row.off{opacity:.4}
    .cat-row.on{background:var(--surface2)}
    .cat-row-val{font-family:var(--display);font-weight:600;font-size:14px}
    .pbar{height:7px;border-radius:7px;background:var(--track);overflow:hidden;margin-top:7px}
    .pbar i{display:block;height:100%;border-radius:7px;transition:width .8s cubic-bezier(.2,.8,.2,1)}

    /* botones */
    .btn-accent{background:linear-gradient(135deg,#ffe27a,#f0b90b)!important;color:#0b0e11!important;box-shadow:0 6px 18px rgba(240,185,11,.35);border:none}
    .btn-accent:active,.btn-red:active,.btn-green:active{transform:scale(.98)}
    .btn-red{background:linear-gradient(135deg,#ff6b81,var(--red));box-shadow:0 6px 18px rgba(246,70,93,.3)}
    .btn-green{background:linear-gradient(135deg,#34e5a5,var(--green));box-shadow:0 6px 18px rgba(14,203,129,.3)}
    .btn-link{background:none;border:none;color:var(--text2);font-size:14px;padding:10px 0}
    .seg-btn.seg-red{background:linear-gradient(135deg,#ff6b81,var(--red))}
    .seg-btn.seg-green{background:linear-gradient(135deg,#34e5a5,var(--green))}
    .list-amount,.wallet-amount,.amount-positive,.amount-negative{font-family:var(--display)!important;letter-spacing:-.3px}
    .hero-acc-val{font-family:var(--display)!important;font-weight:700!important;letter-spacing:-1px}
    .amount-input{font-family:var(--display)}

    /* botón flotante */
    .fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:none;z-index:45;
      background:linear-gradient(135deg,#ffe27a,#f0b90b);color:#0b0e11;display:none;align-items:center;justify-content:center;
      box-shadow:0 10px 30px rgba(240,185,11,.5),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .2s}
    .fab.show{display:flex;animation:pop .3s ease-out}
    .fab:active{transform:scale(.92) rotate(90deg)}
    @media (min-width:781px){ .fab{bottom:28px;right:28px} }
    #tab-resumen{padding-bottom:76px}

    /* navegación inferior */
    .bottom-nav-btn{position:relative;transition:color .2s}
    .bottom-nav-btn svg{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
    .bottom-nav-btn.active svg{transform:translateY(-1px) scale(1.12);filter:drop-shadow(0 0 8px rgba(240,185,11,.55))}
    .bottom-nav-btn{isolation:isolate}
    .bottom-nav-btn.active::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:44px;height:30px;border-radius:12px;background:rgba(240,185,11,.14);z-index:-1}

    /* metas y gamificación */
    .hero-stats b{font-family:var(--display);display:inline-flex;align-items:center;gap:4px;justify-content:center}
    .pring{position:relative;flex-shrink:0}
    .pring svg{display:block}
    .pring-arc{animation:ringFill 1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(240,185,11,.35))}
    @keyframes ringFill{from{stroke-dashoffset:var(--c)}}
    .pring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
    .pring-in b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.5px}
    .pring-in span{font-size:12px;color:var(--text2)}
    .saving-wrap{display:flex;align-items:center;gap:18px;margin:16px 0 6px}
    .saving-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
    .saving-val{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.6px}
    .saving-msg{margin-top:6px;font-size:13px;font-weight:500;color:var(--gold2)}
    .months6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px;border-top:1px solid var(--border);padding-top:14px}
    .m6{display:flex;flex-direction:column;align-items:center;gap:6px}
    .m6 span{font-size:11px;color:var(--text3);text-transform:capitalize}
    .m6-bar{position:relative;width:100%;height:70px;display:flex;align-items:flex-end;justify-content:center}
    .m6-bar i{width:60%;border-radius:8px 8px 3px 3px;animation:growUp .8s cubic-bezier(.2,.8,.2,1)}
    .m6-bar i.pos{background:linear-gradient(180deg,#34e5a5,var(--green))}
    .m6-bar i.neg{background:linear-gradient(180deg,#ff8a9a,var(--red));opacity:.85}
    .m6-bar i.hit{box-shadow:0 0 12px rgba(14,203,129,.6)}
    .m6-bar em{position:absolute;left:0;right:0;border-top:2px dashed var(--gold2);opacity:.7}
    @keyframes growUp{from{transform:scaleY(0);transform-origin:bottom}}
    .goal-row{display:flex;align-items:center;gap:14px;width:100%;border:none;background:none;color:var(--text);font-family:inherit;text-align:left;padding:12px 2px;border-bottom:1px solid var(--border)}

    .goal-row .pring-in .cat-ico{box-shadow:none!important}
    .done-tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:#0b0e11;background:linear-gradient(135deg,#ffe27a,#f0b90b);border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:middle}
    .empty-big{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--text2);padding:24px 10px;font-size:13px}
    .empty-big svg{color:var(--gold2);opacity:.8}
    .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin-top:12px}
    .badge-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:9px 4px;border:none;border-radius:12px;background:var(--surface2);opacity:.5;color:var(--text);font-family:inherit}
    .badge-card b{font-size:10.5px;font-weight:600;line-height:1.15}
    .badge-ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--track);color:var(--text3)}

    .badge-card.ok .badge-ico{background:linear-gradient(135deg,#ffe27a,#f0b90b);color:#0b0e11;box-shadow:0 6px 16px rgba(240,185,11,.45)}

    /* confeti */
    .confetti{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
    .confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
    @keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}

    /* toast */
    .toast{left:50%;right:auto;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,10px);border:none;border-radius:999px;padding:11px 18px;font-family:var(--sans);font-size:13px;font-weight:500;
      background:var(--text);color:var(--bg);box-shadow:0 12px 30px rgba(0,0,0,.3);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
    .toast.show{transform:translate(-50%,0)}

    /* ─── MOBILE HEADER ─── */
    .mobile-header{display:none}
    .bottom-nav{display:none}

    @media (max-width: 1100px){
      .cards-3,.cards-2,.content-grid,.assets-grid,.invest-grid,.resumen-grid{grid-template-columns:1fr}

    }

      .sidebar-collapse{display:none}

      .mobile-header{flex:none}
      .app{flex:1;min-height:0;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
      .main{padding:14px 12px 16px;overflow:visible;flex:none}

      .mobile-brand{font-family:var(--mono);font-weight:600;font-size:16px;color:var(--text)}
      .mobile-brand span{color:var(--accent)}
      .mobile-capital .v{font-family:var(--mono);font-size:15px;font-weight:500;text-align:right}
      .mobile-capital .sub{font-family:var(--mono);font-size:10px;text-align:right;margin-top:2px}
      .cards-3{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px}

      .bottom-nav{display:flex;order:3;flex:none;position:relative;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom) !important;background:var(--nav-bg);border-top:1px solid var(--border);z-index:40;padding:0 4px}
      .bottom-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--text3);font-size:10px;font-family:var(--mono);padding:6px 4px;border-radius:6px;transition:.12s;letter-spacing:.3px}
      .bottom-nav-btn.active{color:var(--accent)}
    }

function walletValueARS(w){
  const saldo=Number(w.saldo||0);
  const usd=state.quotes.usd||null;
  const btc=state.quotes.btc||null;
  const usdt=state.quotes.usdt||null;
  if(w.moneda==='ARS') return saldo;
  if(w.moneda==='USD' && usd) return saldo*usd;
  if(w.moneda==='USDT' && usdt && usd) return saldo*usdt*usd;
  if(w.moneda==='BTC' && btc && usd) return saldo*btc*usd;
  return null;
}

// Inversiones convertidas a ARS
function investValueARS(i){
  const v=walletValueARS({saldo:i.capital,moneda:i.moneda});
  return v!==null?v:Number(i.capital||0);
}
function totalInvestARS(){ return state.invest.reduce((a,i)=>a+investValueARS(i),0); }
// Patrimonio = billeteras + inversiones
function patrimonioARS(){
  return state.wallets.reduce((a,w)=>{const v=walletValueARS(w);return a+(v!==null?v:Number(w.saldo||0));},0) + totalInvestARS();

// ─── PERSISTENCIA — SAFARI COMPATIBLE ───
// Estrategia: los datos viven dentro del propio archivo HTML en <script id="SAVED_DATA">.
// Al guardar: (1) localStorage para sesión inmediata.
//             (2) genera y descarga automáticamente el HTML actualizado con los datos embebidos.
// El usuario reemplaza el archivo descargado con el anterior → datos siempre adentro del HTML.

let _saveTimer = null;
let _pendingDownload = false;

function load(k, fb){
  // Primero leer desde el bloque embebido en este mismo HTML
  try {
    const el = document.getElementById('SAVED_DATA');
    if(el && el.textContent.trim()){
      const all = JSON.parse(el.textContent);
      if(all[k] !== undefined) return all[k];
    }
  } catch(e){}
  // Fallback: localStorage (misma sesión)
  try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch { return fb; }
}

function save(k, v){
  localStorage.setItem(k, JSON.stringify(v));
}

function buildUpdatedHTML(){
  const allData = {
    ct_txns:    state.txns,
    ct_wallets: state.wallets,
    ct_invest:  state.invest,
    ct_quotes:  state.quotes,
    ct_cats:    state.cats,
    ct_goals:   state.goals,
    ct_settings:state.settings,
  };
  const dataJSON = JSON.stringify(allData);
  const html = document.documentElement.outerHTML;
  // Reemplazar el bloque SAVED_DATA con los datos actuales
  const updated = html.replace(
    /<script id="SAVED_DATA"[^>]*>[\s\S]*?<\/script>/,
    `<script id="SAVED_DATA" type="application/json">${dataJSON}<\/script>`
  );
  return '<!DOCTYPE html>\n' + updated;
}

function downloadHTML(){

// Monto: solo números, acepta coma o punto decimal
function bindMontoInput(el){
  const f=()=>{
    let v=el.value;
    if(v.endsWith('.')) v=v.slice(0,-1)+',';      // el punto tipeado al final es decimal
    const neg=v.trim().startsWith('-');
    v=v.replace(/[^0-9,]/g,'');
    const k=v.indexOf(',');
    let ent=k>=0?v.slice(0,k):v, dec=k>=0?v.slice(k+1).replace(/,/g,'').slice(0,2):null;
    ent=ent.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    el.value=(neg?'-':'')+ent+(dec!==null?','+dec:'');
  };
  el.addEventListener('input',f);
  if(el.value) f();
}

// ─── PROJECTED YIELD ───
// Compuesto mensual: ciclo iterativo explícito mes a mes
// Simple: capital × (TNA/100) × (meses/12)
function proyectar(capital, tna_pct, meses, compuesto){
  const cap = Number(capital) || 0;
  const tna = Number(tna_pct) || 0;
  const m   = Number(meses)   || 0;
  if(cap <= 0 || tna <= 0 || m <= 0) return cap;

  if(compuesto === true){
    // Ciclo explícito: cada mes suma los intereses al saldo
    let saldo = cap;
    const tasaMensual = tna / 100 / 12;
    for(let i = 0; i < m; i++){
      saldo = saldo + saldo * tasaMensual;
    }
    return saldo;
  } else {
    // Interés simple: lineal
    return cap + cap * (tna / 100) * (m / 12);
  }
}

// ─── PIE CARD ───
function pieCard(title, data, colors){
  if(!data.length) return '';  // No mostrar nada si no hay datos
  const total = data.reduce((a,[,v])=>a+v,0);
  const cx=56,cy=56,r=46;
  let slices;
  if(data.length===1){
    // Un solo elemento: círculo completo
    slices=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${colors[0]}"></circle>`;
  } else {
    let cum=-90;
    slices = data.map(([cat,val],i)=>{
      const pct=val/total, angle=pct*360;
      // Cap angle slightly below 360 to avoid degenerate arc
      const safeAngle=Math.min(angle,359.99);
      const s=(cum*Math.PI)/180; cum+=angle; const e=(cum*Math.PI)/180;
      const x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s),x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
      return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r},0,${safeAngle>180?1:0},1,${x2},${y2} Z" fill="${colors[i%colors.length]}"></path>`;
    }).join('');
  }
  const legend = data.slice(0,6).map(([cat,val],i)=>`
    <div class="legend-row">
      <div class="legend-left"><span class="sw" style="background:${colors[i%colors.length]}"></span><span class="truncate">${esc(cat)}</span></div>
      <span class="legend-pct">${Math.round(val/total*100)}%</span>
    </div>`).join('');
  return `
    <div class="card">
      <div class="section-title">${title}</div>
      <div class="pie-wrap">
        <svg width="112" height="112" viewBox="0 0 112 112">${slices}<circle cx="${cx}" cy="${cy}" r="20" fill="#161a1f"></circle></svg>
        <div class="legend">${legend}</div>
      </div>
    </div>`;
}

    addTxn({id:Date.now(),tipo,categoria:cat.nombre,monto,descripcion:modal.querySelector('#qDesc').value.trim(),fecha:modal.querySelector('#qFecha').value||todayStr(),walletId});
  };
}

// ─── GESTIÓN DE CATEGORÍAS ───
function openCatModal(tipo, onDone){
  let icon=CAT_ICON_KEYS[0], color=CAT_COLORS[0], editing=null; // editing = nombre de la categoría en edición
  const modal=openModal(`
    <div class="modal-title">Categorías de ${tipo==='ingreso'?'ingresos':'gastos'}</div>
    <div class="cat-list" id="cmList"></div>
    <div class="divider"></div>
    <div class="section-title" id="cmFormTitle" style="margin-bottom:8px">Nueva categoría</div>
    <div class="form-stack">
      <div style="display:flex;gap:10px;align-items:center">
        <span id="cmPreview"></span>
        <input id="cmNombre" class="field" type="text" placeholder="Ej: Gato, Gimnasio, Nafta…" style="flex:1">
      </div>
      <div><label class="label">Color</label><div class="color-grid" id="cmColors"></div></div>
      <div><label class="label">Ícono</label><div class="emoji-grid" id="cmEmojis"></div></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button id="cmSave" class="btn btn-accent" style="flex:1">Agregar</button>
      <button id="cmClose" class="btn btn-ghost">Cerrar</button>
    </div>`);
  const nombreEl=modal.querySelector('#cmNombre');
  const setMode=c=>{
    editing=c?c.nombre:null;
    if(c){ icon=c.icon; color=c.color; nombreEl.value=c.nombre; }
    else { icon=CAT_ICON_KEYS[0]; color=CAT_COLORS[0]; nombreEl.value=''; }
    modal.querySelector('#cmFormTitle').textContent=c?`Editar "${c.nombre}"`:'Nueva categoría';
    modal.querySelector('#cmSave').textContent=c?'Guardar cambios':'Agregar';
    modal.querySelector('#cmClose').textContent=c?'Cancelar':'Cerrar';
    draw();
    if(c) modal.querySelector('#cmFormTitle').scrollIntoView({behavior:'smooth',block:'start'});
  };
  const draw=()=>{
    modal.querySelector('#cmPreview').innerHTML=catIcon({icon,color},40);
    modal.querySelector('#cmEmojis').innerHTML=CAT_ICON_KEYS.map(e=>`<button class="emoji-btn ${e===icon?'sel':''}" data-e="${e}">${svgIcon(e,20)}</button>`).join('');
    modal.querySelector('#cmColors').innerHTML=CAT_COLORS.map(c=>`<button class="color-btn ${c===color?'sel':''}" data-c="${c}" style="background:${c}"></button>`).join('')
      + `<label class="color-btn color-custom" title="Otro color" style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)"><input type="color" id="cmCustom" value="${/^#[0-9a-f]{6}$/i.test(color)?color:'#f0b90b'}"></label>`;
    modal.querySelector('#cmList').innerHTML=catsOf(tipo).map(c=>`
      <div class="cat-list-row ${editing===c.nombre?'editing':''}" data-editcat="${esc(c.nombre)}">${catIcon(c,30)}<span style="flex:1">${esc(c.nombre)}</span><span class="cat-edit-hint">${svgIcon('pencil',16)}</span><button class="btn-danger" data-delcat="${esc(c.nombre)}">✕</button></div>`).join('') || `<div class="empty">Sin categorías</div>`;
    modal.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{icon=b.dataset.e;draw();});
    modal.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;draw();});
    modal.querySelector('#cmCustom').oninput=e=>{color=e.target.value;modal.querySelector('#cmPreview').innerHTML=catIcon({icon,color},40);};
    modal.querySelector('#cmCustom').onchange=()=>draw();
    modal.querySelectorAll('[data-editcat]').forEach(r=>r.onclick=()=>setMode(state.cats.find(c=>c.tipo===tipo&&c.nombre===r.dataset.editcat)));
    modal.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      if(!confirm(`¿Eliminar la categoría "${b.dataset.delcat}"? Los movimientos existentes se conservan.`)) return;
      state.cats=state.cats.filter(c=>!(c.tipo===tipo && c.nombre===b.dataset.delcat));
      save('ct_cats',state.cats);
      if(editing===b.dataset.delcat) setMode(null); else draw();
    });
  };
  draw();
  const close=()=>{ modal.remove(); (onDone||render)(); };
  modal.querySelector('#cmClose').onclick=()=>{ if(editing) setMode(null); else close(); };
  modal.onclick=e=>{ if(e.target===modal) close(); };
  modal.querySelector('#cmSave').onclick=()=>{
    const nombre=nombreEl.value.trim();
    if(!nombre) return;
    const dup=state.cats.some(c=>c.tipo===tipo && c.nombre.toLowerCase()===nombre.toLowerCase() && c.nombre!==editing);
    if(dup){ showToast('Esa categoría ya existe'); return; }
    if(editing){
      const c=state.cats.find(x=>x.tipo===tipo&&x.nombre===editing);
      if(nombre!==editing){ // renombrar también los movimientos
        state.txns.forEach(t=>{ if(t.tipo===tipo&&t.categoria===editing) t.categoria=nombre; });
        save('ct_txns',state.txns);
        if(state.formCat===editing) state.formCat=nombre;
      }
      Object.assign(c,{nombre,icon,color});
      save('ct_cats',state.cats);
      showToast(`"${nombre}" actualizada`);
      setMode(null);
    } else {
      state.cats.push({nombre,tipo,icon,color});
      save('ct_cats',state.cats);
      nombreEl.value='';
      showToast(`Categoría "${nombre}" agregada`);
      draw();
    }
  };
}

// ─── DONUT ───
function donutSVG(data, total, size=176, focus=null){
  const sw=18, r=size/2-sw/2-4, c=2*Math.PI*r, cx=size/2;
  let off=0;
  const segs = total>0 ? data.map(d=>{
    const len=d.val/total*c;
    const gap=data.length>1?Math.min(6,len*.4):0;
    const dim=focus&&focus!==d.nombre;
    const s=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${focus===d.nombre?sw+4:sw}" stroke-linecap="${data.length>1?'round':'butt'}" stroke-dasharray="${Math.max(len-gap,0.01)} ${c}" stroke-dashoffset="${-off-gap/2}" transform="rotate(-90 ${cx} ${cx})" opacity="${dim?.18:1}"></circle>`;
    off+=len; return s;
  }).join('') : '';
  return `<svg class="donut" width="100%" viewBox="0 0 ${size} ${size}" style="max-width:${size}px"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"></circle>${segs}</svg>`;
}

// Desplegable simple (botón + menú) que se cierra al tocar afuera
function bindDropdown(btn, menu){
  btn.onclick=e=>{
    e.stopPropagation();
    document.querySelectorAll('.dd-menu').forEach(m=>{ if(m!==menu) m.classList.add('hide'); });
    const open=menu.classList.toggle('hide')===false;
    if(open){
      const sel=menu.querySelector('.sel'); if(sel) menu.scrollTop=sel.offsetTop-menu.clientHeight/2;
      setTimeout(()=>document.addEventListener('click',()=>menu.classList.add('hide'),{once:true}));
    }
  };
}

// Número que cuenta hasta su valor
const _lastNums={};
function animateNumber(el, key, to, format){
  if(!el) return;
  const from=_lastNums[key]??0; _lastNums[key]=to;
  if(from===to || window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=format(to); return; }
  const t0=performance.now(), dur=700;
  const step=t=>{
    const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=format(from+(to-from)*e);
    if(k<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ─── RENDER RESUMEN ───
function renderResumen(){
  const root=document.getElementById('tab-resumen');
  if(state.walletFilter!=='all' && !state.wallets.some(w=>w.id===state.walletFilter)) state.walletFilter='all';
  const [yy,mm]=state.calDate.split('-').map(Number);
  const monthKey=`${yy}-${String(mm).padStart(2,'0')}`;
  const monthLabel=new Date(yy,mm-1).toLocaleString('es-AR',{month:'long',year:'numeric'});
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  const daysInMonth=new Date(yy,mm,0).getDate();
  const tipo=state.viewTipo;
  const catF=state.catFilter && catsOf(tipo).some(c=>c.nombre===state.catFilter) || (state.catFilter && filteredTxns().some(t=>t.tipo===tipo&&t.categoria===state.catFilter)) ? state.catFilter : null;
  if(!catF) state.catFilter=null;
  const inCat=t=>!catF || (t.tipo===tipo && t.categoria===catF);

  // Movimientos del mes (billetera elegida)
  const monthTxns=filteredTxns().filter(t=>t.fecha.startsWith(monthKey)).map(t=>({...t,ars:txnARS(t)})).filter(t=>t.ars!==null);
  const viewTxnsAll=monthTxns.filter(t=>t.tipo===tipo);
  const viewTotalAll=viewTxnsAll.reduce((a,t)=>a+t.ars,0);
  const scoped=monthTxns.filter(inCat);                       // todo lo de abajo respeta el filtro de categoría
  const mIng=scoped.filter(t=>t.tipo==='ingreso').reduce((a,t)=>a+t.ars,0);
  const mGas=scoped.filter(t=>t.tipo==='gasto').reduce((a,t)=>a+t.ars,0);
  const mBalance=mIng-mGas;
  const viewTxns=scoped.filter(t=>t.tipo===tipo);
  const viewTotal=viewTxns.reduce((a,t)=>a+t.ars,0);

  // Totales por categoría (siempre todas, para poder cambiar el filtro)
  const byCat={};
  viewTxnsAll.forEach(t=>byCat[t.categoria]=(byCat[t.categoria]||0)+t.ars);
  const catData=Object.entries(byCat).map(([n,v])=>({...getCat(n,tipo),nombre:n,val:v})).sort((a,b)=>b.val-a.val);

  const fw=state.walletFilter!=='all'?state.wallets.find(w=>w.id===state.walletFilter):null;
  const monthOptions=[];
  {
    const now=new Date();
    const first=state.txns.reduce((m,t)=>t.fecha&&t.fecha<m?t.fecha:m, todayStr());
    let d=new Date(now.getFullYear(),now.getMonth(),1);
    const min=new Date(Math.min(new Date(Number(first.slice(0,4)),Number(first.slice(5,7))-1,1), new Date(now.getFullYear(),now.getMonth()-11,1)));
    while(d>=min){
      const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      monthOptions.push({key,label:cap(d.toLocaleString('es-AR',{month:'long',year:'numeric'}))});
      d=new Date(d.getFullYear(),d.getMonth()-1,1);
    }
    if(!monthOptions.some(o=>o.key===monthKey)) monthOptions.unshift({key:monthKey,label:cap(monthLabel)});
  }

  // Valor principal: saldo del mes, o total de la categoría filtrada
  const catObj=catF?getCat(catF,tipo):null;
  const heroVal=catF?(tipo==='gasto'?-viewTotal:viewTotal):mBalance;
  const heroColor=heroVal<0?'var(--red)':'var(--green)';
  const fmtHero=v=>`${v<0?'-':'+'}${fmt(Math.abs(v))}`;

  // Slots alrededor del anillo
  const cats=catsOf(tipo);
  const slotCats=cats.slice(0,11);
  const pos=[[1,1],[1,2],[1,3],[1,4],[2,1],[2,4],[3,1],[3,4],[4,1],[4,2],[4,3]];
  const slotHTML=slotCats.map((c,i)=>{
    const v=byCat[c.nombre]||0;
    const st=catF?(catF===c.nombre?'on':'off'):'';
    return `<button class="ring-slot ${st}" style="grid-row:${pos[i][0]};grid-column:${pos[i][1]}" data-fcat="${esc(c.nombre)}">
      <span class="ring-name">${esc(c.nombre)}</span>
      ${catIcon(c, 46)}
      <span class="ring-amt" style="color:${v>0?c.color:'var(--text3)'}">${v>0?fmtShort(v):'$0'}</span>
    </button>`;
  }).join('') + `<button class="ring-slot ${catF?'off':''}" style="grid-row:4;grid-column:4" id="ringMore">
      <span class="ring-name">Más</span>
      <span class="cat-ico cat-ico-add" style="width:46px;height:46px">${svgIcon('chevron',22)}</span>
      <span class="ring-amt" style="color:var(--text3)">${cats.length>11?`+${cats.length-11}`:'+ nueva'}</span>
    </button>`;

  // Barras diarias (apiladas por categoría)
  const days={};
  viewTxns.forEach(t=>{const d=Number(t.fecha.slice(8,10));(days[d]=days[d]||{});days[d][t.categoria]=(days[d][t.categoria]||0)+t.ars;});
  const maxDay=Math.max(1,...Object.values(days).map(o=>Object.values(o).reduce((a,b)=>a+b,0)));
  const selDay=state.selDay&&state.selDay.startsWith(monthKey)?Number(state.selDay.slice(8,10)):null;
  let bars='';
  for(let d=1;d<=daysInMonth;d++){
    const o=days[d]||{};
    const stack=Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div style="height:${v/maxDay*100}%;background:${getCat(n,tipo).color}"></div>`).join('');
    bars+=`<button class="bar-col ${selDay===d?'sel':''} ${stack?'':'empty-day'}" data-day="${d}" aria-label="Día ${d}"><div class="bar-stack">${stack}</div></button>`;
  }
  const ticks=[1,10,17,24,daysInMonth].map(d=>`<span style="left:${(d-.5)/daysInMonth*100}%">${d}</span>`).join('');

  // Detalle del día tocado
  let dayDetail='';
  if(selDay){
    const ds=`${monthKey}-${String(selDay).padStart(2,'0')}`;
    const dt=viewTxns.filter(t=>t.fecha===ds);
    const tot=dt.reduce((a,t)=>a+t.ars,0);
    const label=cap(new Date(yy,mm-1,selDay).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'short'}));
    dayDetail=`<div class="day-detail">
      <div class="day-detail-head"><span>${label}</span><b style="color:${tipo==='gasto'?'var(--red)':'var(--green)'}">${tipo==='gasto'?'-':'+'}${fmt(tot)}</b></div>
      ${dt.length?dt.map(t=>txnRow(t)).join(''):`<div class="empty" style="padding:10px 0">Sin ${tipo==='gasto'?'gastos':'ingresos'} este día</div>`}
    </div>`;
  }

  const now=new Date(); const isCurMonth=now.getFullYear()===yy&&now.getMonth()+1===mm;
  const daysElapsed=isCurMonth?now.getDate():daysInMonth;
  const todayVal=viewTxns.filter(t=>t.fecha===todayStr()).reduce((a,t)=>a+t.ars,0);
  const weekAgo=new Date(now.getTime()-6*86400000).toISOString().split('T')[0];
  const weekVal=filteredTxns().filter(t=>t.tipo===tipo&&inCat(t)&&t.fecha>=weekAgo&&t.fecha<=todayStr()).reduce((a,t)=>a+(txnARS(t)||0),0);
  const tipoColor=tipo==='gasto'?'var(--red)':'var(--green)';

  const recent=filteredTxns().filter(inCat).slice(0,8);

  root.innerHTML=`
    <div class="hero hero-main">
      <div class="hero-glow"></div>
      <div class="hero-row">
        <div class="dd">
          <button class="pill-btn" id="walletBtn">${svgIcon('wallet',14)} ${fw?esc(fw.nombre):'Seleccionar billetera'} ${svgIcon('chevron',12)}</button>
          <div class="dd-menu hide" id="walletMenu">
            <button class="${!fw?'sel':''}" data-acc="all">Todas las billeteras</button>
            ${state.wallets.map(w=>`<button class="${fw&&fw.id===w.id?'sel':''}" data-acc="${w.id}"><span class="sw" style="background:${w.color||'var(--accent)'}"></span>${esc(w.nombre)}</button>`).join('')}
          </div>
        </div>
        <div class="dd">
          <button class="pill-btn" id="monthBtn">${svgIcon('calendar',14)} ${cap(new Date(yy,mm-1).toLocaleString('es-AR',{month:'short'}).replace('.',''))} ${yy} ${svgIcon('chevron',12)}</button>
          <div class="dd-menu dd-right hide" id="monthMenu">
            ${monthOptions.map(o=>`<button class="${o.key===monthKey?'sel':''}" data-month="${o.key}">${o.label}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="hero-main-val" id="heroVal" style="color:${heroColor}">${fmtHero(heroVal)}</div>
      <div class="hero-sub">${catF?`${esc(catF)} · ${cap(monthLabel)}`:`Saldo de ${cap(monthLabel)}`}</div>
      ${catF?`<button class="filter-chip" id="clearCat">${catIcon(catObj,20)} ${esc(catF)} <span>✕</span></button>`:`
      <div class="hero-flow">
        <div><span class="dot-in"></span>Ingresos<b>+${fmtShort(mIng)}</b></div>
        <div><span class="dot-out"></span>Gastos<b>-${fmtShort(mGas)}</b></div>
      </div>`}
    </div>

    <div class="cards-2 resumen-grid">
      <div class="card ring-card">
        <div class="seg" style="margin-bottom:14px">
          <button class="seg-btn ${tipo==='gasto'?'active seg-red':''}" data-vt="gasto">Gastos</button>
          <button class="seg-btn ${tipo==='ingreso'?'active seg-green':''}" data-vt="ingreso">Ingresos</button>
        </div>
        <div class="ring-grid ${catF?'filtering':''}">
          ${slotHTML}
          <div class="ring-center" id="ringCenter">
            ${donutSVG(catData,viewTotalAll,176,catF)}
            <div class="ring-center-txt">
              ${catF?`
                <div class="rc-label">${esc(catF)}</div>
                <div class="rc-val" style="color:${catObj.color}">${fmtShort(viewTotal)}</div>
                <div class="rc-sub">${viewTotalAll>0?Math.round(viewTotal/viewTotalAll*100):0}% del total</div>`:`
                <div class="rc-label">${tipo==='gasto'?'Gastos':'Ingresos'}</div>
                <div class="rc-val" style="color:${tipoColor}">${fmtShort(viewTotalAll)}</div>
                <div class="rc-sub">${catData.length} ${catData.length===1?'categoría':'categorías'}</div>`}
            </div>
          </div>
        </div>
        <div class="hint">${catF?'Tocá de nuevo para ver todo':'Tocá una categoría para filtrar'}</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="card" style="padding:0;overflow:hidden">
          <div class="split">
            <button class="split-red ${tipo==='gasto'?'sel':''}" data-vt="gasto"><div>Gastos</div><b>${fmt(mGas)}</b></button>
            <button class="split-green ${tipo==='ingreso'?'sel':''}" data-vt="ingreso"><div>Ingresos</div><b>${fmt(mIng)}</b></button>
          </div>
          <div class="bars-wrap">
            <div class="bars-max">${fmtShort(maxDay)}</div>
            <div class="bars">${bars}</div>
            <div class="bars-ticks">${ticks}</div>
          </div>
          ${dayDetail}
          <div class="mini-stats">
            <div><span>Día (prom.)</span><b style="color:${tipoColor}">${fmtShort(viewTotal/Math.max(daysElapsed,1))}</b></div>
            <div><span>Hoy</span><b style="color:${todayVal?tipoColor:'var(--text3)'}">${fmtShort(todayVal)}</b></div>
            <div><span>Semana</span><b style="color:${tipoColor}">${fmtShort(weekVal)}</b></div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">${tipo==='gasto'?'Gastos':'Ingresos'} por categoría</div>
          ${catData.length?catData.map(c=>{
            const pct=viewTotalAll>0?c.val/viewTotalAll*100:0;
            return `<button class="cat-row ${catF?(catF===c.nombre?'on':'off'):''}" data-fcat="${esc(c.nombre)}">
              ${catIcon(c,38)}
              <div style="flex:1;min-width:0">
                <div style="display:flex;justify-content:space-between;gap:8px"><span class="cat-row-name">${esc(c.nombre)}</span><span class="cat-row-val">${fmt(c.val)}</span></div>
                <div class="pbar"><i style="width:${pct}%;background:${c.color};box-shadow:0 0 10px ${c.color}66"></i></div>
                <div style="text-align:right;font-size:11px;color:${c.color};margin-top:3px;font-weight:600">${Math.round(pct)}%</div>
              </div>
            </button>`;}).join(''):`<div class="empty">Sin ${tipo==='gasto'?'gastos':'ingresos'} este mes</div>`}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">${catF?`Movimientos de ${esc(catF)}`:'Últimos movimientos'}</div>
      ${recent.length?recent.map(t=>txnRow(t)).join(''):`<div class="empty">Sin movimientos aún</div>`}
    </div>
  `;

  animateNumber(document.getElementById('heroVal'),'hero',heroVal,fmtHero);
  bindDropdown(document.getElementById('walletBtn'),document.getElementById('walletMenu'));
  bindDropdown(document.getElementById('monthBtn'),document.getElementById('monthMenu'));
  root.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{state.walletFilter=b.dataset.acc==='all'?'all':Number(b.dataset.acc);renderResumen();});
  root.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{state.calDate=`${b.dataset.month}-01`;state.selDay=null;renderResumen();});
  root.querySelectorAll('[data-vt]').forEach(b=>b.onclick=()=>{ if(state.viewTipo!==b.dataset.vt){state.viewTipo=b.dataset.vt;state.catFilter=null;} renderResumen();});
  root.querySelectorAll('[data-fcat]').forEach(b=>b.onclick=()=>{ state.catFilter=state.catFilter===b.dataset.fcat?null:b.dataset.fcat; renderResumen(); });
  document.getElementById('ringCenter').onclick=()=>{ if(catF) state.catFilter=null; else { state.viewTipo=tipo==='gasto'?'ingreso':'gasto'; } renderResumen(); };
  const clr=document.getElementById('clearCat'); if(clr) clr.onclick=()=>{state.catFilter=null;renderResumen();};
  document.getElementById('ringMore').onclick=()=>openAllCatsModal(tipo,true);
  root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{

function fmtShort(n){
  const v=Math.abs(Number(n||0));
  const s=v>=1e6?(v/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+'M':v>=1e4?(v/1e3).toLocaleString('es-AR',{maximumFractionDigits:1})+'k':v.toLocaleString('es-AR',{maximumFractionDigits:0});
  return (n<0?'-$':'$')+s;
}

            <input id="txnDesc" class="field" type="text" placeholder="Descripción">
          </div>
          <button id="addTxn" class="btn btn-big ${state.formTipo==='ingreso'?'btn-green':'btn-red'}">Registrar</button>
        </div>
      </div>
      <div class="card">
        <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
          <span>Historial</span>
          <span class="list-sub">${state.txns.length} movimientos</span>

// Mantener apretado para arrastrar y reordenar filas [data-sort]
function enableSort(container, onDone){
  if(!container) return;
  let timer=null, drag=null, downY=0, suppressClick=false;
  const cancelTimer=()=>{ clearTimeout(timer); timer=null; };
  container.querySelectorAll('[data-sort]').forEach(row=>{
    row.addEventListener('pointerdown',e=>{
      if(e.button>0) return;
      downY=e.clientY;
      const pid=e.pointerId;
      timer=setTimeout(()=>{
        timer=null;
        drag={row,startY:downY};
        try{ row.setPointerCapture(pid); }catch(_){}
        row.classList.add('dragging');
        container.classList.add('sorting');
        if(navigator.vibrate) navigator.vibrate(15);
      },380);
    });
  });
  container.addEventListener('pointermove',e=>{
    if(timer && Math.abs(e.clientY-downY)>8) cancelTimer();
    if(!drag) return;
    e.preventDefault();
    const row=drag.row;
    row.style.transform=`translateY(${e.clientY-drag.startY}px)`;
    const rows=[...container.querySelectorAll('[data-sort]')];
    const i=rows.indexOf(row);
    const r=row.getBoundingClientRect(), mid=r.top+r.height/2;
    const next=rows[i+1], prev=rows[i-1];
    if(next){ const n=next.getBoundingClientRect(); if(mid>n.top+n.height/2){ container.insertBefore(next,row); drag.startY+=n.height; row.style.transform=`translateY(${e.clientY-drag.startY}px)`; return; } }
    if(prev){ const p=prev.getBoundingClientRect(); if(mid<p.top+p.height/2){ container.insertBefore(row,prev); drag.startY-=p.height; row.style.transform=`translateY(${e.clientY-drag.startY}px)`; } }
  });
  const end=()=>{
    cancelTimer();
    if(!drag) return;
    drag.row.style.transform='';
    drag.row.classList.remove('dragging');
    container.classList.remove('sorting');
    drag=null; suppressClick=true;
    setTimeout(()=>suppressClick=false,350);
    onDone([...container.querySelectorAll('[data-sort]')].map(r=>Number(r.dataset.sort)));
  };
  container.addEventListener('pointerup',end);
  container.addEventListener('pointercancel',end);
  container.addEventListener('touchmove',e=>{ if(drag) e.preventDefault(); },{passive:false});
  container.addEventListener('contextmenu',e=>e.preventDefault());
  container.addEventListener('click',e=>{ if(suppressClick){ e.stopPropagation(); e.preventDefault(); } },true);
}
