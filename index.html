<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mid Vault">
  <title>Mid Vault</title>
  <meta name="application-name" content="Mid Vault">
  <meta name="theme-color" content="#0b0e11">
  <link rel="apple-touch-icon" href="mid-vault-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="mid-vault-icon.png">
  <link rel="icon" type="image/png" href="mid-vault-icon.png">
  <link rel="shortcut icon" type="image/png" href="mid-vault-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e11;
      --surface: #161a1f;
      --surface2: #1e2329;
      --border: #2b3139;
      --border2: #363c45;
      --text: #eaecef;
      --text2: #848e9c;
      --text3: #5a6270;
      --accent: #f0b90b;
      --gold2: #ffd54a;
      --green: #0ecb81;
      --red: #f6465d;
      --blue: #4a9eff;
      --mono: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --sans: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-family:var(--sans);background:var(--bg);color:var(--text);font-weight:400;font-size:14px}
    button,input,select{font-family:inherit}
    button{cursor:pointer}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
    select option{background:var(--surface2);color:var(--text)}

    /* ─── LAYOUT ─── */
    .app{display:flex;min-height:100vh}
    .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:24px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:hidden;transition:width .2s ease,padding .2s ease,opacity .15s ease}
    .sidebar.collapsed{width:0;padding:24px 0;border-right:none;opacity:0;pointer-events:none}
    .sidebar-collapse{position:fixed;left:208px;top:50%;transform:translateY(-50%);width:16px;height:48px;border:1px solid var(--border);border-left:none;border-radius:0 6px 6px 0;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:10px;z-index:20;transition:left .2s ease}
    .sidebar-collapse:hover{background:var(--surface2);color:var(--text)}
    .sidebar-collapsed .sidebar-collapse{left:0;border-left:1px solid var(--border)}
    .sidebar-collapsed .main{padding-left:32px}

    .brand{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:-0.5px;padding:8px 12px 16px;color:var(--text)}
    .brand span{color:var(--accent)}

    .tab-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border:none;border-radius:6px;background:transparent;color:var(--text2);font-size:13px;font-weight:400;text-align:left;width:100%;transition:.12s;letter-spacing:.2px}
    .tab-btn:hover{background:var(--surface2);color:var(--text)}
    .tab-btn.active{background:var(--surface2);color:var(--accent);font-weight:500}
    .tab-btn .icon{font-family:var(--mono);font-size:11px;width:18px;text-align:center;color:var(--text3)}
    .tab-btn.active .icon{color:var(--accent)}

    .side-card{margin-top:auto;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px}
    .side-card .k{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:var(--mono)}
    .side-card .v{font-size:20px;font-weight:500;font-family:var(--mono);color:var(--text)}
    .side-card .sub{font-size:11px;font-weight:400;margin-top:4px;font-family:var(--mono)}
    .sub.ok{color:var(--green)}.sub.bad{color:var(--red)}

    .main{flex:1;padding:28px 24px;overflow:auto}

    /* ─── TYPOGRAPHY ─── */
    .page-title{font-family:var(--mono);font-size:18px;font-weight:500;margin-bottom:20px;letter-spacing:-0.3px;color:var(--text);border-bottom:1px solid var(--border);padding-bottom:14px}
    .section-title{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}

    /* ─── CARDS ─── */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px}
    .cards-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
    .cards-2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:16px}
    .content-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
    .assets-grid{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
    .invest-grid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}

    .stat-label{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .stat-val{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-0.5px;color:var(--text)}
    .stat-val.green{color:var(--green)}.stat-val.red{color:var(--red)}.stat-val.yellow{color:var(--accent)}

    /* ─── FORMS ─── */
    .field{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:13px;font-family:var(--mono);color:var(--text);outline:none;transition:.12s}
    .field:focus{border-color:var(--accent);background:var(--surface2)}
    .field::placeholder{color:var(--text3)}
    .label{display:block;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
    .form-stack{display:flex;flex-direction:column;gap:10px}

    /* ─── BUTTONS ─── */
    .btn{border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:500;font-family:var(--mono);letter-spacing:.3px;transition:.12s}
    .btn-accent{background:var(--accent);color:#0b0e11}
    .btn-accent:hover{background:#f8c914}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
    .btn-ghost:hover{border-color:var(--border2);color:var(--text)}
    .btn-danger{background:transparent;border:1px solid var(--border);color:var(--red);font-size:11px;padding:5px 9px;border-radius:4px}
    .btn-danger:hover{background:rgba(246,70,93,.1)}

    /* ─── SEGMENT ─── */
    .seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px;gap:3px;margin-bottom:14px}
    .seg-btn{flex:1;border:none;border-radius:4px;padding:7px 0;background:transparent;color:var(--text2);font-size:12px;font-weight:400;font-family:var(--mono);letter-spacing:.3px;transition:.12s}
    .seg-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}

    /* ─── TABLE ROWS ─── */
    .row-hover{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;border-bottom:1px solid var(--border)}
    .row-hover:last-child{border-bottom:none}
    .row-hover:hover{background:var(--surface2)}
    .amount-positive{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--green)}
    .amount-negative{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--red)}
    .amount-neutral{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--text)}

    /* ─── BADGES ─── */
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:500;font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase}
    .badge-green{background:rgba(14,203,129,.12);color:var(--green)}
    .badge-red{background:rgba(246,70,93,.12);color:var(--red)}
    .badge-yellow{background:rgba(240,185,11,.12);color:var(--accent)}
    .badge-blue{background:rgba(74,158,255,.12);color:var(--blue)}
    .badge-gray{background:var(--surface2);color:var(--text2)}

    /* ─── CALENDAR ─── */
    .calendar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
    .cal-head{font-family:var(--mono);font-size:9px;font-weight:400;color:var(--text3);padding-bottom:5px;letter-spacing:.5px}
    .cal-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;height:32px;font-family:var(--mono);font-size:12px;font-weight:400;color:var(--text2);transition:.1s}
    .cal-cell:hover{background:var(--surface2);color:var(--text)}
    .dot{width:4px;height:4px;border-radius:50%;margin-top:2px}

    /* ─── WALLET CARD ─── */
    .wallet{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)}
    .wallet:hover{border-color:var(--border2)}
    .wallet-left{display:flex;align-items:center;gap:12px}
    .wallet-tag{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
    .wallet-amount{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--text)}
    .wallet-actions{display:flex;align-items:center;gap:8px}

    /* ─── BARS ─── */
    .bar{height:3px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:6px}
    .bar > div{height:100%;border-radius:3px}

    /* ─── PIE CHART ─── */
    .pie-wrap{display:flex;align-items:center;gap:14px}
    .legend{display:flex;flex-direction:column;gap:5px;flex:1}
    .legend-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}
    .legend-left{display:flex;align-items:center;gap:8px;min-width:0}
    .sw{width:8px;height:8px;border-radius:2px;flex-shrink:0}
    .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:11px;color:var(--text2)}
    .legend-pct{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--text)}

    /* ─── INVEST ─── */
    .invest-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px}
    .invest-name{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text)}
    .invest-rate{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--accent)}
    .invest-meta{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
    .projected-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12px}
    .projected-row:last-child{border-bottom:none}

    /* ─── NOTIFICATION TOAST ─── */
    .toast{position:fixed;bottom:80px;right:20px;background:var(--surface2);border:1px solid var(--accent);border-radius:6px;padding:10px 16px;font-family:var(--mono);font-size:12px;color:var(--text);z-index:100;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
    .toast.show{opacity:1;transform:translateY(0)}

    /* ─── MISC ─── */
    .empty{padding:24px;text-align:center;color:var(--text3);font-family:var(--mono);font-size:12px;letter-spacing:.5px}
    .muted{color:var(--text2)}
    .hide{display:none}
    .head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .divider{height:1px;background:var(--border);margin:14px 0}
    .ticker{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.5px}

    /* ─── WALLET SELECTOR IN FORM ─── */
    .wallet-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
    .wallet-pill{border:1px solid var(--border);border-radius:16px;padding:7px 12px;font-size:13px !important;background:transparent;color:var(--text2);font-family:var(--mono);font-size:11px;cursor:pointer;transition:.1s}
    .wallet-pill:hover{border-color:var(--border2);color:var(--text)}
    .wallet-pill.selected{border-color:var(--accent);color:var(--accent);background:rgba(240,185,11,.06)}

    /* ─── RESUMEN: HERO ─── */
    .hero{background:linear-gradient(135deg,#3a2c05 0%,#1d1806 45%,#161a1f 100%);border:1px solid rgba(240,185,11,.35);border-radius:14px;padding:16px;margin-bottom:16px;text-align:center}
    .hero-acc{background:none;border:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:2px;margin:0 auto}
    .hero-acc-label{font-size:12px;color:var(--gold2)}
    .hero-acc-val{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--text)}
    .acc-chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;justify-content:center;flex-wrap:wrap}
    .acc-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(240,185,11,.3);background:rgba(0,0,0,.25);color:var(--text2);border-radius:20px;padding:5px 12px;font-size:12px;white-space:nowrap}
    .acc-chip.sel{background:var(--accent);color:#0b0e11;border-color:var(--accent);font-weight:600}
    .month-nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.5px}
    .month-nav button{background:none;border:none;color:var(--gold2);font-size:22px;padding:0 12px}
    .resumen-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .seg-btn.seg-red{background:var(--red);color:#fff}
    .seg-btn.seg-green{background:var(--green);color:#0b0e11}
    .btn-red{background:var(--red);color:#fff}.btn-red:hover{filter:brightness(1.1)}
    .btn-green{background:var(--green);color:#0b0e11}.btn-green:hover{filter:brightness(1.1)}

    /* ─── ANILLO DE CATEGORÍAS ─── */
    .cat-ico{color:#fff;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.35)}
    .cat-ico-add{background:var(--surface2);color:var(--text2);border:1px dashed var(--border2)}
    .ring-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 4px;align-items:center}
    .ring-slot{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--text);padding:4px 0;border-radius:10px;transition:.12s;min-width:0}
    .ring-slot:hover{background:var(--surface2)}
    .ring-slot:active{transform:scale(.95)}
    .ring-name{font-size:11px;color:var(--text2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ring-amt{font-family:var(--mono);font-size:11px;font-weight:600}
    .ring-center{grid-row:2/4;grid-column:2/4;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .ring-center-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

    /* ─── BALANCE / BARRAS ─── */
    .bal-row{display:flex;align-items:center;padding:14px 16px}
    .bal-count{width:38px;height:38px;border-radius:50%;border:2px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px}
    .split{display:grid;grid-template-columns:1fr 1fr}
    .split button{border:none;padding:10px;font-size:12px;text-align:center;opacity:.75}
    .split button b{font-family:var(--mono);font-size:17px;display:block;margin-top:2px}
    .split button.sel{opacity:1}
    .split-red{background:var(--red);color:#fff}
    .split-green{background:rgba(14,203,129,.15);color:var(--green)}
    .split-green.sel{background:var(--green);color:#0b0e11}
    .split-red:not(.sel){background:rgba(246,70,93,.15);color:var(--red)}
    .bars-wrap{position:relative;padding:18px 12px 22px;border-bottom:1px solid var(--border)}
    .bars-max{position:absolute;right:12px;top:2px;font-family:var(--mono);font-size:10px;color:var(--text3)}
    .bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--border2)}
    .bar-col{flex:1;height:100%;display:flex;flex-direction:column-reverse;cursor:pointer;border-radius:2px 2px 0 0;overflow:hidden}
    .bar-col:hover{background:rgba(255,255,255,.04)}
    .bar-col.sel{background:rgba(240,185,11,.12);outline:1px solid rgba(240,185,11,.4)}
    .bars-ticks{position:relative;height:14px;font-family:var(--mono);font-size:10px;color:var(--text3)}
    .bars-ticks span{position:absolute;top:3px;transform:translateX(-50%)}
    .mini-stats{display:grid;grid-template-columns:repeat(3,1fr)}
    .mini-stats>div{padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--border)}
    .mini-stats>div:last-child{border-right:none}
    .mini-stats span{font-size:11px;color:var(--text2)}
    .mini-stats b{font-family:var(--mono);font-size:13px;font-weight:600}
    .cat-row{display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer;border-radius:8px}
    .cat-row:hover{background:var(--surface2)}
    .cat-row-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* ─── MODALES / SELECTOR DE CATEGORÍAS ─── */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:14px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
    .cat-pick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px}
    .cat-pick{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:2px solid transparent;border-radius:12px;padding:6px 2px;color:var(--text2);font-size:11px;min-width:0}
    .cat-pick span:last-child{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cat-pick:hover{background:var(--surface2)}
    .cat-pick.sel{border-color:var(--accent);background:rgba(240,185,11,.08);color:var(--text)}
    .cat-pick-grid.small{max-height:250px;overflow:auto;padding:2px}
    .cat-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto}
    .cat-list-row{display:flex;align-items:center;gap:10px;font-size:13px}
    .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
    .emoji-btn{background:var(--surface2);border:2px solid transparent;border-radius:8px;padding:6px 0;color:var(--text);display:flex;align-items:center;justify-content:center}
    .emoji-btn.sel{border-color:var(--accent)}
    .color-grid{display:flex;flex-wrap:wrap;gap:8px}
    .color-btn{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
    .color-btn.sel{border-color:#fff}


    /* ─── TIPOGRAFÍA ESTILO APP ─── */
    .page-title{font-size:20px;font-weight:500;letter-spacing:0}
    .section-title{font-size:15px;font-weight:500;color:var(--text);text-transform:none;letter-spacing:0}
    .stat-label,.label,.wallet-tag,.invest-meta,.side-card .k{text-transform:none;letter-spacing:0;font-size:12px;color:var(--text2)}
    .badge{letter-spacing:0;font-size:11px;text-transform:none;border-radius:10px}
    .btn,.seg-btn,.tab-btn,.bottom-nav-btn,.wallet-pill,.empty,.ticker{letter-spacing:0}
    .seg-btn{font-size:13px;font-weight:500}
    .btn{font-weight:500;font-size:14px;border-radius:8px}
    .empty{font-size:13px}
    .brand,.mobile-brand{letter-spacing:0;font-weight:700}
    .month-nav{font-weight:500;letter-spacing:.3px}
    .hero-acc-val{font-weight:500;font-size:28px}
    /* ─── FORM DE MOVIMIENTO ─── */
    .amount-box{display:flex;align-items:center;gap:6px;background:var(--surface2);border:2px solid var(--red);border-radius:14px;padding:10px 16px}
    .amount-box.ingreso{border-color:var(--green)}
    .amount-cur{font-size:30px;font-weight:500;color:var(--red)}
    .amount-box.ingreso .amount-cur,.amount-box.ingreso .amount-input{color:var(--green)}
    .amount-input{flex:1;min-width:0;width:100%;background:none;border:none;outline:none;font-family:var(--sans);font-size:38px;font-weight:500;color:var(--red);padding:2px 0}
    .amount-input::placeholder{color:var(--text3)}
    .form-row{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}

// Estrategia: los datos viven dentro del propio archivo HTML en <script id="SAVED_DATA">.
// Al guardar: (1) localStorage para sesión inmediata.
//             (2) genera y descarga automáticamente el HTML actualizado con los datos embebidos.
// El usuario reemplaza el archivo descargado con el anterior → datos siempre adentro del HTML.

let _saveTimer = null;
let _pendingDownload = false;

function load(k, fb){
  // Primero leer desde el bloque embebido en este mismo HTML
  try {
    const el = document.getElementById('SAVED_DATA');
    if(el && el.textContent.trim()){
      const all = JSON.parse(el.textContent);
      if(all[k] !== undefined) return all[k];
    }
  } catch(e){}
  // Fallback: localStorage (misma sesión)
  try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch { return fb; }
}

function save(k, v){
  localStorage.setItem(k, JSON.stringify(v));
}

function buildUpdatedHTML(){
  const allData = {
    ct_txns:    state.txns,
    ct_wallets: state.wallets,
    ct_invest:  state.invest,
    ct_quotes:  state.quotes,
    ct_cats:    state.cats,
  };
  const dataJSON = JSON.stringify(allData);
  const html = document.documentElement.outerHTML;
  // Reemplazar el bloque SAVED_DATA con los datos actuales
  const updated = html.replace(
    /<script id="SAVED_DATA"[^>]*>[\s\S]*?<\/script>/,
    `<script id="SAVED_DATA" type="application/json">${dataJSON}<\/script>`
  );
  return '<!DOCTYPE html>\n' + updated;
}

function autoSaveHTML(){
  // Solo descargar si hay datos reales cargados
  if(!state.txns.length && !state.wallets.length) return;
  downloadHTML();
}

function downloadHTML(){
  const html = buildUpdatedHTML();
  const blob = new Blob([html], {type:'text/html'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'mid-vault.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('💾 mid-vault.html guardado — reemplazá el archivo anterior');
}

// Monto: solo números, acepta coma o punto decimal
function bindMontoInput(el){
  el.addEventListener('input',()=>{
    let v=el.value.replace(/[^0-9.,]/g,'').replace('.',',');
    const k=v.indexOf(','); if(k>=0) v=v.slice(0,k+1)+v.slice(k+1).replace(/[.,]/g,'').slice(0,2);
    el.value=v;
  });
}
function parseMonto(v){ return Number(String(v).replace(/\./g,'').replace(',','.'))||0; }

let _toastTimer=null;
function showToast(msg){
  const el=document.getElementById('toast');
  if(!el) return;
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

function fmt(n){ return `$${Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})}`; }
function fmtPct(n){ return `${Number(n||0).toFixed(2)}%`; }
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
// Excluir transacciones de billeteras cripto (BTC/USDT) de totales en ARS
function isCryptoTxn(t){
  if(!t.walletId) return false;
  const w = state.wallets.find(x=>x.id===t.walletId);
  return w && ['BTC','USDT'].includes(w.moneda);
}

function groupByCat(tipo){
  const m={};
  state.txns.filter(t=>t.tipo===tipo && !isCryptoTxn(t)).forEach(t=>m[t.categoria]=(m[t.categoria]||0)+Number(t.monto));
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function totals(){
  const totalActivos = state.wallets.reduce((a,w)=>a+Number(w.saldo||0),0);
  const txnsFiat = state.txns.filter(t=>!isCryptoTxn(t));
  const totalIng    = txnsFiat.filter(t=>t.tipo==='ingreso').reduce((a,t)=>a+Number(t.monto),0);
  const totalGasto  = txnsFiat.filter(t=>t.tipo==='gasto' ).reduce((a,t)=>a+Number(t.monto),0);
  const totalInvest = state.invest.reduce((a,i)=>a+Number(i.capital||0),0);
  return { totalActivos, totalIng, totalGasto, balance: totalIng-totalGasto, totalInvest };
}
function txnsByDateMap(){
  const m={};
  state.txns.filter(t=>!isCryptoTxn(t)).forEach(t=>{
    if(!m[t.fecha]) m[t.fecha]=0;
    m[t.fecha]+= t.tipo==='ingreso'?Number(t.monto):-Number(t.monto);
  });
  return m;
}

// ─── APPLY TXN TO WALLET ───
function applyTxnToWallet(txn, walletId, multiplier=1){
  const w = state.wallets.find(x=>x.id===walletId);
  if(!w) return;
  const delta = Number(txn.monto) * multiplier * (txn.tipo==='ingreso'?1:-1);
  w.saldo = Number(w.saldo||0) + delta;
  save('ct_wallets', state.wallets);
}

// ─── PROJECTED YIELD ───
// Compuesto mensual: ciclo iterativo explícito mes a mes
// Simple: capital × (TNA/100) × (meses/12)
function proyectar(capital, tna_pct, meses, compuesto){
  const cap = Number(capital) || 0;
  const tna = Number(tna_pct) || 0;
  const m   = Number(meses)   || 0;
  if(cap <= 0 || tna <= 0 || m <= 0) return cap;

  if(compuesto === true){
    // Ciclo explícito: cada mes suma los intereses al saldo
    let saldo = cap;
    const tasaMensual = tna / 100 / 12;
    for(let i = 0; i < m; i++){
      saldo = saldo + saldo * tasaMensual;
    }
    return saldo;
  } else {
    // Interés simple: lineal
    return cap + cap * (tna / 100) * (m / 12);
  }
}

// ─── PIE CARD ───
function pieCard(title, data, colors){
  if(!data.length) return '';  // No mostrar nada si no hay datos
  const total = data.reduce((a,[,v])=>a+v,0);
  const cx=56,cy=56,r=46;
  let slices;
  if(data.length===1){
    // Un solo elemento: círculo completo
    slices=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${colors[0]}"></circle>`;
  } else {
    let cum=-90;
    slices = data.map(([cat,val],i)=>{
      const pct=val/total, angle=pct*360;
      // Cap angle slightly below 360 to avoid degenerate arc
      const safeAngle=Math.min(angle,359.99);
      const s=(cum*Math.PI)/180; cum+=angle; const e=(cum*Math.PI)/180;
      const x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s),x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
      return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r},0,${safeAngle>180?1:0},1,${x2},${y2} Z" fill="${colors[i%colors.length]}"></path>`;
    }).join('');
  }
  const legend = data.slice(0,6).map(([cat,val],i)=>`
    <div class="legend-row">
      <div class="legend-left"><span class="sw" style="background:${colors[i%colors.length]}"></span><span class="truncate">${esc(cat)}</span></div>
      <span class="legend-pct">${Math.round(val/total*100)}%</span>
    </div>`).join('');
  return `
    <div class="card">
      <div class="section-title">${title}</div>
      <div class="pie-wrap">
        <svg width="112" height="112" viewBox="0 0 112 112">${slices}<circle cx="${cx}" cy="${cy}" r="20" fill="#161a1f"></circle></svg>
        <div class="legend">${legend}</div>
      </div>
    </div>`;
}

// ─── CATEGORÍAS ───
function getCat(nombre, tipo){
  const c = state.cats.find(x=>x.nombre===nombre && x.tipo===tipo) || state.cats.find(x=>x.nombre===nombre);
  if(c) return c;
  let h=0; for(const ch of String(nombre)) h=(h*31+ch.charCodeAt(0))>>>0;
  return {nombre, tipo, icon: LEGACY_ICONS[nombre]||'tag', color: CAT_COLORS[h%CAT_COLORS.length]};
}
function catsOf(tipo){ return state.cats.filter(c=>c.tipo===tipo); }
function catIcon(cat, size=44){
  return `<span class="cat-ico" style="width:${size}px;height:${size}px;background:${cat.color}">${svgIcon(cat.icon, Math.round(size*.5))}</span>`;
}

// Valor de un movimiento en ARS (null si no hay cotización para cripto)
function txnARS(t){
  const w = state.wallets.find(x=>x.id===t.walletId);
  if(!w || w.moneda==='ARS') return Number(t.monto);
  const v = walletValueARS({...w, saldo:t.monto});
  if(v!==null) return v;
  return ['BTC','USDT'].includes(w.moneda) ? null : Number(t.monto);
}
function filteredTxns(){
  return state.walletFilter==='all' ? state.txns : state.txns.filter(t=>t.walletId===state.walletFilter);
}

function openModal(html){
  const modal=document.createElement('div');
  modal.className='modal-bg';
  modal.innerHTML=`<div class="modal">${html}</div>`;
  document.body.appendChild(modal);
  modal.onclick=e=>{ if(e.target===modal) modal.remove(); };
  return modal;
}

// ─── ALTA RÁPIDA DE MOVIMIENTO ───
function addTxn(txn){
  state.txns.unshift(txn);
  save('ct_txns',state.txns);
  applyTxnToWallet(txn, txn.walletId);
  const w=state.wallets.find(x=>x.id===txn.walletId);
  if(w) showToast(`${w.nombre}: ${fmt(w.saldo)}`);
  render();
}

      <div><label class="label">Color</label><div class="color-grid" id="cmColors"></div></div>
    </div>

      <button id="cmSave" class="btn btn-accent" style="flex:1">AGREGAR</button>
      <button id="cmClose" class="btn btn-ghost">CERRAR</button>
    </div>`);
  const draw=()=>{
    modal.querySelector('#cmPreview').innerHTML=catIcon({icon,color},40);
    modal.querySelector('#cmEmojis').innerHTML=CAT_ICON_KEYS.map(e=>`<button class="emoji-btn ${e===icon?'sel':''}" data-e="${e}">${svgIcon(e,20)}</button>`).join('');
    modal.querySelector('#cmColors').innerHTML=CAT_COLORS.map(c=>`<button class="color-btn ${c===color?'sel':''}" data-c="${c}" style="background:${c}"></button>`).join('');
    modal.querySelector('#cmList').innerHTML=catsOf(tipo).map(c=>`
      <div class="cat-list-row">${catIcon(c,30)}<span style="flex:1">${esc(c.nombre)}</span><button class="btn-danger" data-delcat="${esc(c.nombre)}">✕</button></div>`).join('') || `<div class="empty">SIN CATEGORÍAS</div>`;
    modal.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{icon=b.dataset.e;draw();});
    modal.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;draw();});
    modal.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=()=>{
      if(!confirm(`¿Eliminar la categoría "${b.dataset.delcat}"? Los movimientos existentes se conservan.`)) return;
      state.cats=state.cats.filter(c=>!(c.tipo===tipo && c.nombre===b.dataset.delcat));
      save('ct_cats',state.cats); draw();
    });
  };
  draw();
  const close=()=>{ modal.remove(); (onDone||render)(); };
  modal.querySelector('#cmClose').onclick=close;
  modal.onclick=e=>{ if(e.target===modal) close(); };
  modal.querySelector('#cmSave').onclick=()=>{
    const nombre=modal.querySelector('#cmNombre').value.trim();
    if(!nombre) return;
    if(state.cats.some(c=>c.tipo===tipo && c.nombre.toLowerCase()===nombre.toLowerCase())){ showToast('Esa categoría ya existe'); return; }
    state.cats.push({nombre,tipo,icon,color});
    save('ct_cats',state.cats);
    modal.querySelector('#cmNombre').value='';
    showToast(`Categoría "${nombre}" agregada`);
    draw();
  };
}

// ─── DONUT ───
function donutSVG(data, total, size=168){
  const r=size/2-12, c=2*Math.PI*r, cx=size/2;
  let off=0;
  const segs = total>0 ? data.map(d=>{
    const len=d.val/total*c;
    const gap=data.length>1?Math.min(3,len*.3):0;
    const s=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${d.color}" stroke-width="16" stroke-dasharray="${Math.max(len-gap,0.01)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cx})"></circle>`;
    off+=len; return s;
  }).join('') : '';
  return `<svg width="100%" viewBox="0 0 ${size} ${size}" style="max-width:${size}px"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="16"></circle>${segs}</svg>`;
}

function fmtShort(n){
  const v=Math.abs(Number(n||0));
  const s=v>=1e6?(v/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+'M':v>=1e4?(v/1e3).toLocaleString('es-AR',{maximumFractionDigits:1})+'k':v.toLocaleString('es-AR',{maximumFractionDigits:0});
  return (n<0?'-$':'$')+s;
}

// Fila de movimiento con ícono de categoría
function txnRow(t, withDelete=false){
  const w=state.wallets.find(x=>x.id===t.walletId);
  const cat=getCat(t.categoria,t.tipo);
  const isCrypto=w&&['BTC','USDT'].includes(w.moneda);
  const arsVal=isCrypto?walletValueARS({...w,saldo:t.monto}):null;
  const signo=t.tipo==='ingreso'?'+':'-';
  const montoDisplay=isCrypto
    ?`${signo}${Number(t.monto).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:8})} ${w.moneda}`
    :`${signo}${fmt(t.monto)}`;
  return `
    <div class="row-hover">
      <div style="display:flex;align-items:center;gap:12px;min-width:0">
        ${catIcon(cat,36)}
        <div style="min-width:0">
          <div style="font-size:13px;font-weight:500">${esc(t.categoria)}</div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:2px">${esc(t.fecha)}${t.descripcion?' · '+esc(t.descripcion):''}${w?' · '+esc(w.nombre):''}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="text-align:right">
          <span class="${t.tipo==='ingreso'?'amount-positive':'amount-negative'}" style="white-space:nowrap">${montoDisplay}</span>
          ${isCrypto&&arsVal!==null?`<div style="font-family:var(--mono);font-size:10px;color:var(--text3)">≈ ${signo}${fmt(arsVal)}</div>`:''}
        </div>
        ${withDelete?`<button class="btn-danger" data-del-txn="${t.id}">✕</button>`:''}
      </div>
    </div>`;
}
// ─── RENDER MOVIMIENTOS ───
function renderMovimientos(){
  const root=document.getElementById('tab-movimientos');
  if(!state.wallets.some(w=>w.id===state.formWallet)) state.formWallet=state.wallets[0]?.id||null;
  const formCats=catsOf(state.formTipo);
  if(!formCats.some(c=>c.nombre===state.formCat)) state.formCat=formCats[0]?.nombre||'Otros';
  const catPicker=formCats.map(c=>`<button class="cat-pick ${state.formCat===c.nombre?'sel':''}" data-fcat="${esc(c.nombre)}">${catIcon(c,38)}<span>${esc(c.nombre)}</span></button>`).join('')
    + `<button class="cat-pick" id="fcatNew"><span class="cat-ico cat-ico-add" style="width:38px;height:38px">${svgIcon('plus',18)}</span><span>Nueva</span></button>`;
  const walletPills = state.wallets.map(w=>`
    <button class="wallet-pill ${state.formWallet===w.id?'selected':''}" data-wpill="${w.id}">${esc(w.nombre)} <span style="color:var(--text3)">(${fmt(w.saldo)})</span></button>
  `).join('');

  root.innerHTML=`
    <div class="page-title">MOVIMIENTOS</div>
    <div class="content-grid">
      <div class="card">
        <div class="seg">
          <button id="tipo-gasto" class="seg-btn ${state.formTipo==='gasto'?'active seg-red':''}">Gasto</button>
          <button id="tipo-ingreso" class="seg-btn ${state.formTipo==='ingreso'?'active seg-green':''}">Ingreso</button>
        </div>
        <div class="form-stack">
          <div class="amount-box ${state.formTipo}">
            <span class="amount-cur">$</span>
            <input id="txnMonto" class="amount-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
          </div>
          <div class="cat-pick-grid small">${catPicker}</div>
          <div class="wallet-pills" id="walletPillsContainer">${walletPills}</div>
          <div class="form-row">
            <input id="txnFecha" class="field" type="date" value="${todayStr()}">
            <input id="txnDesc" class="field" type="text" placeholder="Descripción">
          </div>
          <button id="addTxn" class="btn btn-big ${state.formTipo==='ingreso'?'btn-green':'btn-red'}">Registrar</button>
        </div>
      </div>
      <div class="card">
        <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
          <span>HISTORIAL</span>
          <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">${state.txns.length} REGISTROS</span>
        </div>
        <div style="max-height:520px;overflow:auto">
          ${state.txns.length ? state.txns.map(t=>txnRow(t,true)).join('') : `<div class="empty">SIN MOVIMIENTOS</div>`}
        </div>
      </div>
    </div>
  `;

  bindMontoInput(document.getElementById('txnMonto'));
  document.getElementById('tipo-gasto').onclick=()=>{state.formTipo='gasto';renderMovimientos();};
  document.getElementById('tipo-ingreso').onclick=()=>{state.formTipo='ingreso';renderMovimientos();};

  root.querySelectorAll('[data-fcat]').forEach(btn=>btn.onclick=()=>{state.formCat=btn.dataset.fcat;renderMovimientos();});
  document.getElementById('fcatNew').onclick=()=>openCatModal(state.formTipo);

  root.querySelectorAll('[data-wpill]').forEach(btn=>btn.onclick=()=>{
    const id=Number(btn.dataset.wpill);
    state.formWallet = id; // siempre selecciona, nunca deselecciona
    renderMovimientos();
  });

  document.getElementById('addTxn').onclick=()=>{
    const categoria=state.formCat;
    const monto=parseMonto(document.getElementById('txnMonto').value);
    const fecha=document.getElementById('txnFecha').value||todayStr();
    const descripcion=document.getElementById('txnDesc').value.trim();
    if(!monto||monto<=0) return;
    if(!state.formWallet){ renderMovimientos(); return; } // billetera obligatoria
    addTxn({id:Date.now(),tipo:state.formTipo,categoria,monto,descripcion,fecha,walletId:state.formWallet});
  };

  root.querySelectorAll('[data-del-txn]').forEach(btn=>btn.onclick=()=>{
    const txn=state.txns.find(t=>String(t.id)===btn.dataset.delTxn);
    if(txn&&txn.walletId) applyTxnToWallet(txn, txn.walletId, -1); // revert
    state.txns=state.txns.filter(t=>String(t.id)!==btn.dataset.delTxn);
    save('ct_txns',state.txns);
    render();
  });
}

// ─── RENDER ACTIVOS ───
function renderActivos(){
  const root=document.getElementById('tab-activos');
  const {usd,usdt,btc,lastFetch}=state.quotes;

  // BTC/USDT parity derived from: (BTC en ARS) / (USDT en ARS)
  // Si btcARS = btc * usd  y  usdtARS = usdt * usd
  // entonces btcUsdt = btcARS / usdtARS = btc / usdt
  const btcUsdt = (btc && usdt && usdt > 0) ? btc / usdt : null;

  // Por cada wallet calcular su valor en ARS, USD y USDT
  function walletUSD(w){
    const s=Number(w.saldo||0);
    if(w.moneda==='ARS') return usd ? s/usd : null;
    if(w.moneda==='USD') return s;
    if(w.moneda==='USDT') return usdt ? s*usdt : s; // USDT ≈ USD
    if(w.moneda==='BTC') return btc ? s*btc : null;
    return null;
  }
  function walletUSDT(w){
    const usdVal=walletUSD(w);
    if(usdVal===null) return null;
    return usdt ? usdVal/usdt : usdVal; // USDT ≈ 1 USD si usdt=1
  }
  function isCrypto(w){ return ['BTC','USDT','ETH'].includes(w.moneda) || w.tipo==='cripto'; }

  // Totales
  const totalARS = state.wallets.reduce((a,w)=>{
    const v=walletValueARS(w); return a+(v!==null?v:Number(w.saldo||0));
  },0);
  const totalUSD = usd ? state.wallets.reduce((a,w)=>{
    const v=walletUSD(w); return a+(v!==null?v:0);
  },0) : null;
  const totalUSDT = usdt ? state.wallets.reduce((a,w)=>{
    const v=walletUSDT(w); return a+(v!==null?v:0);
  },0) : null;

  // Separar en ARS, USD y cripto (en USDT)
  const arsWallets  = state.wallets.filter(w=>w.moneda==='ARS' && !isCrypto(w));
  const usdWallets  = state.wallets.filter(w=>['USD','EUR'].includes(w.moneda));
  const cryptoWallets = state.wallets.filter(w=>isCrypto(w));

  const subTotalARS  = arsWallets.reduce((a,w)=>a+Number(w.saldo||0),0);
  const subTotalUSD  = usdWallets.reduce((a,w)=>{ const v=walletUSD(w); return a+(v||0); },0);
  const subTotalCryptoUSDT = cryptoWallets.reduce((a,w)=>{ const v=walletUSDT(w); return a+(v||0); },0);

  const fmtUSD = n => '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const timeStr=lastFetch?new Date(lastFetch).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'';
  const hasCotiz = !!(usd);

  root.innerHTML=`
    <div class="page-title">ACTIVOS</div>

    <!-- Card principal total -->
    <div class="card" style="margin-bottom:16px">
      <div>
        <div class="stat-label" style="margin-bottom:6px">PATRIMONIO TOTAL</div>
        <div class="stat-val yellow" style="font-size:30px">${fmt(totalARS)}</div>
        ${totalUSD!==null?`<div style="font-family:var(--mono);font-size:12px;color:var(--text3);margin-top:4px">≈ ${fmtUSD(totalUSD)} USD</div>`:'<div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:4px">cargá cotizaciones para ver en USD</div>'}
      </div>
      <!-- Desglose horizontal -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
        <div style="padding-right:16px;border-right:1px solid var(--border)">
          <div style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.8px;margin-bottom:5px">EN ARS</div>
          <div style="font-family:var(--mono);font-size:15px;font-weight:500;color:var(--text)">${fmt(subTotalARS)}</div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:3px">pesos argentinos</div>
        </div>
        <div style="padding:0 16px;border-right:1px solid var(--border)">
          <div style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.8px;margin-bottom:5px">EN USD</div>
          <div style="font-family:var(--mono);font-size:15px;font-weight:500;color:var(--blue)">${hasCotiz&&subTotalUSD>0?fmtUSD(subTotalUSD):'—'}</div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:3px">${hasCotiz&&subTotalUSD>0?fmt(subTotalUSD*usd)+' ARS':'sin cotización'}</div>

                  <div style="font-family:var(--mono);font-size:10px;color:var(--text3)">
                    REND. DIARIO: <span style="color:var(--green)">+${fmt(Number(w.saldo||0) * (Number(w.rendAnual)/100) / 365)}</span>
                    <span style="margin-left:8px">MENSUAL: <span style="color:var(--green)">+${fmt(Number(w.saldo||0) * (Number(w.rendAnual)/100) / 12)}</span></span>

                </div>` : ''}
              ${totalARS>0?`
                <div style="margin:-2px 0 4px 0;padding:0 2px">
                  <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:3px">
                    <span>${esc(w.nombre)}</span><span style="color:${color}">${pct.toFixed(1)}%</span>
                  </div>
                  <div class="bar"><div style="width:${pct}%;background:${color}"></div></div>
                </div>`:''}`
          }).join('') : `<div class="empty">SIN BILLETERAS</div>`}

      </div>
      <div>
        <div class="card">
          <div class="section-title">AGREGAR BILLETERA</div>
          <div class="form-stack">
            <div><label class="label">Nombre</label><input id="walletNombre" class="field" type="text" placeholder="Ej: Brubank"></div>
            <div><label class="label">Tipo</label>
              <select id="walletTipo" class="field">
                <option>virtual</option><option>físico</option><option>inversión</option><option>cripto</option>
              </select>
            </div>
            <div><label class="label">Saldo inicial</label><input id="walletSaldo" class="field" type="number" inputmode="decimal" placeholder="0.00"></div>
            <div><label class="label">Moneda</label>
              <select id="walletMoneda" class="field">
                <option>ARS</option><option>USD</option><option>EUR</option><option>USDT</option><option>BTC</option>
              </select>
            </div>
            <div>
              <label class="label">Color (billeteras virtuales)</label>
              <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
                <input id="walletColor" type="color" value="#f0b90b" style="width:36px;height:32px;border:1px solid var(--border);border-radius:4px;background:transparent;cursor:pointer;padding:2px">
                <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">Seleccioná el color del ícono</span>
              </div>
            </div>
            <div>
              <label class="label">Rendimiento anual % <span style="color:var(--text3)">(opcional — se aplica diario)</span></label>
              <input id="walletRend" class="field" type="number" inputmode="decimal" placeholder="Ej: 60 para 60% TNA" step="0.01" min="0">
            </div>
            <button id="addWallet" class="btn btn-accent" style="width:100%">AGREGAR BILLETERA</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Cotizaciones del día -->
    <div class="card" style="margin-top:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="section-title" style="margin:0">COTIZACIONES</div>
        <div style="display:flex;align-items:center;gap:10px">
          ${state.quotes.lastFetch?`<span style="font-family:var(--mono);font-size:9px;color:var(--text3)">act. ${new Date(state.quotes.lastFetch).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}</span>`:''}
          <button id="toggleQuoteForm" class="btn btn-ghost" style="padding:4px 10px;font-size:11px">+ CARGAR</button>
        </div>
      </div>

      <!-- Formulario de carga con toggle USD/ARS por paridad -->
      <div id="quoteFormWrap" style="display:none;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:14px">

        <!-- USD blue: siempre en ARS -->
        <div style="margin-bottom:12px">
          <div style="font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.5px;margin-bottom:6px">USD BLUE</div>
          <div style="display:flex;align-items:center;gap:8px">
            <input id="qiUsd" class="field" type="number" inputmode="decimal" placeholder="${state.quotes.usd||'Ej: 1400'}" step="1" style="flex:1">
            <span style="font-family:var(--mono);font-size:11px;color:var(--text2);white-space:nowrap">ARS por USD</span>
          </div>
        </div>

        <!-- USDT: toggle USD o ARS -->
        <div style="margin-bottom:12px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <span style="font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.5px">USDT</span>
            <div style="display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px;gap:2px">
              <button id="usdt-unit-usd" class="seg-btn active" style="padding:2px 8px;font-size:10px;border-radius:3px">USD</button>
              <button id="usdt-unit-ars" class="seg-btn" style="padding:2px 8px;font-size:10px;border-radius:3px">ARS</button>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <input id="qiUsdt" class="field" type="number" inputmode="decimal" placeholder="${state.quotes.usdt||'Ej: 0.9998'}" step="0.0001" style="flex:1">
            <span id="usdt-unit-label" style="font-family:var(--mono);font-size:11px;color:var(--text2);white-space:nowrap">USD por USDT</span>
          </div>
        </div>

        <!-- BTC: toggle USD o ARS -->
        <div style="margin-bottom:14px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <span style="font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.5px">BTC</span>
            <div style="display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px;gap:2px">
              <button id="btc-unit-usd" class="seg-btn active" style="padding:2px 8px;font-size:10px;border-radius:3px">USD</button>
              <button id="btc-unit-ars" class="seg-btn" style="padding:2px 8px;font-size:10px;border-radius:3px">ARS</button>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <input id="qiBtc" class="field" type="number" inputmode="decimal" placeholder="${state.quotes.btc||'Ej: 83000'}" step="1" style="flex:1">
            <span id="btc-unit-label" style="font-family:var(--mono);font-size:11px;color:var(--text2);white-space:nowrap">USD por BTC</span>
          </div>
        </div>

        <button id="qiSave" class="btn btn-accent" style="width:100%">GUARDAR</button>
      </div>

      <!-- Listado -->
      <div style="display:grid;grid-template-columns:2fr 2fr 2fr 2fr;font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.5px;padding:0 8px 8px;border-bottom:1px solid var(--border)">
        <span>PAR</span><span style="text-align:right">PRECIO (ARS)</span><span style="text-align:right">PRECIO (USD)</span><span style="text-align:right">ESTADO</span>
      </div>
      ${[
        {par:'USD / ARS', arsVal:state.quotes.usd, usdVal:1, ok:!!state.quotes.usd},
        {par:'USDT / ARS', arsVal:state.quotes.usdt&&state.quotes.usd?state.quotes.usdt*state.quotes.usd:null, usdVal:state.quotes.usdt, ok:!!(state.quotes.usdt&&state.quotes.usd)},
        {par:'BTC / ARS',  arsVal:state.quotes.btc&&state.quotes.usd?state.quotes.btc*state.quotes.usd:null,  usdVal:state.quotes.btc,  ok:!!(state.quotes.btc&&state.quotes.usd)},
      ].map(r=>`
        <div style="display:grid;grid-template-columns:2fr 2fr 2fr 2fr;font-family:var(--mono);font-size:12px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--border)">
          <span style="font-weight:500;color:var(--text)">${r.par}</span>
          <span style="text-align:right;color:${r.ok?'var(--text)':'var(--text3)'}">
            ${r.arsVal?'$'+Number(r.arsVal).toLocaleString('es-AR',{maximumFractionDigits:r.arsVal<10?4:0}):'—'}
          </span>
          <span style="text-align:right;color:var(--text2)">
            ${r.usdVal?'$'+Number(r.usdVal).toLocaleString('en-US',{maximumFractionDigits:r.usdVal<10?4:0}):'—'}
          </span>
          <span style="text-align:right">
            <span class="badge ${r.ok?'badge-green':'badge-gray'}">${r.ok?'OK':'SIN DATOS'}</span>
          </span>
        </div>`).join('')}
    </div>
  `;
  document.getElementById('toggleQuoteForm').onclick=()=>{
    const wrap=document.getElementById('quoteFormWrap');
    const btn=document.getElementById('toggleQuoteForm');
    const open=wrap.style.display==='none';
    wrap.style.display=open?'block':'none';
    btn.textContent=open?'✕ CERRAR':'+ CARGAR';
  };

  // Toggle USDT unidad
  let usdtInARS = false;
  document.getElementById('usdt-unit-usd').onclick=()=>{
    usdtInARS=false;
    document.getElementById('usdt-unit-usd').classList.add('active');
    document.getElementById('usdt-unit-ars').classList.remove('active');
    document.getElementById('usdt-unit-label').textContent='USD por USDT';
    document.getElementById('qiUsdt').placeholder=state.quotes.usdt||'Ej: 0.9998';
    document.getElementById('qiUsdt').step='0.0001';
  };
  document.getElementById('usdt-unit-ars').onclick=()=>{
    usdtInARS=true;
    document.getElementById('usdt-unit-ars').classList.add('active');
    document.getElementById('usdt-unit-usd').classList.remove('active');
    document.getElementById('usdt-unit-label').textContent='ARS por USDT';
    const arsVal = state.quotes.usdt&&state.quotes.usd?Math.round(state.quotes.usdt*state.quotes.usd):'';
    document.getElementById('qiUsdt').placeholder=arsVal||'Ej: 1398';
    document.getElementById('qiUsdt').step='1';
  };

  // Toggle BTC unidad
  let btcInARS = false;
  document.getElementById('btc-unit-usd').onclick=()=>{
    btcInARS=false;
    document.getElementById('btc-unit-usd').classList.add('active');
    document.getElementById('btc-unit-ars').classList.remove('active');
    document.getElementById('btc-unit-label').textContent='USD por BTC';
    document.getElementById('qiBtc').placeholder=state.quotes.btc||'Ej: 83000';
    document.getElementById('qiBtc').step='1';
  };
  document.getElementById('btc-unit-ars').onclick=()=>{
    btcInARS=true;
    document.getElementById('btc-unit-ars').classList.add('active');
    document.getElementById('btc-unit-usd').classList.remove('active');
    document.getElementById('btc-unit-label').textContent='ARS por BTC';
    const arsVal = state.quotes.btc&&state.quotes.usd?Math.round(state.quotes.btc*state.quotes.usd):'';
    document.getElementById('qiBtc').placeholder=arsVal||'Ej: 116000000';
    document.getElementById('qiBtc').step='1000';
  };

  document.getElementById('qiSave').onclick=()=>{
    const u  = Number(document.getElementById('qiUsd').value);
    const ut = Number(document.getElementById('qiUsdt').value);
    const b  = Number(document.getElementById('qiBtc').value);
    if(u>0) state.quotes.usd = u;
    if(ut>0){
      if(usdtInARS && u>0) state.quotes.usdt = ut/u;       // ARS→USD
      else if(usdtInARS && state.quotes.usd) state.quotes.usdt = ut/state.quotes.usd;
      else state.quotes.usdt = ut;                           // ya en USD
    }
    if(b>0){
      if(btcInARS && u>0) state.quotes.btc = b/u;           // ARS→USD
      else if(btcInARS && state.quotes.usd) state.quotes.btc = b/state.quotes.usd;
      else state.quotes.btc = b;                             // ya en USD
    }
    state.quotes.lastFetch = Date.now();
    save('ct_quotes', state.quotes);
    renderActivos();
    updateSidebar();
    showToast('Cotizaciones guardadas');
  };
  document.getElementById('addWallet').onclick=()=>{
    const nombre=document.getElementById('walletNombre').value.trim();
    const tipo=document.getElementById('walletTipo').value;
    const saldo=Number(document.getElementById('walletSaldo').value||0);
    const moneda=document.getElementById('walletMoneda').value;
    const color=document.getElementById('walletColor').value||'#f0b90b';
    const rendAnual=Number(document.getElementById('walletRend').value||0);
    if(!nombre) return;
    state.wallets.push({id:Date.now(),nombre,tipo,saldo,moneda,color,rendAnual:rendAnual||null});
    save('ct_wallets',state.wallets);
    render();
  };
  root.querySelectorAll('[data-edit-wallet]').forEach(btn=>btn.onclick=()=>{
    const id=Number(btn.dataset.editWallet);
    const w=state.wallets.find(x=>x.id===id);
    if(!w) return;
    const modal=document.createElement('div');
    modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px';
    modal.innerHTML=`
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px;min-width:300px;max-width:400px;width:100%">
        <div style="font-family:var(--mono);font-size:13px;font-weight:500;margin-bottom:16px;color:var(--text)">EDITAR — ${esc(w.nombre)}</div>
        <div class="form-stack">
          <div><label class="label">Saldo actual</label><input id="editSaldo" class="field" type="number" inputmode="decimal" value="${w.saldo}" step="0.01"></div>
          <div>
            <label class="label">Color</label>
            <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
              <input id="editColor" type="color" value="${w.color||'#f0b90b'}" style="width:36px;height:32px;border:1px solid var(--border);border-radius:4px;background:transparent;cursor:pointer;padding:2px">
            </div>
          </div>
          <div><label class="label">Rendimiento anual % TNA</label><input id="editRend" class="field" type="number" inputmode="decimal" value="${w.rendAnual||''}" placeholder="0 = sin rendimiento" step="0.01"></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button id="editSave" class="btn btn-accent" style="flex:1">GUARDAR</button>
          <button id="editCancel" class="btn btn-ghost">CANCELAR</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    modal.querySelector('#editCancel').onclick=()=>modal.remove();
    modal.querySelector('#editSave').onclick=()=>{
      w.saldo=Number(modal.querySelector('#editSaldo').value||w.saldo);
      w.color=modal.querySelector('#editColor').value;
      const rend=Number(modal.querySelector('#editRend').value);
      w.rendAnual=rend>0?rend:null;
      save('ct_wallets',state.wallets);
      modal.remove();
      render();
      showToast(`${w.nombre} actualizado`);
    };
    modal.onclick=e=>{if(e.target===modal) modal.remove();};
  });
  root.querySelectorAll('[data-del-wallet]').forEach(btn=>btn.onclick=()=>{
    state.wallets=state.wallets.filter(w=>String(w.id)!==btn.dataset.delWallet);
    save('ct_wallets',state.wallets);
    render();
  });
}

// ─── RENDER INVERSIONES ───

  const rend1y=state.invest.reduce((a,i)=>{
    const r=proyectar(Number(i.capital||0),Number(i.tna),12)-Number(i.capital||0);
    return a+r;
  },0);

  root.innerHTML=`
    <div class="page-title">INVERSIONES</div>
    <div class="cards-3">
      <div class="card"><div class="stat-label">CAPITAL INVERTIDO</div><div class="stat-val yellow">${fmt(totalCap)}</div></div>
      <div class="card"><div class="stat-label">RENDIMIENTO 12M PROY.</div><div class="stat-val green">+${fmt(rend1y)}</div></div>
      <div class="card"><div class="stat-label">TASA PROMEDIO TNA</div><div class="stat-val">${totalCap>0?fmtPct(state.invest.reduce((a,i)=>a+Number(i.tna||0)*Number(i.capital||0),0)/totalCap):'0.00%'}</div></div>

              <select id="invTipo" class="field">
                <option value="plazo_fijo">Plazo Fijo</option>
                <option value="fci">FCI</option>
                <option value="accion">Acción / Bono</option>
                <option value="cripto">Cripto</option>
                <option value="cedear">CEDEAR</option>
                <option value="otro">Otro</option>

            </div>

              <label class="label">TNA % <span style="color:var(--text3)">(tasa nominal anual)</span></label>
              <input id="invTna" class="field" type="number" inputmode="decimal" placeholder="Ej: 75" step="0.01">
            </div>
            <div><label class="label">Capital inicial</label><input id="invCapital" class="field" type="number" inputmode="decimal" placeholder="0.00"></div>
            <div>
              <label class="label">Tipo de interés</label>
              <div class="seg" style="margin-bottom:0">
                <button id="inv-compuesto" class="seg-btn active">COMPUESTO</button>
                <button id="inv-simple" class="seg-btn">SIMPLE</button>
              </div>
            </div>
            <div><label class="label">Moneda</label>
              <select id="invMoneda" class="field">
                <option>ARS</option><option>USD</option><option>USDT</option><option>EUR</option>
              </select>
            </div>
            <button id="addInvest" class="btn btn-accent" style="width:100%">AGREGAR INVERSIÓN</button>
          </div>
        </div>
      </div>
      <div>
        <div class="card" style="margin-bottom:12px">
          <div class="section-title">PORTFOLIO</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            ${state.invest.length ? state.invest.map((inv,i)=>{
              const color=PALETTE[i%PALETTE.length];
              const cap=Number(inv.capital||0);
              const tna=Number(inv.tna||0);
              const cmp = inv.compuesto === true; // solo true si se guardó explícitamente como true
              const r3  = proyectar(cap, tna, 3,  cmp) - cap;
              const r6  = proyectar(cap, tna, 6,  cmp) - cap;
              const r12 = proyectar(cap, tna, 12, cmp) - cap;
              const r12s = proyectar(cap, tna, 12, false) - cap; // siempre simple para comparar
              const tipos={'plazo_fijo':'PF','fci':'FCI','accion':'ACC','cripto':'CRIPTO','cedear':'CEDEAR','otro':'OTRO'};
              return `
                <div class="invest-card">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">

                        <div class="invest-name">${esc(inv.nombre)}</div>

                  </div>
                  <div style="background:var(--bg);border-radius:6px;padding:10px;border:1px solid var(--border)">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                      <div class="invest-meta">RENDIMIENTO PROYECTADO</div>
                      <div class="invest-meta" style="color:${cmp?'var(--accent)':'var(--blue)'}">INT. ${cmp?'COMPUESTO':'SIMPLE'}</div>
                    </div>
                    <div class="projected-row"><span style="color:var(--text2)">3 meses</span><div style="text-align:right"><div class="amount-positive">+${fmt(r3)}</div><div style="font-family:var(--mono);font-size:10px;color:var(--text3)">total ${fmt(cap+r3)}</div></div></div>
                    <div class="projected-row"><span style="color:var(--text2)">6 meses</span><div style="text-align:right"><div class="amount-positive">+${fmt(r6)}</div><div style="font-family:var(--mono);font-size:10px;color:var(--text3)">total ${fmt(cap+r6)}</div></div></div>
                    <div class="projected-row">
                      <span style="color:var(--text2)">12 meses</span>
                      <div style="text-align:right">
                        <div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">
                          <span class="amount-positive">+${fmt(r12)}</span>
                          <span style="font-family:var(--mono);font-size:10px;color:var(--accent)">${fmtPct((r12/Math.max(cap,1))*100)}</span>
                        </div>
                        <div style="font-family:var(--mono);font-size:10px;color:var(--text3)">total ${fmt(cap+r12)}</div>
                      </div>
                    </div>
                    ${cap > 0 ? `
                    <div class="projected-row" style="border-top:1px dashed var(--border);margin-top:4px;padding-top:8px">
                      <span style="color:var(--text3);font-size:10px">vs. interés simple 12m</span>
                      <span style="font-family:var(--mono);font-size:11px;color:var(--text2)">+${fmt(r12s)} <span style="color:${r12>r12s?'var(--green)':'var(--text3)'};font-size:10px">(${r12>r12s?'+':'-'}${fmt(Math.abs(r12-r12s))} ${r12>r12s?'extra':'menos'})</span></span>
                    </div>` : ''}
                  </div>
                  <div style="margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap">
                    <div style="display:flex;align-items:center;gap:6px">
                      <label class="label" style="display:inline;margin:0">Ajustar capital:</label>
                      <input class="field" style="width:110px" type="number" inputmode="decimal" placeholder="Nuevo capital" data-inv-cap="${inv.id}">
                    </div>
                    <button class="btn-danger" data-del-inv="${inv.id}">ELIMINAR</button>
                  </div>
                </div>`
            }).join('') : `<div class="empty">SIN INVERSIONES REGISTRADAS</div>`}
          </div>
        </div>

        <!-- Simulador rápido -->
        <div class="card">
          <div class="section-title">SIMULADOR</div>
          <div class="form-stack">
            <div><label class="label">Capital a simular</label><input id="simCap" class="field" type="number" inputmode="decimal" placeholder="100000"></div>
            <div><label class="label">TNA %</label><input id="simTna" class="field" type="number" inputmode="decimal" placeholder="75"></div>
            <div>
              <label class="label">Tipo de interés</label>
              <div class="seg" style="margin-bottom:0">
                <button id="sim-compuesto" class="seg-btn active">COMPUESTO</button>
                <button id="sim-simple" class="seg-btn">SIMPLE</button>
              </div>
            </div>
            <button id="simBtn" class="btn btn-ghost" style="width:100%">CALCULAR</button>
          </div>
          <div id="simResult" style="margin-top:12px"></div>
        </div>
      </div>
    </div>
  `;

  // Toggle interés compuesto / simple
  let invCompuesto = true;
  document.getElementById('inv-compuesto').onclick=()=>{ invCompuesto=true; document.getElementById('inv-compuesto').classList.add('active'); document.getElementById('inv-simple').classList.remove('active'); };
  document.getElementById('inv-simple').onclick=()=>{ invCompuesto=false; document.getElementById('inv-simple').classList.add('active'); document.getElementById('inv-compuesto').classList.remove('active'); };

  document.getElementById('addInvest').onclick=()=>{
    const nombre=document.getElementById('invNombre').value.trim();
    const tipo=document.getElementById('invTipo').value;
    const tna=Number(document.getElementById('invTna').value);
    const capital=Number(document.getElementById('invCapital').value||0);
    const moneda=document.getElementById('invMoneda').value;
    if(!nombre||!tna) return;
    state.invest.push({id:Date.now(),nombre,tipo,tna,capital,moneda,compuesto:invCompuesto});
    save('ct_invest',state.invest);
    render();
  };

  root.querySelectorAll('[data-del-inv]').forEach(btn=>btn.onclick=()=>{
    state.invest=state.invest.filter(i=>String(i.id)!==btn.dataset.delInv);
    save('ct_invest',state.invest);
    render();
  });

  root.querySelectorAll('[data-inv-cap]').forEach(input=>input.onchange=()=>{
    const id=Number(input.dataset.invCap);
    const val=Number(input.value);
    if(isNaN(val)||val<0) return;
    const inv=state.invest.find(i=>i.id===id);
    if(inv){inv.capital=val;save('ct_invest',state.invest);renderInversiones();}
  });

  let simCompuesto = true;
  document.getElementById('sim-compuesto').onclick=()=>{ simCompuesto=true; document.getElementById('sim-compuesto').classList.add('active'); document.getElementById('sim-simple').classList.remove('active'); };
  document.getElementById('sim-simple').onclick=()=>{ simCompuesto=false; document.getElementById('sim-simple').classList.add('active'); document.getElementById('sim-compuesto').classList.remove('active'); };

  document.getElementById('simBtn').onclick=()=>{
    const cap=Number(document.getElementById('simCap').value);
    const tna=Number(document.getElementById('simTna').value);
    if(!cap||!tna){document.getElementById('simResult').innerHTML='';return;}
    const r3=proyectar(cap,tna,3,simCompuesto)-cap;
    const r6=proyectar(cap,tna,6,simCompuesto)-cap;
    const r12=proyectar(cap,tna,12,simCompuesto)-cap;
    const r24=proyectar(cap,tna,24,simCompuesto)-cap;
    const r12alt=proyectar(cap,tna,12,!simCompuesto)-cap;
    const fmtRow=(meses,gan)=>`
      <div class="projected-row">
        <span style="color:var(--text2)">${meses} meses</span>
        <div style="text-align:right">
          <div class="amount-positive">+${fmt(gan)}</div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--text3)">total ${fmt(cap+gan)}</div>
        </div>
      </div>`;
    document.getElementById('simResult').innerHTML=`
      <div style="background:var(--bg);border-radius:6px;border:1px solid var(--border);padding:10px">
        <div class="invest-meta" style="margin-bottom:8px">CAPITAL: ${fmt(cap)} · ${fmtPct(tna)} TNA · INT. ${simCompuesto?'COMPUESTO MENSUAL':'SIMPLE'}</div>
        ${fmtRow(3,r3)}${fmtRow(6,r6)}${fmtRow(12,r12)}${fmtRow(24,r24)}
        <div class="projected-row" style="border-top:1px dashed var(--border);margin-top:4px;padding-top:8px">
          <span style="color:var(--text3);font-size:10px">vs. ${simCompuesto?'simple':'compuesto'} a 12m</span>
          <span style="font-family:var(--mono);font-size:11px;color:var(--text2)">+${fmt(r12alt)} <span style="color:${simCompuesto?'var(--green)':'var(--red)'};font-size:10px">(${simCompuesto?'+':'−'}${fmt(Math.abs(r12-r12alt))})</span></span>
        </div>
      </div>
    `;
  };
}

// ─── APPLY DAILY YIELDS ───
function applyDailyYields(){
  const today = todayStr();
  let changed = false;
  state.wallets.forEach(w => {
    if(!w.rendAnual || Number(w.rendAnual) <= 0) return;
    if(w.lastYieldDate === today) return; // already done today
    // Count days since last applied
    const from = w.lastYieldDate ? new Date(w.lastYieldDate) : null;
    const toDate = new Date(today);
    if(!from || from >= toDate) { w.lastYieldDate = today; changed = true; return; }
    // Calculate days elapsed
    const msPerDay = 86400000;
    const days = Math.floor((toDate - from) / msPerDay);
    if(days <= 0) return;
    const dailyRate = Number(w.rendAnual) / 100 / 365;
    for(let d=0; d<days; d++){
      const dayDate = new Date(from.getTime() + (d+1)*msPerDay);
      const dateStr = dayDate.toISOString().split('T')[0];
      const rendMonto = Number(w.saldo||0) * dailyRate;
      if(rendMonto <= 0) continue;
      const txn = {
        id: Date.now() + d,
        tipo: 'ingreso',
        categoria: 'Rendimiento',
        monto: rendMonto,
        descripcion: `Rend. diario ${esc(w.nombre)} (${fmtPct(w.rendAnual)} TNA)`,
        fecha: dateStr,
        walletId: w.id,
        esRendimiento: true,
        walletNombre: w.nombre
      };
      state.txns.unshift(txn);
      w.saldo = Number(w.saldo||0) + rendMonto;
    }
    w.lastYieldDate = today;
    changed = true;
  });
  if(changed){
    save('ct_txns', state.txns);
    save('ct_wallets', state.wallets);
  }
}

// ─── MAIN RENDER ───
function render(){
  renderSidebarShell();
  renderMenu();
  updateSidebar();
  document.querySelectorAll('.tab-panel').forEach(el=>el.classList.add('hide'));
  document.getElementById('tab-'+state.tab).classList.remove('hide');
  renderResumen();
  renderMovimientos();
  renderActivos();
  renderInversiones();
}

document.getElementById('sidebarCollapse').onclick=()=>{state.sidebarOpen=!state.sidebarOpen;renderSidebarShell()};

// ─── EXPORT / IMPORT ───
document.getElementById('exportBtn').onclick = ()=>downloadHTML();

document.getElementById('importFile').onchange=(e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try {
      // Acepta backup .json o el mid-vault.html descargado (datos en SAVED_DATA)
      const txt = ev.target.result;
      const m = txt.match(/<script id="SAVED_DATA"[^>]*>([\s\S]*?)<\/script>/);
      const data = JSON.parse(m ? m[1] : txt);
      if(data.ct_txns)    { state.txns    = data.ct_txns;    localStorage.setItem('ct_txns',    JSON.stringify(state.txns)); }
      if(data.ct_wallets) { state.wallets = data.ct_wallets; localStorage.setItem('ct_wallets', JSON.stringify(state.wallets)); }
      if(data.ct_invest)  { state.invest  = data.ct_invest;  localStorage.setItem('ct_invest',  JSON.stringify(state.invest)); }
      if(data.ct_quotes)  { state.quotes  = data.ct_quotes;  localStorage.setItem('ct_quotes',  JSON.stringify(state.quotes)); }
      if(data.ct_cats)    { state.cats    = data.ct_cats;    localStorage.setItem('ct_cats',    JSON.stringify(state.cats)); }
      render();
      showToast('✓ Datos restaurados');
    } catch(err) {
      alert('Archivo inválido.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

const exportBtnMobile = document.getElementById('exportBtnMobile');
if(exportBtnMobile) exportBtnMobile.onclick = ()=>downloadHTML();
const importFileMobile = document.getElementById('importFileMobile');
if(importFileMobile) importFileMobile.onchange = (e)=>{
  document.getElementById('importFile').files = e.target.files;
  document.getElementById('importFile').dispatchEvent(new Event('change'));
};
applyDailyYields();
render();
</script>
