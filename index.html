// ─── APPLY DAILY YIELDS ───
function applyDailyYields(){
  const today = todayStr();
  let changed = false;
  state.wallets.forEach(w => {
    if(!w.rendAnual || Number(w.rendAnual) <= 0) return;
    if(w.lastYieldDate === today) return; // already done today
    // Count days since last applied
    const from = w.lastYieldDate ? new Date(w.lastYieldDate) : null;
    const toDate = new Date(today);
    if(!from || from >= toDate) { w.lastYieldDate = today; changed = true; return; }
    // Calculate days elapsed
    const msPerDay = 86400000;
    const days = Math.floor((toDate - from) / msPerDay);
    if(days <= 0) return;
    const dailyRate = Number(w.rendAnual) / 100 / 365;
    for(let d=0; d<days; d++){
      const dayDate = new Date(from.getTime() + (d+1)*msPerDay);
      const dateStr = dayDate.toISOString().split('T')[0];
      const rendMonto = Number(w.saldo||0) * dailyRate;
      if(rendMonto <= 0) continue;
      const txn = {
        id: Date.now() + d,
        tipo: 'ingreso',
        categoria: 'Rendimiento',
        monto: rendMonto,
        descripcion: `Rend. diario ${esc(w.nombre)} (${fmtPct(w.rendAnual)} TNA)`,
        fecha: dateStr,
        walletId: w.id,
        esRendimiento: true,
        walletNombre: w.nombre
      };
      state.txns.unshift(txn);
      w.saldo = Number(w.saldo||0) + rendMonto;
    }
    w.lastYieldDate = today;
    changed = true;
  });
  if(changed){
    save('ct_txns', state.txns);
    save('ct_wallets', state.wallets);
  }
}

// ─── GAMIFICACIÓN ───

function monthsSummary(){
  const m={};
  state.txns.forEach(t=>{
    const v=txnARS(t); if(v===null) return;
    const k=t.fecha.slice(0,7); m[k]=m[k]||{ing:0,gas:0};
    if(t.tipo==='ingreso') m[k].ing+=v; else m[k].gas+=v;
  });
  return m;
}
function streakInfo(){
  const days=new Set(state.txns.filter(t=>!t.esRendimiento).map(t=>t.fecha));
  const dayStr=d=>d.toISOString().split('T')[0];
  let cur=0, d=new Date();
  if(!days.has(dayStr(d))) d=new Date(d.getTime()-86400000);   // la racha sigue viva si cargaste ayer
  while(days.has(dayStr(d))){ cur++; d=new Date(d.getTime()-86400000); }
  let best=0, run=0, prev=null;
  [...days].sort().forEach(s=>{
    const t=new Date(s).getTime();
    run=(prev!==null && t-prev===86400000)?run+1:1; prev=t; best=Math.max(best,run);
  });
  return {cur,best:Math.max(best,cur)};
}
function gameStats(){
  const manual=state.txns.filter(t=>!t.esRendimiento);
  const months=monthsSummary();
  const green=Object.values(months).filter(x=>x.ing>x.gas&&x.ing>0).length;
  const goalsDone=state.goals.filter(g=>Number(g.ahorrado)>=Number(g.objetivo)&&g.objetivo>0).length;
  const defaults=new Set(DEFAULT_CATS.map(c=>c.tipo+c.nombre));
  const custom=state.cats.filter(c=>!defaults.has(c.tipo+c.nombre)).length;
  const st=streakInfo();
  const cm=months[todayStr().slice(0,7)]||{ing:0,gas:0};
  const monthSaved=cm.ing-cm.gas;
  const metaOk=state.settings.metaMensual>0 && Object.entries(months).some(([k,x])=>x.ing-x.gas>=state.settings.metaMensual);
  const badges=[
    {id:'first',   icon:'star',     name:'Primer paso',     desc:'Registrá tu primer movimiento', ok:manual.length>=1},
    {id:'ten',     icon:'list',     name:'Constante',       desc:'10 movimientos registrados',    ok:manual.length>=10},
    {id:'hundred', icon:'trophy',   name:'Imparable',       desc:'100 movimientos registrados',   ok:manual.length>=100},
    {id:'streak3', icon:'flame',    name:'Encendido',       desc:'Racha de 3 días',               ok:st.best>=3},
    {id:'streak7', icon:'flame',    name:'En llamas',       desc:'Racha de 7 días',               ok:st.best>=7},
    {id:'streak30',icon:'flame',    name:'Hábito de acero', desc:'Racha de 30 días',              ok:st.best>=30},
    {id:'green1',  icon:'trend',    name:'Mes en verde',    desc:'Un mes con más ingresos que gastos', ok:green>=1},
    {id:'green3',  icon:'coins',    name:'Ahorrista',       desc:'3 meses en verde',              ok:green>=3},
    {id:'goalset', icon:'target',   name:'Soñador',         desc:'Creá tu primera meta',          ok:state.goals.length>=1},
    {id:'goal1',   icon:'trophy',   name:'Meta cumplida',   desc:'Completá una meta de ahorro',   ok:goalsDone>=1},
    {id:'monthly', icon:'percent',  name:'Objetivo del mes',desc:'Alcanzá tu meta mensual de ahorro', ok:metaOk},
    {id:'investor',icon:'bank',     name:'Inversor',        desc:'Tené capital invertido',        ok:state.invest.some(i=>i.capital>0)},
    {id:'custom',  icon:'pencil',   name:'A mi manera',     desc:'Creá una categoría propia',     ok:custom>=1},
  ];
  return {streak:st.cur,best:st.best,green,goalsDone,monthSaved,badges};
}

// Celebra logros nuevos (se recuerda por dispositivo)
function checkAchievements(){
  const g=gameStats();
  let seen; try{ seen=JSON.parse(localStorage.getItem('ct_seen')||'null'); }catch(e){ seen=null; }
  const unlocked=g.badges.filter(b=>b.ok).map(b=>b.id);
  if(!seen){ try{ localStorage.setItem('ct_seen',JSON.stringify({badges:unlocked})); }catch(e){} return; }
  const nuevos=g.badges.filter(b=>b.ok&&!seen.badges.includes(b.id));
  if(nuevos.length){
    confetti();
    showToast(`Logro desbloqueado: ${nuevos[0].name}`);
  }
  try{ localStorage.setItem('ct_seen',JSON.stringify({badges:unlocked})); }catch(e){}
}

function confetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors=['#f0b90b','#ffd54a','#0ecb81','#f6465d','#3b82f6','#ec4899'];
  const wrap=document.createElement('div'); wrap.className='confetti';
  for(let i=0;i<70;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'%';
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*.4)+'s';
    p.style.animationDuration=(1.6+Math.random()*1.2)+'s';
    p.style.setProperty('--dx',(Math.random()*160-80)+'px');
    p.style.setProperty('--r',(Math.random()*720-360)+'deg');
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(),3200);
}

// Anillo de progreso
function progressRing(pct, size, color, inner){
  const sw=size*.1, r=size/2-sw/2, c=2*Math.PI*r, p=Math.max(0,Math.min(100,pct));
  return `<div class="pring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>
      <circle class="pring-arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" style="--c:${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
    </svg>
    <div class="pring-in">${inner}</div>
  </div>`;
}

  };
  if(!isNew) modal.querySelector('#gDel').onclick=()=>{
    if(!confirm(`¿Eliminar la meta "${goal.nombre}"?`)) return;
    state.goals=state.goals.filter(x=>x.id!==goal.id); save('ct_goals',state.goals); modal.remove(); render();
  };
}

function openGoalDetail(goal){
  const p=goal.objetivo>0?Math.min(100,goal.ahorrado/goal.objetivo*100):0;
  const falta=Math.max(0,goal.objetivo-goal.ahorrado);
  const modal=openModal(`
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px">
      ${progressRing(p,130,goal.color,`${catIcon({icon:goal.icon,color:goal.color},44)}<b style="margin-top:4px">${Math.round(p)}%</b>`)}
      <div class="modal-title" style="margin:6px 0 0">${esc(goal.nombre)}</div>
      <div class="list-sub">${fmt(goal.ahorrado)} de ${fmt(goal.objetivo)}${falta>0?` · faltan ${fmt(falta)}`:' · ¡cumplida!'}</div>
    </div>
    <div class="amount-box ingreso"><span class="amount-cur">$</span><input id="gdMonto" class="amount-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="gdAdd" class="btn btn-green btn-big" style="flex:1">Sumar</button>
      <button id="gdSub" class="btn btn-ghost btn-big" style="flex:1">Retirar</button>
    </div>
    <button id="gdEdit" class="btn btn-link" style="display:block;width:100%;margin-top:8px">Editar meta</button>`);
  bindMontoInput(modal.querySelector('#gdMonto'));
  const apply=sign=>{
    const v=parseMonto(modal.querySelector('#gdMonto').value);
    if(!v) return;
    const before=goal.ahorrado>=goal.objetivo;
    goal.ahorrado=Math.max(0,Number(goal.ahorrado||0)+sign*v);
    save('ct_goals',state.goals); modal.remove(); render();
    if(!before && goal.ahorrado>=goal.objetivo){ confetti(); showToast(`¡Cumpliste "${goal.nombre}"! 🏆`); }
    else showToast(sign>0?`+${fmt(v)} a ${goal.nombre}`:`-${fmt(v)} de ${goal.nombre}`);
  };
  modal.querySelector('#gdAdd').onclick=()=>apply(1);
  modal.querySelector('#gdSub').onclick=()=>apply(-1);
  modal.querySelector('#gdEdit').onclick=()=>{modal.remove();openGoalModal(goal);};
  setTimeout(()=>modal.querySelector('#gdMonto').focus(),50);
}

// ─── TEMA CLARO / OSCURO ───
function currentTheme(){ return document.documentElement.getAttribute('data-theme')||'dark'; }
function applyThemeUI(){
  const t=currentTheme();
  document.querySelectorAll('[data-theme-toggle]').forEach(b=>b.innerHTML=svgIcon(t==='dark'?'sun':'moon',18));
  document.querySelectorAll('[data-theme-toggle-side]').forEach(b=>b.innerHTML=`${svgIcon(t==='dark'?'sun':'moon',16)} Modo ${t==='dark'?'claro':'oscuro'}`);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t==='dark'?'#161a1f':'#ffffff');
}
function toggleTheme(){
  const t=currentTheme()==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  try{ localStorage.setItem('ct_theme',t); }catch(e){}
  applyThemeUI();
  render();
}
document.querySelectorAll('[data-theme-toggle],[data-theme-toggle-side]').forEach(b=>b.onclick=toggleTheme);
document.getElementById('menuBtn').innerHTML=svgIcon('menu',18);
document.getElementById('menuBtn').onclick=()=>{
  const modal=openModal(`
    <div class="modal-title">Pulso</div>
    <button class="menu-item" id="mTheme">${svgIcon(currentTheme()==='dark'?'sun':'moon',20)} Modo ${currentTheme()==='dark'?'claro':'oscuro'}</button>
    <button class="menu-item" id="mExport">${svgIcon('download',20)} Exportar datos</button>
    <label class="menu-item">${svgIcon('upload',20)} Importar datos<input type="file" id="mImport" accept=".json,.html,application/json,text/html" style="display:none"></label>`);
  modal.querySelector('#mTheme').onclick=()=>{modal.remove();toggleTheme();};
  modal.querySelector('#mExport').onclick=()=>{modal.remove();openExportModal();};
  modal.querySelector('#mImport').onchange=e=>{ modal.remove(); importDataFile(e.target.files[0]); e.target.value=''; };
};
applyThemeUI();

// ─── MAIN RENDER ───
let _lastTab=null;

  if(_lastTab!==state.tab){
    const a=document.querySelector('.app'); if(a) a.scrollTop=0; window.scrollTo(0,0); _lastTab=state.tab;
    const panel=document.getElementById('tab-'+state.tab);
    panel.classList.remove('enter'); void panel.offsetWidth; panel.classList.add('enter');
    setTimeout(()=>panel.classList.remove('enter'),900);

  renderSidebarShell();
  renderMenu();

  document.getElementById('tab-'+state.tab).classList.remove('hide');
  renderResumen();
  renderMovimientos();
  renderActivos();
  renderInversiones();
  renderMetas();

document.getElementById('fab').innerHTML=svgIcon('plus',26);
document.getElementById('fab').onclick=()=>{
  if(state.catFilter) openTxnModal(state.catFilter,state.viewTipo);
  else openAllCatsModal(state.viewTipo,false);
};

document.getElementById('sidebarCollapse').onclick=()=>{state.sidebarOpen=!state.sidebarOpen;renderSidebarShell()};

// ─── EXPORTAR / IMPORTAR DATOS ───
// Guarda un archivo: en el celular usa "Compartir" (permite Guardar en Archivos), si no, descarga directa
async function saveFile(content, filename, mime){
  const blob=new Blob([content],{type:mime});
  try{
    const file=new File([blob],filename,{type:mime});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)){
      await navigator.share({files:[file],title:filename});
      return true;
    }
  }catch(e){ if(e && e.name==='AbortError') return false; }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  return true;
}

function exportJSON(){
  const data={app:'Pulso',version:1,exportado:new Date().toISOString(),
    ct_txns:state.txns, ct_wallets:state.wallets, ct_invest:state.invest, ct_quotes:state.quotes, ct_cats:state.cats,
    ct_goals:state.goals, ct_settings:state.settings};
  return saveFile(JSON.stringify(data,null,2),`pulso-datos-${todayStr()}.json`,'application/json')
    .then(ok=>{ if(ok) showToast('Datos exportados'); });
}

function exportCSV(){
  const q=v=>{ const s=String(v??''); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const rows=[['Fecha','Tipo','Categoría','Monto','Moneda','Billetera','Descripción']];
  [...state.txns].sort((a,b)=>a.fecha<b.fecha?1:-1).forEach(t=>{
    const w=state.wallets.find(x=>x.id===t.walletId);
    rows.push([t.fecha, t.tipo==='ingreso'?'Ingreso':'Gasto', t.categoria,
      Number(t.monto).toLocaleString('es-AR',{useGrouping:false,maximumFractionDigits:8}),
      w?w.moneda:'', w?w.nombre:'', t.descripcion||'']);
  });
  const csv='﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'); // BOM + ';' para que Excel lo abra bien
  return saveFile(csv,`pulso-movimientos-${todayStr()}.csv`,'text/csv')
    .then(ok=>{ if(ok) showToast('Movimientos exportados'); });
}

function openExportModal(){
  const modal=openModal(`
    <div class="modal-title">Exportar datos</div>
    <button class="menu-item" id="exJson">${svgIcon('download',20)}<div><div>Copia completa</div><div class="list-sub">Todo: movimientos, billeteras, inversiones y categorías (.json). Sirve para importar después.</div></div></button>
    <button class="menu-item" id="exCsv">${svgIcon('list',20)}<div><div>Movimientos para Excel</div><div class="list-sub">Planilla con todos los movimientos (.csv)</div></div></button>`);
  modal.querySelector('#exJson').onclick=()=>{modal.remove();exportJSON();};
  modal.querySelector('#exCsv').onclick=()=>{modal.remove();exportCSV();};
}

function importDataFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    let data;
    try{
      // Acepta la copia .json o un .html viejo con los datos embebidos (SAVED_DATA)
      const txt=ev.target.result;
      const m=txt.match(/<script id="SAVED_DATA"[^>]*>([\s\S]*?)<\/script>/);
      data=JSON.parse(m?m[1]:txt);
    }catch(e){ alert('El archivo no es válido.'); return; }
    if(!data || !(Array.isArray(data.ct_txns)||Array.isArray(data.ct_wallets))){ alert('El archivo no tiene datos de Pulso.'); return; }
    const n=(data.ct_txns||[]).length, w=(data.ct_wallets||[]).length;
    if(!confirm(`Se van a importar ${n} movimientos y ${w} billeteras.\nEsto reemplaza los datos actuales. ¿Continuar?`)) return;
    const map={ct_txns:'txns',ct_wallets:'wallets',ct_invest:'invest',ct_quotes:'quotes',ct_cats:'cats',ct_goals:'goals',ct_settings:'settings'};
    Object.entries(map).forEach(([k,prop])=>{ if(data[k]!==undefined){ state[prop]=data[k]; save(k,data[k]); } });
    render();
    showToast('Datos importados');
  };
  reader.readAsText(file);
}

document.getElementById('exportBtn').onclick=openExportModal;
document.getElementById('importFile').onchange=e=>{ importDataFile(e.target.files[0]); e.target.value=''; };
applyDailyYields();
render();
</script>
